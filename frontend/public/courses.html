<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
  <title>Course catalog · Wuteve Global Academy</title>
  <meta name="description" content="Browse every course at Wuteve Global Academy. Filter by category, level and price." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/wga-shell.css?v=20261020" />
  <style>
    .catalog-head { padding: 26px 0 22px; }
    .catalog-head h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.8px; margin-bottom: 8px; }
    .catalog-head p { color: var(--text-light); font-size: 15.5px; }
    body.dark-mode .catalog-head p { color: var(--dark-muted); }

    .filters {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 16px; margin-bottom: 26px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    }
    body.dark-mode .filters { background: var(--dark-surface); border-color: var(--dark-border); }
    .filters .grow { flex: 1 1 240px; min-width: 200px; }
    .filters select { flex: 0 1 170px; }
    .filters .wga-input, .filters .wga-select { padding: 11px 13px; }

    .results-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; font-size: 14px; color: var(--text-light);
    }
    body.dark-mode .results-bar { color: var(--dark-muted); }

    .pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 34px; }

    .card-locked {
      position: absolute; top: 10px; right: 10px;
      background: rgba(15,23,42,.72); color: #fff; font-size: 11px;
      padding: 4px 10px; border-radius: 999px; font-weight: 600;
    }
    .thumb-wrap { position: relative; }
  </style>
</head>
<body>
  <header class="wga-header">
    <a class="wga-brand" href="/">
      <img class="brand-mark" src="/Images/Brand/wuteve-emblem.png" alt="" width="34" height="34" />
      Wuteve <span class="accent">Global Academy</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="wga-btn wga-btn-ghost" id="dashboard-link" href="/login.html" style="padding:10px 18px;font-size:14px;">
        <i class="fas fa-right-to-bracket" aria-hidden="true"></i> <span id="dashboard-label">Sign in</span>
      </a>
      <button class="wga-theme-toggle" data-theme-toggle type="button" aria-label="Toggle colour theme">🌙</button>
    </div>
  </header>

  <main class="wga-main">
    <div class="catalog-head">
      <h1>Course catalog</h1>
      <p>Every published course, taught by our instructors. Free courses start immediately.</p>
    </div>

    <form class="filters" id="filters">
      <div class="grow">
        <input class="wga-input" type="search" id="q" name="q" placeholder="Search courses, topics or instructors…"
               autocomplete="off" aria-label="Search courses" />
      </div>

      <select class="wga-select" id="category" name="category" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>

      <select class="wga-select" id="credential" name="credential" aria-label="Filter by credential">
        <option value="">Any credential</option>
      </select>

      <select class="wga-select" id="level" name="level" aria-label="Filter by level">
        <option value="">All levels</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>

      <select class="wga-select" id="price" name="price" aria-label="Filter by price">
        <option value="">Any price</option>
        <option value="free">Free</option>
        <option value="paid">Paid</option>
      </select>

      <select class="wga-select" id="sort" name="sort" aria-label="Sort results">
        <option value="newest">Newest first</option>
        <option value="popular">Most popular</option>
        <option value="rating">Highest rated</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="title">Title A–Z</option>
      </select>
    </form>

    <div class="results-bar">
      <span id="count">Loading courses…</span>
      <button class="wga-btn wga-btn-ghost" type="button" id="clear" style="display:none;padding:8px 15px;font-size:13px;">
        <i class="fas fa-xmark" aria-hidden="true"></i> Clear filters
      </button>
    </div>

    <div class="wga-grid wga-grid-cards" id="results" aria-live="polite"></div>

    <div class="pager" id="pager" style="display:none;">
      <button class="wga-btn wga-btn-ghost" type="button" id="prev">
        <i class="fas fa-chevron-left" aria-hidden="true"></i> Previous
      </button>
      <span id="page-label" class="wga-muted"></span>
      <button class="wga-btn wga-btn-ghost" type="button" id="next">
        Next <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </main>

  <script src="/assets/js/wga-api.js?v=20261020"></script>
  <script src="/assets/js/wga-ui.js?v=20261020"></script>
  <script>
    (function () {
      'use strict';

      WGAUI.initTheme();

      var results = document.getElementById('results');
      var count = document.getElementById('count');
      var pager = document.getElementById('pager');
      var pageLabel = document.getElementById('page-label');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var clearButton = document.getElementById('clear');

      var state = { page: 1, limit: 12, totalPages: 1 };

      /** Keep the URL in step with the filters, so a result set is shareable. */
      function readFilters() {
        var params = new URLSearchParams(window.location.search);
        return {
          q: params.get('q') || '',
          category: params.get('category') || '',
          credential: params.get('credential') || '',
          level: params.get('level') || '',
          price: params.get('price') || '',
          sort: params.get('sort') || 'newest',
          page: Math.max(1, parseInt(params.get('page'), 10) || 1)
        };
      }

      function writeFilters(filters) {
        var params = new URLSearchParams();
        Object.keys(filters).forEach(function (key) {
          var value = filters[key];
          if (value && !(key === 'sort' && value === 'newest') && !(key === 'page' && value === 1)) {
            params.set(key, value);
          }
        });

        var query = params.toString();
        window.history.replaceState({}, '', query ? '/courses.html?' + query : '/courses.html');
      }

      function applyFiltersToControls(filters) {
        document.getElementById('q').value = filters.q;
        document.getElementById('category').value = filters.category;
        document.getElementById('credential').value = filters.credential;
        document.getElementById('level').value = filters.level;
        document.getElementById('price').value = filters.price;
        document.getElementById('sort').value = filters.sort;
      }

      function currentControls(page) {
        var filters = readFilters();
        filters.q = document.getElementById('q').value.trim();
        filters.category = document.getElementById('category').value;
        filters.credential = document.getElementById('credential').value;
        filters.level = document.getElementById('level').value;
        filters.price = document.getElementById('price').value;
        filters.sort = document.getElementById('sort').value;
        filters.page = page || 1;
        return filters;
      }

      function hasActiveFilters(filters) {
        return Boolean(filters.q || filters.category || filters.credential || filters.level || filters.price);
      }

      function skeleton() {
        var markup = '';
        for (var index = 0; index < 6; index += 1) {
          markup +=
            '<div class="wga-course-card" style="pointer-events:none;">' +
            '<div class="wga-course-thumb-fallback wga-skeleton"></div>' +
            '<div class="wga-course-body">' +
            '<div class="wga-skeleton" style="height:18px;width:80%;"></div>' +
            '<div class="wga-skeleton" style="height:14px;width:100%;"></div>' +
            '<div class="wga-skeleton" style="height:14px;width:60%;"></div>' +
            '</div></div>';
        }
        results.innerHTML = markup;
      }

      /**
       * The card itself lives in WGAUI.courseCard, shared with the homepage and
       * the audience pages.
       *
       * It used to be written out here as well, and the two copies drifted: this
       * one showed an enrolled count the homepage did not, the homepage showed a
       * rating this one could not, and a change made in either place reached only
       * half the site.
       */
      function courseCard(course) {
        return WGAUI.courseCard(course);
      }

      function load(filters) {
        skeleton();
        count.textContent = 'Loading courses…';
        pager.style.display = 'none';

        WGA.get('/courses', {
          query: {
            q: filters.q,
            category: filters.category,
            credential: filters.credential,
            level: filters.level,
            price: filters.price,
            sort: filters.sort,
            page: filters.page,
            limit: state.limit
          }
        })
          .then(function (data) {
            state.totalPages = data.pagination.totalPages;

            if (!data.items.length) {
              results.innerHTML = WGAUI.emptyState(
                hasActiveFilters(filters)
                  ? 'No courses match those filters'
                  : 'No courses are published yet',
                hasActiveFilters(filters)
                  ? 'Try a different search term, or clear the filters.'
                  : 'Please check back soon.'
              );
            } else {
              results.innerHTML = data.items.map(courseCard).join('');
            }

            count.textContent =
              data.pagination.total === 1
                ? '1 course'
                : data.pagination.total + ' courses';

            clearButton.style.display = hasActiveFilters(filters) ? '' : 'none';

            if (state.totalPages > 1) {
              pager.style.display = '';
              pageLabel.textContent = 'Page ' + data.pagination.page + ' of ' + data.pagination.totalPages;
              prev.disabled = !data.pagination.hasPrevPage;
              next.disabled = !data.pagination.hasNextPage;
            }
          })
          .catch(function (error) {
            results.innerHTML = WGAUI.emptyState('We could not load the catalog', error.message || 'Please try again.');
            count.textContent = '';
          });
      }

      function apply(page) {
        var filters = currentControls(page);
        writeFilters(filters);
        load(filters);
      }

      /**
       * Filter options come from the server, so the lists can never drift from
       * the courses that actually exist.
       *
       * Categories are facets — only the ones with published courses, each with
       * its count — because offering a category that returns nothing looks like
       * a broken site. Credentials are the fixed vocabulary, deliberately
       * without `degree`: the catalog must not imply a qualification the
       * academy cannot award.
       */
      Promise.all([
        WGA.get('/courses/categories').catch(function () { return { categories: [] }; }),
        WGA.get('/courses/taxonomy').catch(function () { return { credentials: [] }; })
      ]).then(function (responses) {
        var facets = responses[0].categories || [];
        var taxonomy = responses[1].credentials || [];

        // Shared with WGAUI.courseCard, so a card prints the label the filter
        // prints rather than the slug the course is filed under.
        WGAUI.setCategoryLabels(facets);

        var categorySelect = document.getElementById('category');
        facets.forEach(function (category) {
          var option = document.createElement('option');
          option.value = category.name;
          option.textContent = (category.label || category.name) + ' (' + category.count + ')';
          categorySelect.appendChild(option);
        });

        var credentialSelect = document.getElementById('credential');
        taxonomy.forEach(function (credential) {
          var option = document.createElement('option');
          option.value = credential.slug;
          option.textContent = credential.label;
          credentialSelect.appendChild(option);
        });

        var initial = readFilters();
        applyFiltersToControls(initial);
        apply(initial.page);
      });

      document.getElementById('filters').addEventListener('submit', function (event) {
        event.preventDefault();
        apply(1);
      });

      var debounce = null;
      document.getElementById('q').addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(function () { apply(1); }, 380);
      });

      ['category', 'credential', 'level', 'price', 'sort'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () { apply(1); });
      });

      clearButton.addEventListener('click', function () {
        document.getElementById('q').value = '';
        document.getElementById('category').value = '';
        document.getElementById('credential').value = '';
        document.getElementById('level').value = '';
        document.getElementById('price').value = '';
        document.getElementById('sort').value = 'newest';
        apply(1);
      });

      prev.addEventListener('click', function () {
        if (state.totalPages > 1) apply(Math.max(1, parseInt(readFilters().page, 10) - 1));
      });

      next.addEventListener('click', function () {
        var current = parseInt(readFilters().page, 10);
        if (current < state.totalPages) apply(current + 1);
      });

      // Point the header button at the right place for whoever is reading.
      if (WGA.isSignedIn()) {
        var user = WGA.getUser();
        document.getElementById('dashboard-link').href = WGA.homeForRole(user && user.role);
        document.getElementById('dashboard-label').textContent = 'My dashboard';
      }
    })();
  </script>
  <footer class="wga-footer">
    <a href="/">Home</a>
    <a href="/courses.html">Courses</a>
    <a href="/terms.html">Terms of Service</a>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/contact.html">Contact</a>
  </footer>

</body>
</html>
