<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
  <title>Choose a new password · Wuteve Global Academy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/wga-shell.css?v=20261031" />
</head>
<body>
  <header class="wga-header">
    <a class="wga-brand" href="/">
      <img class="brand-mark" src="/Images/Brand/wuteve-emblem.png" alt="" width="34" height="34" />
      Wuteve <span class="accent">Global Academy</span>
    </a>
    <button class="wga-theme-toggle" data-theme-toggle type="button" aria-label="Toggle colour theme">🌙</button>
  </header>

  <main class="wga-main wga-narrow">
    <div class="wga-card">
      <h1>Choose a new password</h1>
      <p>Pick something you have not used before. You will be signed out of every device.</p>

      <div class="wga-alert" id="status" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="wga-field">
          <label class="wga-label" for="password">New password</label>
          <input class="wga-input" type="password" id="password" name="password"
                 autocomplete="new-password" required />
          <p class="wga-hint">At least 8 characters, including a letter and a number.</p>
        </div>

        <div class="wga-field">
          <label class="wga-label" for="confirm">Confirm new password</label>
          <input class="wga-input" type="password" id="confirm" name="confirm"
                 autocomplete="new-password" required />
        </div>

        <button class="wga-btn wga-btn-primary wga-btn-block" type="submit" id="submit"
                data-original-html="<i class='fas fa-key' aria-hidden='true'></i> Set new password">
          <i class="fas fa-key" aria-hidden="true"></i>
          Set new password
        </button>
      </form>
    </div>
  </main>

  <script src="/assets/js/wga-api.js?v=20261021"></script>
  <script src="/assets/js/wga-ui.js?v=20261021"></script>
  <script>
    (function () {
      'use strict';

      WGAUI.initTheme();

      var form = document.getElementById('reset-form');
      var button = document.getElementById('submit');
      var statusBox = document.getElementById('status');
      var token = WGAUI.param('token');

      // A link without a token is not recoverable, so do not show a form that
      // cannot possibly succeed.
      if (!token) {
        WGAUI.status(statusBox, 'This link is incomplete or has expired. Please request a new one.', 'error');
        form.style.display = 'none';

        var request = document.createElement('a');
        request.className = 'wga-btn wga-btn-primary wga-btn-block';
        request.href = '/forgot-password.html';
        request.innerHTML = '<i class="fas fa-paper-plane" aria-hidden="true"></i> Request a new link';
        form.parentNode.insertBefore(request, form);
        return;
      }

      function policyProblem(password) {
        if (password.length < 8) return 'Password must be at least 8 characters.';
        if (password.length > 72) return 'Password must be at most 72 characters.';
        if (!/[A-Za-z]/.test(password)) return 'Password must contain at least one letter.';
        if (!/[0-9]/.test(password)) return 'Password must contain at least one number.';
        return null;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var password = document.getElementById('password').value;
        var confirm = document.getElementById('confirm').value;

        // Checked here for a faster response; the server enforces the same
        // rules and is the authority.
        var problem = policyProblem(password);
        if (problem) {
          WGAUI.status(statusBox, problem, 'error');
          return;
        }

        if (password !== confirm) {
          WGAUI.status(statusBox, 'The two passwords do not match.', 'error');
          return;
        }

        WGAUI.status(statusBox, null);
        WGAUI.setBusy(button, true, 'Saving…');

        WGA.post('/auth/reset-password', { token: token, password: password })
          .then(function () {
            WGAUI.status(statusBox, 'Your password has been reset. Redirecting you to sign in…', 'success');
            form.style.display = 'none';

            setTimeout(function () {
              // `reset=1` lets the sign-in page confirm what just happened.
              window.location.href = '/login.html?reset=1';
            }, 1600);
          })
          .catch(function (error) {
            WGAUI.setBusy(button, false);

            if (error.status === 401) {
              WGAUI.status(
                statusBox,
                'This reset link is invalid, already used, or has expired. Please request a new one.',
                'error'
              );
              return;
            }

            if (error.details && error.details.length) {
              WGAUI.showFieldErrors(form, error.details);
              WGAUI.status(statusBox, error.details[0].message, 'error');
              return;
            }

            WGAUI.status(statusBox, error.message || 'We could not reset your password. Please try again.', 'error');
          });
      });
    })();
  </script>
