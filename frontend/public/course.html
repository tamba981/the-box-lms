<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
  <title>Course · Wuteve Global Academy</title>
  <meta name="description" content="Course details, syllabus and enrolment." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/wga-shell.css?v=20261031" />
  <style>
    .hero {
      display: grid; grid-template-columns: 1.6fr 1fr; gap: 30px;
      padding: 14px 0 30px; align-items: start;
    }
    @media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }

    .hero h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.8px; line-height: 1.2; margin: 12px 0 14px; }
    .hero .lede { font-size: 16px; color: var(--text-light); margin-bottom: 18px; }
    body.dark-mode .hero .lede { color: var(--dark-muted); }

    .meta-row { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; color: var(--text-light); }
    body.dark-mode .meta-row { color: var(--dark-muted); }
    .meta-row span { display: inline-flex; align-items: center; gap: 7px; }

    .buy-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 26px; box-shadow: var(--shadow); position: sticky; top: 20px;
    }
    body.dark-mode .buy-card { background: var(--dark-surface); border-color: var(--dark-border); box-shadow: none; }
    .buy-price { font-size: 30px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }

    .section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin: 34px 0 14px; }

    .lesson-row {
      display: flex; align-items: center; gap: 14px; padding: 13px 16px;
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 9px;
      background: var(--surface); font-size: 14.5px;
      /* The expanded body is a second flex child, so the row has to be able to
         put it on its own line - side by side it squeezed the body to 155px and
         pushed the page 54px wider than a 375px viewport. */
      flex-wrap: wrap;
    }
    body.dark-mode .lesson-row { background: var(--dark-surface); border-color: var(--dark-border); }
    .lesson-row .num {
      width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: rgba(26,86,219,.12); color: var(--primary);
    }
    body.dark-mode .lesson-row .num { background: rgba(59,130,246,.2); color: var(--primary-light); }
    .lesson-row .grow { flex: 1; }
    .lesson-row .tag { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-light); }
    body.dark-mode .lesson-row .tag { color: var(--dark-muted); }
    /* "Preview" is the one tag with a colour of its own. It used to carry an
       inline var(--primary), and an inline style cannot follow the theme — so it
       stayed at 2.37:1 on the dark row. A class can. */
    .lesson-row .tag.tag-preview { color: var(--primary); }
    body.dark-mode .lesson-row .tag.tag-preview { color: var(--dark-link); }
    .lesson-row.done .num { background: rgba(16,185,129,.16); color: #047857; }

    /* ---- Lesson viewer ------------------------------------------------ *
     * One lesson at a time, opened in place above the syllabus. Opening in
     * place rather than navigating keeps the syllabus where the reader left
     * it, and means the back button cannot dump them somewhere unexpected.
     * -------------------------------------------------------------------- */
    .lesson-open {
      font: inherit; color: inherit; background: none; border: 0;
      padding: 0; margin: 0; width: 100%; text-align: left;
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      border-radius: 12px;
    }
    .lesson-open:hover .grow { text-decoration: underline; }
    .lesson-row.is-open { border-color: var(--primary); }
    .lesson-row.is-locked { opacity: .68; }

    .viewer { margin: 22px 0 8px; }
    .viewer-head {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 14px;
    }
    .viewer-head h2 {
      font-size: 21px; font-weight: 800; letter-spacing: -0.4px;
      margin: 0; flex: 1 1 220px; line-height: 1.3;
    }
    .viewer-media { margin-bottom: 20px; }
    .viewer-media .aspect {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #000; border-radius: 14px; overflow: hidden;
    }
    .viewer-media video,
    .viewer-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .viewer-body { font-size: 16px; line-height: 1.8; }
    /* Older lessons are plain text; `pre-line` keeps their paragraph breaks. */
    .viewer-body.is-plain { white-space: pre-line; }
    .viewer-body.is-rich > :first-child { margin-top: 0; }
    .viewer-body.is-rich p { margin: 0 0 14px; }
    .viewer-body.is-rich h2 { font-size: 21px; margin: 22px 0 8px; }
    .viewer-body.is-rich h3 { font-size: 18px; margin: 18px 0 6px; }
    .viewer-body.is-rich h4 { font-size: 16px; margin: 14px 0 6px; }
    .viewer-body.is-rich ul,
    .viewer-body.is-rich ol { margin: 0 0 14px; padding-left: 24px; }
    .viewer-body.is-rich li { margin-bottom: 6px; }
    .viewer-body.is-rich blockquote {
      margin: 14px 0; padding: 2px 0 2px 16px;
      border-left: 3px solid rgba(26, 86, 219, .3); color: #4a5568;
    }
    .viewer-body.is-rich a { color: var(--primary, #1a56db); text-decoration: underline; }
    .viewer-body.is-rich pre {
      background: #0f172a; color: #e2e8f0; padding: 14px 16px; border-radius: 10px;
      overflow-x: auto; font-size: 13.5px; line-height: 1.6;
    }
    .viewer-body.is-rich code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em;
    }
    .viewer-body.is-rich .ql-align-center { text-align: center; }
    .viewer-body.is-rich .ql-align-right { text-align: right; }
    .viewer-body.is-rich .ql-align-justify { text-align: justify; }
    .viewer-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
    .viewer-nav .spacer { flex: 1 1 auto; }
    .resource-list { list-style: none; margin: 10px 0 0; padding: 0; }
    .resource-list li { margin-bottom: 7px; }
    .resource-list a { display: inline-flex; align-items: center; gap: 9px; font-size: 14.5px; }

    /* ---- Quiz --------------------------------------------------------- */
    .quiz-card {
      margin-top: 26px; padding: 22px; border-radius: 16px;
      background: var(--surface); border: 1px solid var(--border);
    }
    body.dark-mode .quiz-card { background: var(--dark-surface); border-color: var(--dark-border); }
    .quiz-head h3 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
    .quiz-question {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin: 16px 0 0; min-width: 0;
    }
    body.dark-mode .quiz-question { border-color: var(--dark-border); }
    .quiz-question legend { font-size: 15px; font-weight: 600; padding: 0 6px; }
    .quiz-num {
      display: inline-grid; place-items: center; width: 22px; height: 22px;
      border-radius: 50%; font-size: 11.5px; font-weight: 700; margin-right: 6px;
      background: rgba(26,86,219,.12); color: var(--primary);
    }
    body.dark-mode .quiz-num { background: rgba(255,255,255,.08); color: var(--dark-link); }
    .quiz-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 11px; border-radius: 9px; cursor: pointer; font-size: 15px;
    }
    .quiz-option:hover { background: rgba(26,86,219,.06); }
    body.dark-mode .quiz-option:hover { background: rgba(255,255,255,.05); }
    .quiz-option input { margin-top: 3px; }
    .quiz-score {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 14px 16px; border-radius: 12px; margin-bottom: 16px;
    }
    .quiz-score strong { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
    .quiz-score.is-pass { background: rgba(16,185,129,.14); color: #047857; }
    .quiz-score.is-fail { background: rgba(220,38,38,.10); color: #b91c1c; }
    body.dark-mode .quiz-score.is-pass { background: rgba(16,185,129,.18); color: #6ee7b7; }
    body.dark-mode .quiz-score.is-fail { background: rgba(220,38,38,.20); color: #fca5a5; }
    .quiz-review-row {
      border-left: 3px solid var(--border); padding: 4px 0 10px 12px; margin-bottom: 14px;
    }
    .quiz-review-row.is-right { border-left-color: #10b981; }
    .quiz-review-row.is-wrong { border-left-color: #dc2626; }
    .quiz-review-head { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .quiz-mark { font-size: 12px; font-weight: 700; margin-left: 8px; text-transform: uppercase; letter-spacing: .4px; }
    .quiz-review-row.is-right .quiz-mark { color: #047857; }
    .quiz-review-row.is-wrong .quiz-mark { color: #b91c1c; }
    body.dark-mode .quiz-review-row.is-right .quiz-mark { color: #6ee7b7; }
    body.dark-mode .quiz-review-row.is-wrong .quiz-mark { color: #fca5a5; }
    .quiz-review-option { font-size: 14.5px; color: var(--text-light); padding: 3px 0; }
    body.dark-mode .quiz-review-option { color: var(--dark-muted); }
    .quiz-review-option.is-key { color: #047857; font-weight: 600; }
    body.dark-mode .quiz-review-option.is-key { color: #6ee7b7; }
    .quiz-review-option.is-chosen { font-weight: 600; }
    .quiz-why { font-size: 14px; color: var(--text-light); margin-top: 8px; font-style: italic; }
    body.dark-mode .quiz-why { color: var(--dark-muted); }

    /* ---- Quiz authoring (dashboard) ---------------------------------- */
    .quiz-q-editor {
      border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .quiz-q-editor-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .quiz-opt-row { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
    .quiz-opt-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
    .quiz-opt-row label { white-space: nowrap; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }

    /* Upload progress, used by the instructor authoring form. */
    .upload-bar { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 8px; }
    body.dark-mode .upload-bar { background: var(--dark-border); }
    .upload-bar span { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s ease; }

    .pre { white-space: pre-line; font-size: 15px; line-height: 1.75; }
    .desc { font-size: 15px; line-height: 1.75; color: var(--text-light); }
    body.dark-mode .desc { color: var(--dark-muted); }

    /* ---- Payment method chooser -------------------------------------- *
     * A payer has to be able to tell, before clicking, which methods will
     * actually work. Unavailable options are rendered with the `disabled`
     * attribute rather than merely greyed, so they cannot be reached by
     * keyboard and are announced as unavailable rather than as choices.
     * ------------------------------------------------------------------- */
    .pay-choice {
      display: flex; gap: 12px; align-items: flex-start;
      width: 100%; text-align: left; font: inherit; color: inherit;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 13px; margin-bottom: 9px;
      cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .pay-choice:not(:disabled):hover { border-color: var(--primary); }
    .pay-choice[aria-pressed="true"] {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,86,219,.14);
    }
    .pay-choice[disabled] { cursor: not-allowed; opacity: .6; }

    .pay-choice .pay-icon {
      width: 32px; height: 32px; flex: 0 0 32px; border-radius: 9px;
      display: grid; place-items: center; font-size: 14px;
      background: rgba(26,86,219,.12); color: var(--primary);
    }
    .pay-choice[aria-pressed="true"] .pay-icon { background: var(--primary); color: #fff; }
    .pay-choice[disabled] .pay-icon { background: rgba(120,120,130,.15); color: var(--text-light); }

    .pay-choice .pay-name { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.3; }
    .pay-choice .pay-why { display: block; font-size: 12.5px; color: var(--text-light); line-height: 1.45; margin-top: 3px; }
    .pay-choice .pay-missing {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px; color: var(--text-light); margin-top: 5px; overflow-wrap: anywhere;
    }

    body.dark-mode .pay-choice { background: var(--dark-surface); border-color: var(--dark-border); }
    body.dark-mode .pay-choice .pay-why,
    body.dark-mode .pay-choice .pay-missing,
    body.dark-mode .pay-choice[disabled] .pay-icon { color: var(--dark-muted); }

    .pay-panel {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 15px; font-size: 14px; line-height: 1.6;
      background: rgba(26,86,219,.06);
    }
    .pay-panel .pay-panel-title { display: block; font-weight: 700; margin-bottom: 7px; }
    .pay-panel i { color: var(--primary); }
    body.dark-mode .pay-panel { border-color: var(--dark-border); background: rgba(59,130,246,.1); }
    .pay-panel-wait { background: rgba(212,165,71,.1); }
    body.dark-mode .pay-panel-wait { background: rgba(212,165,71,.14); }

    /*
     * The manual-order screen. The reference is the one thing on it that the
     * student has to carry somewhere else — into a mobile money app, or onto the
     * phone to whoever confirms it — so it gets its own row, large type and a
     * copy button rather than being buried in a sentence.
     */
    .pay-ref {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 10px 0 4px; padding: 10px 12px;
      background: var(--surface); border: 1px dashed var(--primary);
      border-radius: 10px;
    }
    .pay-ref-value {
      flex: 1 1 auto; min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px; font-weight: 700; letter-spacing: .4px;
      overflow-wrap: anywhere;
    }
    body.dark-mode .pay-ref { background: var(--dark-bg); border-color: var(--primary-light); }

    .pay-numbers { list-style: none; margin: 9px 0 0; padding: 0; }
    .pay-numbers li {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }
    .pay-numbers li:last-child { border-bottom: 0; }
    body.dark-mode .pay-numbers li { border-color: var(--dark-border); }

    .pay-copy {
      flex: 0 0 auto; font: inherit; font-size: 12px; font-weight: 700;
      padding: 5px 11px; border-radius: 7px; cursor: pointer;
      background: rgba(26,86,219,.12); color: var(--primary);
      border: 1px solid rgba(26,86,219,.25);
    }
    .pay-copy:hover { background: rgba(26,86,219,.2); }
    body.dark-mode .pay-copy {
      background: rgba(59,130,246,.18); color: var(--dark-link-soft);
      border-color: rgba(59,130,246,.3);
    }

    .pay-steps { margin: 10px 0 0; padding-left: 20px; font-size: 13px; }
    .pay-steps li { margin-bottom: 5px; }

    /* ---------- Breadcrumb ---------- */
    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 18px 0 4px;
      font-size: 13.5px;
      color: var(--text-light);
    }
    body.dark-mode .breadcrumb { color: var(--dark-muted); }
    .breadcrumb a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .breadcrumb a:hover { color: var(--primary); border-bottom-color: currentColor; }
    body.dark-mode .breadcrumb a:hover { color: var(--dark-link); }
    .breadcrumb [aria-current='page'] {
      color: inherit;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- Tabs ---------- */
    .course-tabs {
      display: flex;
      gap: 4px;
      margin: 26px 0 22px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    body.dark-mode .course-tabs { border-color: var(--dark-border); }
    .course-tabs::-webkit-scrollbar { display: none; }

    .course-tab {
      appearance: none;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: transparent;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-light);
      white-space: nowrap;
      cursor: pointer;
    }
    body.dark-mode .course-tab { color: var(--dark-muted); }
    .course-tab:hover { color: var(--primary); }
    body.dark-mode .course-tab:hover { color: var(--dark-link); }
    .course-tab[aria-selected='true'] {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    body.dark-mode .course-tab[aria-selected='true'] {
      color: var(--dark-link);
      border-bottom-color: var(--dark-link);
    }

    .course-panel:focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 4px;
      border-radius: 6px;
    }

    /* ---------- Syllabus rows that expand in place ---------- */
    .lesson-chev {
      flex: 0 0 auto;
      margin-left: 4px;
      color: var(--text-light);
      font-size: 12px;
      transition: transform 0.18s ease;
    }
    .lesson-open[aria-expanded='true'] .lesson-chev { transform: rotate(180deg); }

    .lesson-body {
      flex: 0 0 100%;
      min-width: 0;
      padding: 12px 2px 4px;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    body.dark-mode .lesson-body { border-color: var(--dark-border); }
    .lesson-body .viewer-media { margin-top: 12px; }
    .lesson-body .viewer-body { margin-top: 12px; }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }
    .lesson-actions .lesson-done {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--success, #047857);
    }

    /* ---------- What this course covers ---------- */
    .covers-list {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      display: grid;
      gap: 9px;
    }
    .covers-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
      line-height: 1.5;
    }
    .covers-list i {
      color: var(--primary);
      font-size: 12px;
      margin-top: 5px;
      flex: 0 0 auto;
    }
    body.dark-mode .covers-list i { color: var(--dark-link); }

    .covers-more {
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }
    body.dark-mode .covers-more { color: var(--dark-link); }

    /* ---------- Reviews ---------- */
    .review-summary {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      padding: 18px 20px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
    }
    body.dark-mode .review-summary { background: var(--dark-surface); border-color: var(--dark-border); }
    .review-score { font-size: 38px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
    .review-stars { color: var(--gold); font-size: 13px; letter-spacing: 2px; white-space: nowrap; }
    .review-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
    body.dark-mode .review-item { border-color: var(--dark-border); }
    .review-item:last-of-type { border-bottom: 0; }
    .review-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .review-name { font-weight: 700; font-size: 14.5px; }
    .review-date { font-size: 12.5px; color: var(--text-light); }
    body.dark-mode .review-date { color: var(--dark-muted); }
    .review-title { font-weight: 700; margin: 0 0 4px; }
    .review-body { margin: 0; font-size: 14.5px; line-height: 1.65; }

    .review-form {
      margin-top: 22px; padding: 20px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
    }
    body.dark-mode .review-form { background: var(--dark-surface); border-color: var(--dark-border); }
    .review-form .field + .field { margin-top: 14px; }
    .review-form label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .review-form textarea { min-height: 120px; resize: vertical; }
    .review-notice { font-size: 13.5px; padding: 10px 12px; border-radius: 10px; margin: 0 0 14px; }
    .review-notice.pending { background: rgba(245, 158, 11, .12); color: #92400e; }
    .review-notice.rejected { background: rgba(239, 68, 68, .12); color: #b91c1c; }
    body.dark-mode .review-notice.pending { color: #fbbf24; }
    body.dark-mode .review-notice.rejected { color: #f87171; }

    /* ---------- Course layout: content column + sticky buy card ----------
       The card was already `position: sticky`, but it sat inside a short hero,
       so it had nothing to stick to. The tabs and panels now share the left
       column, which is as tall as the page - that is what gives the card a
       useful range. */
    .course-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 34px;
      align-items: start;
      padding: 14px 0 30px;
    }

    .course-main-col { min-width: 0; }

    /* ---------- Mobile buy bar ---------- */
    .mobile-buy-bar { display: none; }

    @media (max-width: 899px) {
      .course-layout {

<body>
  <header class="wga-header">

  <main class="wga-main" id="main">
    <div class="wga-card" id="loading">
      <div class="wga-skeleton" style="height:28px;width:60%;margin-bottom:16px;"></div>
      <div class="wga-skeleton" style="height:16px;width:90%;margin-bottom:10px;"></div>
      <div class="wga-skeleton" style="height:16px;width:75%;"></div>
    </div>
  </main>

  <script src="/assets/js/wga-api.js?v=20261021"></script>
  <script src="/assets/js/wga-ui.js?v=20261036"></script>
  <!-- The AI panel is only needed once a lesson is open, so the module is loaded
       from that moment rather than on every course page view. -->
  <script src="/assets/js/wga-ai.js?v=20261034"></script>
  <script>
    (function () {
      'use strict';

      WGAUI.initTheme();

      var main = document.getElementById('main');

      function identifier() {
        return WGAUI.param('course') || WGAUI.param('slug') || WGAUI.param('id') || '';
      }

/** "12 min" under an hour, "1h 5m" above it. */
      function durationLabel(minutes) {
        var total = Math.round(Number(minutes) || 0);
        if (total <= 0) return '';
        if (total < 60) return total + ' min';
        var hours = Math.floor(total / 60);
        var rest = total % 60;
        return rest ? hours + 'h ' + rest + 'm' : hours + 'h';
      }

      /**
       * A syllabus row.
       *
       * A row the reader may open is a button that expands the lesson in place,
       * so several can be open at once and none of them navigates away. A row
       * they may not open stays a plain div rather than a button that silently
       * does nothing.
       */
      function lessonRow(lesson, index) {
        var id = String(lesson.id);

        var icon = lesson.completed
          ? '<i class="fas fa-check" aria-hidden="true"></i>'
          : '<span>' + index + '</span>';

        var right = lesson.locked
          ? '<span class="tag"><i class="fas fa-lock" aria-hidden="true"></i> Locked</span>'
          : lesson.isPreview
            ? '<span class="tag tag-preview">Preview</span>'
            : '<span class="tag">' + WGAUI.escapeHtml(lessonTypeLabel(lesson.type)) + '</span>';

        var meta = durationLabel(lesson.durationMinutes);

        var inner =
          '<div class="num">' + icon + '</div>' +
          '<div class="grow">' + WGAUI.escapeHtml(lesson.title) +
          (meta ? ' <span class="tag">· ' + WGAUI.escapeHtml(meta) + '</span>' : '') +
          '</div>' + right +
          (lesson.locked ? '' : '<span class="lesson-chev" aria-hidden="true">\u25be</span>');

        if (lesson.locked) {
          return '<div class="lesson-row is-locked">' + inner + '</div>';
        }

        return (
          '<div class="lesson-row' + (lesson.completed ? ' done' : '') + '" data-lesson-row="' + WGAUI.escapeHtml(id) + '">' +
          '<button type="button" class="lesson-open" data-lesson-id="' + WGAUI.escapeHtml(id) + '"' +
          ' aria-expanded="false" aria-controls="lesson-body-' + WGAUI.escapeHtml(id) + '">' + inner + '</button>' +
          '<div class="lesson-body" id="lesson-body-' + WGAUI.escapeHtml(id) + '" hidden></div>' +
          '</div>'
        );
      }

      /* ------------------------------------------------------------- *
       * Inline lesson expansion
       *
       * A row opens in place rather than replacing the syllabus, and several
       * may be open at once. The body is fetched once per lesson and kept, so
       * closing and reopening does not re-request it. `Start lesson` opens the
       * full viewer, which is where completion and the quiz live.
       * ------------------------------------------------------------- */

      var lessonCache = {};

      function inlineLessonHtml(lesson) {
        var media = mediaBlock(lesson);
        var body = lessonBodyBlock(lesson);
        var materials = resourcesBlock(lesson);

        var parts = [];

        if (!media && !body && !materials) {
          parts.push('<p class="wga-muted" style="margin-top:14px;">This lesson has no content yet.</p>');
        } else {
          parts.push(media, body, materials);
        }

        parts.push(
          '<div class="lesson-actions">' +
            '<button class="wga-btn wga-btn-primary" type="button" data-start-lesson="' +
              WGAUI.escapeHtml(String(lesson.id)) + '">' +
              '<i class="fas fa-play" aria-hidden="true"></i> Start lesson</button>' +
            (lesson.completed
              ? '<span class="lesson-done"><i class="fas fa-check" aria-hidden="true"></i> Completed</span>'
              : '') +
          '</div>'
        );

        return parts.join('');
      }

      function toggleLesson(lessonId) {
        var id = String(lessonId);
        var row = document.querySelector('[data-lesson-row="' + id + '"]');
        if (!row) return;

        var button = row.querySelector('.lesson-open');
        var body = row.querySelector('.lesson-body');
        if (!button || !body) return;

        var expanded = button.getAttribute('aria-expanded') === 'true';

        if (expanded) {
          button.setAttribute('aria-expanded', 'false');
          body.hidden = true;
          body.innerHTML = '';
          row.classList.remove('is-open');
          return;
        }

        button.setAttribute('aria-expanded', 'true');
        body.hidden = false;
        row.classList.add('is-open');

        if (lessonCache[id]) {
          body.innerHTML = lessonCache[id];
          return;
        }

        body.innerHTML =
          '<div style="padding-top:16px;">' +
          '<div class="wga-skeleton" style="height:16px;width:70%;margin-bottom:10px;"></div>' +
          '<div class="wga-skeleton" style="height:16px;width:90%;"></div></div>';

        WGA.get('/courses/' + encodeURIComponent(currentCourse.id) + '/lessons/' + encodeURIComponent(id))
          .then(function (data) {
            var html = inlineLessonHtml(data.lesson || {});
            lessonCache[id] = html;
            // The reader may have closed the row while this was in flight.
            if (button.getAttribute('aria-expanded') === 'true') body.innerHTML = html;
          })
          .catch(function (error) {
            body.innerHTML =
              '<p class="wga-hint" style="margin-top:14px;">' +
              WGAUI.escapeHtml((error && error.message) || 'Could not load this lesson.') + '</p>';
          });
      }

      /* ------------------------------------------------------------- *
       * Lesson viewer
       * ------------------------------------------------------------- */

      var currentCourse = null;
      var currentSyllabus = [];
      var currentAccess = null;
      var openLessonId = null;
      var quizState = { quiz: null, result: null, submitting: false };

      /**
       * Only http(s) addresses become links.
       *
       * `escapeHtml` makes a string safe to place in HTML; it does not make it
       * safe to place in an href. `javascript:` survives escaping intact and runs
       * on click, so the scheme is checked as well.
       */
      function safeUrl(url) {
        if (!url) return null;
        try {
          var parsed = new URL(url, window.location.origin);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : null;
        } catch (error) {
          return null;
        }
      }

      /**
       * Build a privacy-preserving embed address from a stored video link.
       *
       * The stored address is never put into an iframe src. The host is matched
       * against a fixed list and the video id is extracted and reassembled, so an
       * unexpected host, a `javascript:` address, or a path crafted to escape the
       * player cannot become a frame.
       */
      function videoEmbed(url) {
        var parsed;
        try {
          parsed = new URL(url);
        } catch (error) {
          return null;
        }

        if (parsed.protocol !== 'https:') return null;

        var host = parsed.hostname.replace(/^www\./, '');
        var youtube = 'https://www.youtube-nocookie.com/embed/';

        if (host === 'youtu.be') {
          var shortId = parsed.pathname.slice(1).split('/')[0];
          return shortId ? youtube + encodeURIComponent(shortId) : null;
        }

        if (
          host === 'youtube.com' ||
          host === 'm.youtube.com' ||
          host === 'music.youtube.com' ||
          host === 'youtube-nocookie.com'
        ) {
          var byQuery = parsed.searchParams.get('v');
          if (byQuery) return youtube + encodeURIComponent(byQuery);

          var byPath = parsed.pathname.match(/^\/(?:embed|shorts|v)\/([^/?#]+)/);
          return byPath ? youtube + encodeURIComponent(byPath[1]) : null;
        }

        if (host === 'vimeo.com' || host === 'player.vimeo.com') {
          var vimeoId = parsed.pathname.match(/(\d{6,})/);
          return vimeoId ? 'https://player.vimeo.com/video/' + vimeoId[1] : null;
        }

        return null;
      }

      function mediaBlock(lesson) {
        var video = lesson.video || {};

        if (video.type === 'upload' && video.playbackUrl) {
          return (
            '<div class="viewer-media"><div class="aspect">' +
            '<video controls playsinline preload="metadata" src="' +
            WGAUI.escapeHtml(video.playbackUrl) + '"></video></div></div>'
          );
        }

        if (video.type === 'link' && video.url) {
          var embed = videoEmbed(video.url);
          if (!embed) {
            // The address passed validation when it was saved, so this means it
            // changed shape since. Say so rather than showing an empty frame.
            return (
              '<p class="wga-hint">This lesson\'s video link could not be embedded. ' +
              'Open it directly instead.</p>'
            );
          }

          return (
            '<div class="viewer-media"><div class="aspect">' +
            '<iframe src="' + WGAUI.escapeHtml(embed) + '" title="' +
            WGAUI.escapeHtml(lesson.title) + '" loading="lazy" allowfullscreen ' +
            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">' +
            '</iframe></div></div>'
          );
        }

        return '';
      }

      /** Does this look like HTML rather than the plain text older lessons use? */
      function looksLikeHtml(value) {
        return /<([a-z][a-z0-9]*)\b[^>]*>/i.test(String(value || ''));
      }

      /*
       * Lesson bodies are HTML now that the editor writes them. They are
       * sanitized on the server as they are saved, so the markup can be inserted
       * as-is; the plain-text branch stays escaped because a lesson written
       * before the editor may genuinely contain a "<" the author meant literally.
       */
      /**
       * Turn the five basic entities back into characters.
       *
       * The server escapes text when it sanitizes a lesson body, so a lesson that
       * says "less than < 5" comes back as "less than &lt; 5". Without this the
       * plain-text branch would escape the ampersand again and the student would
       * read "&lt;" on the page.
       */
      function unescapeBasic(value) {
        return String(value || '').replace(/&(amp|lt|gt|quot|#39);/g, function (entity, name) {
          return { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }[name];
        });
      }

      function lessonBodyBlock(lesson) {
        var content = lesson.content;
        if (!content) return '';

        if (looksLikeHtml(content)) {
          return '<div class="viewer-body is-rich">' + content + '</div>';
        }

        return '<div class="viewer-body is-plain">' + WGAUI.escapeHtml(unescapeBasic(content)) + '</div>';
      }

      /**
       * Who is teaching this, and what they bring to it.
       *
       * Only credentials the instructor chose to publish appear here. The CV
       * itself never does — the most a stranger learns is that it was checked.
       */
      function instructorBlock(instructor) {
        if (!instructor || !instructor.firstName) return '';

        var credentials = instructor.credentials || {};
        var facts = [];

        if (credentials.qualifications) {
          facts.push('<p style="margin:0 0 8px;"><strong>Qualifications:</strong> ' + WGAUI.escapeHtml(credentials.qualifications) + '</p>');
        }

        if (typeof credentials.yearsExperience === 'number' && credentials.yearsExperience >= 0) {
          facts.push('<p style="margin:0 0 8px;"><strong>Experience:</strong> ' + credentials.yearsExperience +
            (credentials.yearsExperience === 1 ? ' year' : ' years') + ' teaching and working in this field</p>');
        }

        if (Array.isArray(credentials.languages) && credentials.languages.length) {
          facts.push('<p style="margin:0 0 8px;"><strong>Languages:</strong> ' + WGAUI.escapeHtml(credentials.languages.join(', ')) + '</p>');
        }

        var intro = safeUrl(credentials.videoIntroUrl);
        if (intro) {
          facts.push('<p style="margin:10px 0 0;"><a class="wga-btn wga-btn-ghost" href="' + WGAUI.escapeHtml(intro) +
            '" target="_blank" rel="noopener noreferrer"><i class="fas fa-play"></i> Watch their introduction</a></p>');
        }

        var verified = credentials.cvApproved
          ? '<span class="wga-pill wga-pill-free" style="margin-left:8px;"><i class="fas fa-check"></i> Credentials verified</span>'
          : '';

        return '<h2 class="section-title">Your instructor</h2>' +
          '<div class="glass-premium" style="padding:20px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;">' +
            '<div style="flex:0 0 auto;">' + WGAUI.avatar(instructor, 72) + '</div>' +
            '<div style="flex:1 1 260px;min-width:0;">' +
              '<p style="margin:0 0 2px;font-weight:700;font-size:17px;">' + WGAUI.escapeHtml(instructor.fullName || '') + verified + '</p>' +
              (instructor.headline
                ? '<p style="margin:0 0 10px;color:var(--text-light);">' + WGAUI.escapeHtml(instructor.headline) + '</p>'
                : '') +
              (instructor.bio
                ? '<p style="margin:0 0 10px;line-height:1.7;">' + WGAUI.escapeHtml(instructor.bio) + '</p>'
                : '') +
              facts.join('') +
            '</div>' +
          '</div>';
      }

      /** A label for the lesson type, rather than the stored value. */
      function lessonTypeLabel(type) {
        var labels = { video: 'Video', text: 'Text', pdf: 'PDF document', mixed: 'Mixed', live: 'Live session' };
        return labels[type] || type || '';
      }

      function resourcesBlock(lesson) {
        var resources = lesson.resources || [];
        var usable = resources.filter(function (resource) {
          return safeUrl(resource.url);
        });

        if (!usable.length) return '';

        return (
          '<h3 class="section-title" style="font-size:16px;margin:28px 0 4px;">Lesson materials</h3>' +
          '<ul class="resource-list">' +
          usable
            .map(function (resource) {
              return (
                '<li><a href="' + WGAUI.escapeHtml(safeUrl(resource.url)) +
                '" target="_blank" rel="noopener noreferrer">' +
                '<i class="fas fa-file-lines" aria-hidden="true"></i> ' +
                WGAUI.escapeHtml(resource.title) + '</a></li>'
              );
            })
            .join('') +
          '</ul>'
        );
      }

      /* ------------------------------------------------------------- *
       * Quiz
       *
       * Marking happens on the server. This draws the questions it is given and
       * shows the result that comes back — the correct answers are not in the
       * payload before a submission, so there is nothing here that could leak
       * them even if it tried.
       * ------------------------------------------------------------- */

      function quizChoice(label, value, checked, name) {
        return (
          '<label class="quiz-option">' +
          '<input type="radio" name="' + WGAUI.escapeHtml(name) + '" value="' +
          WGAUI.escapeHtml(value) + '"' + (checked ? ' checked' : '') + ' />' +
          '<span>' + WGAUI.escapeHtml(label) + '</span></label>'
        );
      }

      function quizQuestionForm(question, index) {
        return (
          '<fieldset class="quiz-question">' +
          '<legend><span class="quiz-num">' + index + '</span>' +
          WGAUI.escapeHtml(question.prompt) + '</legend>' +
          question.options
            .map(function (option) {
              return quizChoice(option.text, option.id, false, 'q-' + question.id);
            })
            .join('') +
          '</fieldset>'
        );
      }

      function quizResultBlock(quiz, result) {
        var byQuestion = {};
        (result.answers || []).forEach(function (answer) {
          byQuestion[String(answer.question)] = answer;
        });

        return (
          '<div class="quiz-score ' + (result.passed ? 'is-pass' : 'is-fail') + '">' +
            '<strong>' + result.scorePercent + '%</strong>' +
            '<span>' + (result.passed ? 'Passed' : 'Not passed yet — ' + quiz.passPercent + '% is needed') + '</span>' +
          '</div>' +
          '<div class="quiz-review">' +
          quiz.questions
            .map(function (question, index) {
              var answer = byQuestion[String(question.id)];
              var correctIds = (answer && answer.correctOptionIds) || [];

              return (
                '<div class="quiz-review-row ' + (answer && answer.correct ? 'is-right' : 'is-wrong') + '">' +
                '<div class="quiz-review-head">' +
                  '<span class="quiz-num">' + (index + 1) + '</span>' +
                  WGAUI.escapeHtml(question.prompt) +
                  '<span class="quiz-mark">' + (answer && answer.correct ? 'Correct' : 'Not quite') + '</span>' +
                '</div>' +
                question.options
                  .map(function (option) {
                    var isKey = correctIds.indexOf(String(option.id)) !== -1;
                    var chosen = answer && (answer.selected || []).indexOf(String(option.id)) !== -1;
                    var tag = isKey ? ' — the right answer' : (chosen ? ' — your answer' : '');
                    return '<div class="quiz-review-option' + (isKey ? ' is-key' : '') + (chosen && !isKey ? ' is-chosen' : '') + '">' +
                      WGAUI.escapeHtml(option.text) + WGAUI.escapeHtml(tag) + '</div>';
                  })
                  .join('') +
                (answer && answer.explanation
                  ? '<p class="quiz-why">' + WGAUI.escapeHtml(answer.explanation) + '</p>'
                  : '') +
                '</div>'
              );
            })
            .join('') +
          '</div>'
        );
      }

      function renderQuiz() {
        var host = document.getElementById('lesson-quiz');
        if (!host) return;

        var quiz = quizState.quiz;
        if (!quiz) { host.innerHTML = ''; return; }

        var unlimited = !quiz.maxAttempts || quiz.maxAttempts === 0;
        var remaining = quiz.attemptsRemaining;
        var exhausted = !unlimited && remaining !== null && remaining <= 0;

        var header =
          '<div class="quiz-head">' +
            '<h3><i class="fas fa-circle-question" aria-hidden="true"></i> ' +
            WGAUI.escapeHtml(quiz.title || 'Quiz') + '</h3>' +
            '<p class="wga-hint">' +
              quiz.questionCount + ' question' + (quiz.questionCount === 1 ? '' : 's') +
              ' · ' + quiz.passPercent + '% to pass' +
              (unlimited ? ' · unlimited attempts' : ' · ' + remaining + ' of ' + quiz.maxAttempts + ' attempt' + (quiz.maxAttempts === 1 ? '' : 's') + ' left') +
            '</p>' +
          '</div>';

        var body;

        if (quizState.result) {
          body =
            quizResultBlock(quiz, quizState.result) +
            ((!exhausted && !quizState.result.passed)
              ? '<button type="button" class="wga-btn wga-btn-primary" id="quiz-again">Try again</button>'
              : '') +
            (quizState.result.passed
              ? '<button type="button" class="wga-btn wga-btn-ghost" id="quiz-again">Review the questions</button>'
              : '');
        } else if (exhausted) {
          body =
            '<p class="wga-hint">You have used every attempt for this quiz. ' +
            (quiz.bestScore !== null && quiz.bestScore !== undefined ? 'Your best was ' + quiz.bestScore + '%.' : '') +
            ' Contact your instructor if you need another.</p>';
        } else {
          body =
            (quiz.bestScore !== null && quiz.bestScore !== undefined
              ? '<p class="wga-hint">Your best so far: ' + quiz.bestScore + '%</p>'
              : '') +
            '<form id="quiz-form">' +
              quiz.questions.map(function (question, index) { return quizQuestionForm(question, index + 1); }).join('') +
              '<button type="submit" class="wga-btn wga-btn-primary" id="quiz-submit">Submit answers</button>' +
            '</form>';
        }

        host.innerHTML = '<div class="quiz-card">' + header + body + '</div>';
        bindQuiz(quiz);
      }

      function bindQuiz(quiz) {
        var form = document.getElementById('quiz-form');
        if (form) {
          form.addEventListener('submit', function (event) {
            event.preventDefault();
            submitQuiz(quiz);
          });
        }

        var again = document.getElementById('quiz-again');
        if (again) {
          again.addEventListener('click', function () {
            quizState.result = null;
            renderQuiz();
          });
        }
      }

      function submitQuiz(quiz) {
        var button = document.getElementById('quiz-submit');
        var answers = [];

        quiz.questions.forEach(function (question) {
          var chosen = document.querySelector('input[name="q-' + question.id + '"]:checked');
          answers.push({ questionId: question.id, optionIds: chosen ? [chosen.value] : [] });
        });

        WGAUI.setBusy(button, true, 'Marking…');

        WGA.post(
          '/courses/' + encodeURIComponent(currentCourse.id) + '/lessons/' +
          encodeURIComponent(openLessonId) + '/quiz/attempts',
          { answers: answers }
        )
          .then(function (data) {
            quizState.result = data.attempt;
            // The API returns the updated attempt count with the quiz, so ask for
            // it again rather than guessing what is left.
            return WGA.get('/courses/' + encodeURIComponent(currentCourse.id) + '/lessons/' + encodeURIComponent(openLessonId) + '/quiz');
          })
          .then(function (data) {
            quizState.quiz = data.quiz;
            renderQuiz();
            WGAUI.toast(quizState.result.passed ? 'Passed.' : 'Submitted — see your result.', quizState.result.passed ? 'success' : 'info');
          })
          .catch(function (error) {
            WGAUI.setBusy(button, false);
            WGAUI.toast((error && error.message) || 'Could not submit that.', 'error');
          });
      }

      function loadLessonQuiz(lesson) {
        var host = document.getElementById('lesson-quiz');
        if (!host || !currentCourse) return;

        quizState = { quiz: null, result: null, submitting: false };
        host.innerHTML = '<div class="wga-skeleton" style="height:64px;margin-top:26px;"></div>';

        WGA.get(
          '/courses/' + encodeURIComponent(currentCourse.id) +
          '/lessons/' + encodeURIComponent(lesson.id) + '/quiz'
        )
          .then(function (data) {
            quizState.quiz = data.quiz;
            renderQuiz();
          })
          .catch(function () {
            host.innerHTML = '';
          });
      }

      /** Keep the address shareable, so a lesson can be linked to directly. */
      function rememberLesson(lessonId) {
        if (!window.history || !window.history.replaceState) return;
        try {
          var url = new URL(window.location.href);
          if (lessonId) url.searchParams.set('lesson', lessonId);
          else url.searchParams.delete('lesson');
          window.history.replaceState({}, '', url);
        } catch (error) {
          /* not worth failing over */
        }
      }

      function closeViewer() {
        var viewer = document.getElementById('viewer');
        if (viewer) {
          viewer.hidden = true;
          viewer.innerHTML = '';
        }
        document.querySelectorAll('.lesson-row.is-open').forEach(function (row) {
          row.classList.remove('is-open');
        });
        openLessonId = null;
        rememberLesson(null);
        // The launcher asks about one lesson; with no lesson open it would be
        // asking about nothing.
        if (window.WGAAI) WGAAI.unmountTutor();
      }

      function openLesson(lessonId) {
        var viewer = document.getElementById('viewer');
        if (!viewer || !currentCourse || !lessonId) return;

        // The viewer lives inside the syllabus panel, so a lesson opened from
        // the buy card or a deep link has to bring its panel into view first.
        selectTab('syllabus');

        openLessonId = lessonId;
        rememberLesson(lessonId);

        document.querySelectorAll('.lesson-row.is-open').forEach(function (row) {
          row.classList.remove('is-open');
        });
        var row = document.querySelector('[data-lesson-id="' + lessonId + '"]');
        if (row) row.closest('.lesson-row').classList.add('is-open');

        viewer.hidden = false;
        viewer.innerHTML =
          '<div class="wga-card"><div class="wga-skeleton" style="height:24px;width:55%;margin-bottom:12px;"></div>' +
          '<div class="wga-skeleton" style="height:200px;"></div></div>';
        viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });

        WGA.get(
          '/courses/' +
            encodeURIComponent(currentCourse.id) +
            '/lessons/' +
            encodeURIComponent(lessonId)
        )
          .then(function (data) {
            var lesson = data.lesson;
            var navigation = data.navigation || {};

            viewer.innerHTML =
              '<div class="viewer">' +
                '<div class="viewer-head">' +
                  '<h2>' + WGAUI.escapeHtml(lesson.title) + '</h2>' +
                  '<span class="tag">' + WGAUI.escapeHtml(lessonTypeLabel(lesson.type)) + '</span>' +
                  '<button type="button" class="wga-btn wga-btn-ghost" id="close-lesson">Close</button>' +
                '</div>' +
                mediaBlock(lesson) +
                lessonBodyBlock(lesson) +
                resourcesBlock(lesson) +
                '<div id="lesson-quiz"></div>' +
                '<div class="viewer-nav">' +
                  (navigation.previousLessonId
                    ? '<button type="button" class="wga-btn wga-btn-ghost" data-goto="' +
                      WGAUI.escapeHtml(navigation.previousLessonId) + '">' +
                      '<i class="fas fa-arrow-left" aria-hidden="true"></i> Previous</button>'
                    : '') +
                  (lesson.completed
                    ? '<span class="wga-pill wga-pill-free"><i class="fas fa-check" aria-hidden="true"></i> Completed</span>'
                    : '<button type="button" class="wga-btn wga-btn-primary" id="mark-complete">' +
                      'Mark complete</button>') +
                  '<span class="spacer"></span>' +
                  (navigation.nextLessonId
                    ? '<button type="button" class="wga-btn wga-btn-ghost" data-goto="' +
                      WGAUI.escapeHtml(navigation.nextLessonId) + '">Next ' +
                      '<i class="fas fa-arrow-right" aria-hidden="true"></i></button>'
                    : '') +
                '</div>' +
                '<p class="wga-hint" style="margin-top:14px;">Lesson ' +
                  (navigation.position || 0) +
                  ' of ' +
                  (navigation.total || 0) +
                  (lesson.durationMinutes ? ' · about ' + lesson.durationMinutes + ' min' : '') +
                '</p>' +
              '</div>';

            bindViewer();
            loadLessonQuiz(lesson);

            /**
             * The tutor only appears where it can actually read something: a
             * lesson the student is allowed to see, with written text in it. On
             * a video-only lesson it would answer "this lesson does not cover
             * that" to every question, which is worse than not being offered.
             */
            if (window.WGAAI) {
              var hasText = lesson.content && String(lesson.content).replace(/<[^>]+>/g, '').trim().length > 120;
              if (hasText) {
                WGAAI.mountTutor({ lessonId: lesson.id, lessonTitle: lesson.title });
              } else {
                WGAAI.unmountTutor();
              }
            }
          })
          .catch(function (error) {
            if (window.WGAAI) WGAAI.unmountTutor();
            viewer.innerHTML =
              '<div class="wga-card"><p style="margin:0 0 12px;">' +
              WGAUI.escapeHtml(
                error && error.status === 403
                  ? 'Enroll in this course to open this lesson.'
                  : (error && error.message) || 'That lesson could not be opened.'
              ) +
              '</p><button type="button" class="wga-btn wga-btn-ghost" id="close-lesson">Close</button></div>';
            bindViewer();
          });
      }

      function bindViewer() {
        var viewer = document.getElementById('viewer');
        if (!viewer) return;

        viewer.querySelectorAll('[data-goto]').forEach(function (button) {
          button.addEventListener('click', function () {
            openLesson(button.getAttribute('data-goto'));
          });
        });

        var close = document.getElementById('close-lesson');
        if (close) close.addEventListener('click', closeViewer);

        var complete = document.getElementById('mark-complete');
        if (complete) {
          complete.addEventListener('click', function () {
            WGAUI.setBusy(complete, true, 'Saving…');

            WGA.post(
              '/courses/' +
                encodeURIComponent(currentCourse.id) +
                '/lessons/' +
                encodeURIComponent(openLessonId) +
                '/complete'
            )
              .then(function () {
                WGAUI.toast('Lesson completed.', 'success');
                var reopen = openLessonId;
                // Re-read the course so the tick, the progress bar and the
                // certificate state all move together rather than drifting.
                return WGA.get('/courses/' + encodeURIComponent(identifier())).then(function (fresh) {
                  render(fresh);
                  if (reopen) openLesson(reopen);
                });
              })
              .catch(function (error) {
                WGAUI.setBusy(complete, false);
                WGAUI.toast((error && error.message) || 'Could not save that.', 'error');
              });
          });
        }
      }

      /** The first lesson the reader may actually open and has not finished. */
      function nextLessonToWatch(syllabus) {
        var open = syllabus.filter(function (lesson) {
          return !lesson.locked;
        });
        for (var i = 0; i < open.length; i += 1) {
          if (!open[i].completed) return open[i].id;
        }
        return open.length ? open[0].id : null;
      }

      function render(data) {
        var course = data.course;
        var access = data.access;
        var syllabus = data.lessons || [];

        currentCourse = course;
        currentSyllabus = syllabus;
        currentAccess = access;

        document.title = course.title + ' · Wuteve Global Academy';

        var metaDescription = document.querySelector('meta[name="description"]');
        if (metaDescription && course.summary) metaDescription.setAttribute('content', course.summary);

        /* ---- Primary action ---------------------------------------- */
        var action = '';

        if (access.manages) {
          action =
            '<a class="wga-btn wga-btn-primary wga-btn-block" href="/instructor-dashboard.html#/course/' +
            encodeURIComponent(course.id) + '"><i class="fas fa-pen-to-square" aria-hidden="true"></i> Manage this course</a>' +
            '<p class="wga-hint" style="text-align:center;">You teach this course.</p>';
        } else if (access.isEnrolled) {
          // Opens the lesson in place. This used to send the reader to a dashboard
          // route with no lesson viewer on it, which is where the learning stopped.
          action =
            '<button class="wga-btn wga-btn-primary wga-btn-block" type="button" id="resume">' +
            '<i class="fas fa-play" aria-hidden="true"></i> ' +
            (access.progress > 0 ? 'Continue learning' : 'Start learning') + '</button>' +
            '<div style="margin-top:14px;">' +
            '<div class="wga-progress"><span style="width:' + Math.max(0, Math.min(100, access.progress || 0)) + '%"></span></div>' +
            '<p class="wga-hint" style="text-align:center;margin-top:7px;">' + (access.progress || 0) + '% complete</p>' +
            '</div>';
        } else if (!WGA.isSignedIn()) {
          action =
            '<a class="wga-btn wga-btn-primary wga-btn-block" href="/login.html?next=' +
            encodeURIComponent(window.location.pathname + window.location.search) + '">' +
            '<i class="fas fa-right-to-bracket" aria-hidden="true"></i> Sign in to enroll</a>';
        } else if (course.isFree) {
          action =
            '<button class="wga-btn wga-btn-primary wga-btn-block" type="button" id="enroll">' +
            '<i class="fas fa-user-plus" aria-hidden="true"></i> Enroll for free</button>';
        } else {
          // The methods come from the API because availability is a deployment
          // fact this page cannot see. Until they arrive we show a skeleton
          // rather than a payment button, since a button that turns out to be
          // unusable is worse than a moment of waiting.
          action =
            '<div id="checkout-panel">' +
            '<div class="wga-skeleton" style="height:56px;margin-bottom:9px;"></div>' +
            '<div class="wga-skeleton" style="height:56px;"></div>' +
            '</div>';
        }

        if (access.certificateId) {
          action +=
            '<a class="wga-btn wga-btn-ghost wga-btn-block" style="margin-top:10px;" href="/student-dashboard.html#/certificates">' +
            '<i class="fas fa-award" aria-hidden="true"></i> View your certificate</a>';
        }

        var thumb = course.thumbnail
          ? '<img src="' + WGAUI.escapeHtml(course.thumbnail) + '" alt="" style="width:100%;border-radius:16px;margin-bottom:24px;" />'
          : '';

        var instructorHtml = instructorBlock(course.instructor);

        /*
         * The breadcrumb carries the course name, so the page says where it sits
         * even when it is reached from a search engine rather than the catalog.
         * Long titles are cut at 40 characters - the full name is the <h1>
         * immediately below.
         */
        var crumbTitle = course.title || 'Course';
        if (crumbTitle.length > 40) crumbTitle = crumbTitle.slice(0, 39).replace(/\s+$/, '') + '\u2026';

        var breadcrumb =
          '<nav class="breadcrumb" aria-label="Breadcrumb">' +
            '<a href="/">Home</a>' +
            '<span aria-hidden="true">/</span>' +
            '<a href="/courses.html">Courses</a>' +
            '<span aria-hidden="true">/</span>' +
            '<span aria-current="page">' + WGAUI.escapeHtml(crumbTitle) + '</span>' +
          '</nav>';

        var tabList = [{ id: 'overview', label: 'Overview' }, { id: 'syllabus', label: 'Syllabus' }];
        if (instructorHtml) tabList.push({ id: 'instructor', label: 'Instructor' });
        tabList.push({ id: 'reviews', label: 'Reviews' });

        var tabBar =
          '<nav class="course-tabs" role="tablist" aria-label="Course sections">' +
          tabList.map(function (tab, index) {
            return (
              '<button class="course-tab" type="button" role="tab" id="tab-' + tab.id + '"' +
              ' aria-controls="panel-' + tab.id + '" data-tab="' + tab.id + '"' +
              ' aria-selected="' + (index === 0 ? 'true' : 'false') + '"' +
              ' tabindex="' + (index === 0 ? '0' : '-1') + '">' +
              WGAUI.escapeHtml(tab.label) +
              '</button>'
            );
          }).join('') +
          '</nav>';

        var overviewPanel =
          '<h2 class="section-title">About this course</h2>' +
          (course.description
            ? '<p class="desc pre">' + WGAUI.escapeHtml(course.description) + '</p>'
            : '<p class="wga-muted">No description has been written for this course yet.</p>');

        /*
         * "What this course covers" is the syllabus in miniature: the first six
         * lesson titles, or all of them when there are fewer. Nothing is
         * invented - an empty course says so instead.
         */
        if (syllabus.length) {
          overviewPanel +=
            '<h2 class="section-title" style="margin-top:30px;">What this course covers</h2>' +
            '<ul class="covers-list">' +
            syllabus.slice(0, 6).map(function (lesson) {
              return '<li><i class="fas fa-check" aria-hidden="true"></i><span>' +
                WGAUI.escapeHtml(lesson.title) + '</span></li>';
            }).join('') +
            '</ul>' +
            (syllabus.length > 6
              ? '<button class="covers-more" type="button" id="covers-more">and ' +
                (syllabus.length - 6) + ' more</button>'
              : '');
        } else {
          overviewPanel +=
            '<p class="wga-muted" style="margin-top:24px;">This course is being prepared \u2014 check back soon.</p>';
        }

        var priceLabel = course.priceLabel || WGAUI.formatMoney(course.priceCents, course.currency);

        var primaryLabel = access.manages
          ? 'Manage this course'
          : access.isEnrolled
            ? (access.progress > 0 ? 'Continue learning' : 'Start learning')
            : !WGA.isSignedIn()
              ? 'Sign in to enroll'
              : course.isFree
                ? 'Enroll for free'
                : 'Enroll and pay ' + priceLabel;

        var mobileBar =
          '<div class="mobile-buy-bar" id="mobile-buy-bar">' +
            '<span class="mobile-buy-price">' + WGAUI.escapeHtml(priceLabel) + '</span>' +
            '<button class="mobile-buy-btn" type="button" id="mobile-buy-btn">' +
              WGAUI.escapeHtml(primaryLabel) +
            '</button>' +
          '</div>';

        main.innerHTML =
          breadcrumb +
          '<div class="course-layout">' +
            '<div class="course-main-col">' +
              thumb +
              '<span class="wga-pill">' + WGAUI.escapeHtml(course.categoryLabel || course.category) + '</span>' +
              '<h1>' + WGAUI.escapeHtml(course.title) + '</h1>' +
              '<p class="lede">' + WGAUI.escapeHtml(course.summary || '') + '</p>' +
              '<div class="meta-row">' +
                '<span><i class="fas fa-signal" aria-hidden="true"></i> ' + WGAUI.escapeHtml(course.level) + '</span>' +
                '<span><i class="fas fa-play-circle" aria-hidden="true"></i> ' + (course.lessonCount || syllabus.length) + ' lessons</span>' +
                (course.durationHours ? '<span><i class="fas fa-clock" aria-hidden="true"></i> ' + course.durationHours + ' hours</span>' : '') +
                '<span><i class="fas fa-users" aria-hidden="true"></i> ' + (course.enrolledCount || 0) + ' enrolled</span>' +
                (course.ratingCount ? '<span><i class="fas fa-star" style="color:var(--gold)" aria-hidden="true"></i> ' + course.rating + ' (' + course.ratingCount + ')</span>' : '') +
              '</div>' +

              tabBar +

              '<div class="course-panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">' +
                overviewPanel +
              '</div>' +
              '<div class="course-panel" id="panel-syllabus" role="tabpanel" aria-labelledby="tab-syllabus" tabindex="0" hidden>' +
                '<section class="viewer" id="viewer" hidden></section>' +
                '<h2 class="section-title">Syllabus</h2>' +
                (syllabus.length
                  ? syllabus.map(function (lesson, index) { return lessonRow(lesson, index + 1); }).join('')
                  : WGAUI.emptyState('No lessons published yet', 'The instructor has not published the syllabus for this course.')) +
              '</div>' +
              (instructorHtml
                ? '<div class="course-panel" id="panel-instructor" role="tabpanel" aria-labelledby="tab-instructor" tabindex="0" hidden>' +
                  instructorHtml +
                  '</div>'
                : '') +
              '<div class="course-panel" id="panel-reviews" role="tabpanel" aria-labelledby="tab-reviews" tabindex="0" hidden>' +
                '<h2 class="section-title">Student reviews</h2>' +
                '<div id="reviews-body">' +
                  '<div class="wga-skeleton" style="height:86px;border-radius:14px;"></div>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<aside class="buy-card">' +
              '<div class="buy-price">' + WGAUI.escapeHtml(priceLabel) + '</div>' +
              '<p class="wga-hint" style="margin-bottom:20px;">' +
                (course.certificateFeeLabel
                  ? 'Free to learn. The certificate is ' + WGAUI.escapeHtml(course.certificateFeeLabel) +
                    ', paid if you decide to claim it once you have finished.'
                  : course.isFree
                    ? 'Free to learn, and the certificate is included when you complete the course.'
                    : 'One-time payment. Certificate issued when you complete the course.') + '</p>' +
              action +
              '<div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border);">' +
                '<p class="wga-hint" style="margin:0 0 4px;font-weight:700;color:inherit;">Instructor</p>' +
                '<p style="margin:0;font-weight:600;">' + WGAUI.escapeHtml(course.instructorName || 'Wuteve Global Academy') + '</p>' +
              '</div>' +
            '</aside>' +
          '</div>' +
          mobileBar;

        bindActions(course);
        bindTabs();
        selectTab(initialTab());
        bindMobileBuyBar(course, access);
        loadReviews(course);

        var coversMore = document.getElementById('covers-more');
        if (coversMore) {
          coversMore.addEventListener('click', function () {
            selectTab('syllabus');
            var panel = document.getElementById('panel-syllabus');
            if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        }

        /*
         * Honour ?lesson=, so a lesson can be linked to directly and a reload
         * does not lose the reader's place. The lesson opens in place inside the
         * syllabus tab; the viewer stays for working through it.
         */
        var wanted = WGAUI.param('lesson');
        var isOpenable =
          wanted &&
          syllabus.some(function (lesson) {
            return String(lesson.id) === String(wanted) && !lesson.locked;
          });

        if (isOpenable) {
          selectTab('syllabus');
          toggleLesson(wanted);

          var openRow = document.querySelector('[data-lesson-row="' + wanted + '"]');
          if (openRow) openRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      /* ------------------------------------------------------------- *
       * Reviews
       *
       * Reviews are moderated, so this panel has three states to show: what the
       * public sees, what the author sees while their review waits, and the form
       * itself. The rating on the course card comes from the server; this panel
       * never computes it, so the two cannot disagree.
       * ------------------------------------------------------------- */

      function reviewStars(rating) {
        var out = '';
        for (var i = 1; i <= 5; i += 1) {
          out += '<i class="' + (i <= Math.round(Number(rating) || 0) ? 'fas' : 'far') + ' fa-star" aria-hidden="true"></i>';
        }
        return out;
      }

      function reviewItemHtml(review) {
        return (
          '<article class="review-item">' +
            '<div class="review-head">' +
              '<span class="review-stars" aria-label="' + review.rating + ' out of 5">' + reviewStars(review.rating) + '</span>' +
              '<span class="review-name">' + WGAUI.escapeHtml(review.author.name) + '</span>' +
              '<span class="review-date">' + WGAUI.escapeHtml(WGAUI.formatDate(review.createdAt)) + '</span>' +
            '</div>' +
            (review.title ? '<p class="review-title">' + WGAUI.escapeHtml(review.title) + '</p>' : '') +
            '<p class="review-body">' + WGAUI.escapeHtml(review.body) + '</p>' +
          '</article>'
        );
      }

      function reviewFormHtml(access, mine) {
        if (access && access.manages) return '';

        if (!WGA.isSignedIn()) {
          return (
            '<div class="review-form">' +
              '<p class="wga-muted" style="margin:0;">' +
                '<a href="/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search) + '">Sign in</a>' +
                ' to review this course. Reviews come from students who have taken it.' +
              '</p>' +
            '</div>'
          );
        }

        if (!access || !access.isEnrolled) {
          return (
            '<div class="review-form">' +
              '<p class="wga-muted" style="margin:0;">Enrol in this course to leave a review.</p>' +
            '</div>'
          );
        }

        var notice = '';
        if (mine && mine.status === 'pending') {
          notice = '<p class="review-notice pending">Your review is waiting to be checked. It will appear here once it has been approved.</p>';
        } else if (mine && mine.status === 'rejected') {
          notice =
            '<p class="review-notice rejected">Your review was not published.' +
            (mine.moderationNote ? ' ' + WGAUI.escapeHtml(mine.moderationNote) : '') +
            ' You can edit it and submit it again.</p>';
        }

        var options = [
          [5, '5 — Excellent'],
          [4, '4 — Good'],
          [3, '3 — Average'],
          [2, '2 — Poor'],
          [1, '1 — Bad']
        ].map(function (pair) {
          var selected = mine && Number(mine.rating) === pair[0] ? ' selected' : '';
          return '<option value="' + pair[0] + '"' + selected + '>' + pair[1] + '</option>';
        }).join('');

        return (
          '<form class="review-form" id="review-form" novalidate>' +
            notice +
            '<div class="field">' +
              '<label for="review-rating">Your rating</label>' +
              '<select class="wga-input" id="review-rating" name="rating">' + options + '</select>' +
            '</div>' +
            '<div class="field">' +
              '<label for="review-title">Headline <span class="wga-hint" style="font-weight:400;">(optional)</span></label>' +
              '<input class="wga-input" id="review-title" name="title" maxlength="120" value="' +
                WGAUI.escapeHtml(mine ? mine.title : '') + '" placeholder="Sum up your experience" />' +
            '</div>' +
            '<div class="field">' +
              '<label for="review-body">Your review</label>' +
              '<textarea class="wga-input" id="review-body" name="body" minlength="20" maxlength="4000" ' +
                'placeholder="What did you learn? Was the material useful? What would you tell someone starting it?">' +
                WGAUI.escapeHtml(mine ? mine.body : '') +
              '</textarea>' +
            '</div>' +
            '<div class="field" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
              '<button class="wga-btn wga-btn-primary" type="submit" id="review-submit">' +
                (mine ? 'Update review' : 'Post review') +
              '</button>' +
              (mine ? '<button class="wga-btn wga-btn-ghost" type="button" id="review-delete">Withdraw</button>' : '') +
            '</div>' +
          '</form>'
        );
      }

      function renderReviews(course, data) {
        var body = document.getElementById('reviews-body');
        if (!body) return;

        var summary = data.summary || { average: 0, count: 0 };
        var reviews = data.items || [];
        var mine = data.myReview || null;

        var summaryHtml =
          '<div class="review-summary">' +
            '<div>' +
              '<div class="review-score">' + (summary.count ? Number(summary.average).toFixed(1) : '\u2014') + '</div>' +
              '<span class="review-stars" aria-hidden="true">' + reviewStars(summary.average) + '</span>' +
            '</div>' +
            '<div>' +
              '<p style="margin:0;font-weight:700;">' +
                (summary.count
                  ? summary.count + (summary.count === 1 ? ' review' : ' reviews')
                  : 'No reviews yet') +
              '</p>' +
              '<p class="wga-hint" style="margin:2px 0 0;">' +
                (summary.count
                  ? 'From students who have taken this course.'
                  : 'Be the first to review this course.') +
              '</p>' +
            '</div>' +
          '</div>';

        body.innerHTML =
          summaryHtml +
          reviews.map(reviewItemHtml).join('') +
          reviewFormHtml(currentAccess, mine);

        bindReviewForm(course);

        var tab = document.getElementById('tab-reviews');
        if (tab) tab.textContent = summary.count ? 'Reviews (' + summary.count + ')' : 'Reviews';
      }

      function loadReviews(course) {
        var body = document.getElementById('reviews-body');
        if (!body) return;

        WGA.get('/courses/' + encodeURIComponent(course.id) + '/reviews?limit=50')
          .then(function (data) {
            renderReviews(course, data);
          })
          .catch(function () {
            body.innerHTML = '<p class="wga-muted">Reviews could not be loaded right now.</p>';
          });
      }

      function bindReviewForm(course) {
        var form = document.getElementById('review-form');
        if (!form) return;

        var submit = document.getElementById('review-submit');

        form.addEventListener('submit', function (event) {
          event.preventDefault();

          var ratingField = form.querySelector('#review-rating');
          var titleField = form.querySelector('#review-title');
          var bodyField = form.querySelector('#review-body');
          var text = bodyField.value.trim();

          if (text.length < 20) {
            WGAUI.toast('Write at least 20 characters so the review is useful.', 'error');
            bodyField.focus();
            return;
          }

          submit.disabled = true;

          WGA.post('/courses/' + encodeURIComponent(course.id) + '/reviews', {
            rating: Number(ratingField.value),
            title: titleField.value.trim(),
            body: text
          })
            .then(function (data) {
              WGAUI.toast(data.message || 'Thank you. Your review will be checked before it appears.', 'success');
              loadReviews(course);
            })
            .catch(function (error) {
              WGAUI.toast((error && error.message) || 'Your review could not be saved.', 'error');
            })
            .finally(function () {
              submit.disabled = false;
            });
        });

        var remove = document.getElementById('review-delete');
        if (remove) {
          remove.addEventListener('click', function () {
            if (!window.confirm('Withdraw your review? This cannot be undone.')) return;

            remove.disabled = true;

            WGA.del('/courses/' + encodeURIComponent(course.id) + '/reviews/mine')
              .then(function () {
                WGAUI.toast('Your review was withdrawn.', 'success');
                loadReviews(course);
              })
              .catch(function (error) {
                remove.disabled = false;
                WGAUI.toast((error && error.message) || 'Your review could not be withdrawn.', 'error');
              });
          });
        }
      }

      /* ------------------------------------------------------------- *
       * Tabs
       *
       * The ARIA tabs pattern: one tab in the tab order at a time, arrow keys
       * move between them, and an unselected panel is `hidden` so its controls
       * - and the lesson viewer inside the syllabus panel - are out of the tab
       * order as well.
       * ------------------------------------------------------------- */

      function availableTabs() {
        return Array.prototype.slice.call(document.querySelectorAll('.course-tab')).map(function (button) {
          return button.getAttribute('data-tab');
        });
      }

      /** Keep the address shareable: ?tab=syllabus reopens on that tab. */
      function rememberTab(name) {
        if (!window.history || !window.history.replaceState) return;
        try {
          var url = new URL(window.location.href);
          if (name && name !== 'overview') url.searchParams.set('tab', name);
          else url.searchParams.delete('tab');
          if (/^#tab-/.test(url.hash)) url.hash = '';
          window.history.replaceState({}, '', url);
        } catch (error) {
          /* not worth failing over */
        }
      }

      function selectTab(name, focus) {
        var tabs = availableTabs();
        if (tabs.indexOf(name) === -1) name = tabs[0] || 'overview';

        tabs.forEach(function (tabName) {
          var button = document.getElementById('tab-' + tabName);
          var panel = document.getElementById('panel-' + tabName);
          var selected = tabName === name;

          if (button) {
            button.setAttribute('aria-selected', selected ? 'true' : 'false');
            button.setAttribute('tabindex', selected ? '0' : '-1');
          }
          if (panel) panel.hidden = !selected;
        });

        rememberTab(name);

        if (focus) {
          var target = document.getElementById('tab-' + name);
          if (target) target.focus();
        }

        return name;
      }

      function initialTab() {
        var wanted = String(WGAUI.param('tab') || '').toLowerCase();
        if (wanted && availableTabs().indexOf(wanted) !== -1) return wanted;

        var hash = String(window.location.hash || '').replace(/^#/, '');
        if (hash.indexOf('tab-') === 0) {
          var byHash = hash.slice(4);
          if (availableTabs().indexOf(byHash) !== -1) return byHash;
        }

        return 'overview';
      }

      function bindTabs() {
        var list = document.querySelector('.course-tabs');
        if (!list) return;

        var tabs = Array.prototype.slice.call(list.querySelectorAll('.course-tab'));

        tabs.forEach(function (button, index) {
          button.addEventListener('click', function () {
            selectTab(button.getAttribute('data-tab'), false);
          });

          button.addEventListener('keydown', function (event) {
            var next = null;

            if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
            else if (event.key === 'ArrowLeft') next = (index - 1 + tabs.length) % tabs.length;
            else if (event.key === 'Home') next = 0;
            else if (event.key === 'End') next = tabs.length - 1;
            else return;

            event.preventDefault();
            selectTab(tabs[next].getAttribute('data-tab'), true);
          });
        });
      }

      /* ------------------------------------------------------------- *
       * Mobile buy bar
       *
       * The bar duplicates the primary action rather than reimplementing it:
       * a click runs the same branch the card's button would. It is revealed a
       * frame after the page renders, and the body padding that reserves its
       * space is added in the same task as the markup - before anything is
       * painted - so neither can push the layout around after load.
       * ------------------------------------------------------------- */

      function bindMobileBuyBar(course, access) {
        var bar = document.getElementById('mobile-buy-bar');
        var button = document.getElementById('mobile-buy-btn');
        if (!bar || !button) return;

        document.body.classList.add('has-mobile-bar');
        requestAnimationFrame(function () { bar.classList.add('is-ready'); });

        button.addEventListener('click', function () {
          if (access.manages) {
            window.location.href = '/instructor-dashboard.html#/course/' + encodeURIComponent(course.id);
            return;
