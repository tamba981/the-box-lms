<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
    <title>Student Dashboard · Wuteve Global Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ----- CSS Variables & Base ----- */
        :root {
            --primary: #1a56db;
            --primary-dark: #0f3b8c;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #0f3b8c 100%);
            --gold: #d4a547;
            --gold-light: #f0d080;
            --silver: #c0c0c0;
            --silver-light: #e8e8e8;
            --secondary: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f0f5ff;
            --border: #e5e7eb;
            --dark-bg: #0a1628;
            --dark-text: #e2e8f0;
            --dark-card: rgba(30, 41, 59, 0.7);
            --dark-border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --glass-primary: rgba(255, 255, 255, 0.10);
            --glass-secondary: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-hover: rgba(26, 86, 219, 0.30);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --glass-shadow-hover: 0 12px 48px rgba(26, 86, 219, 0.10);
            --glass-blur: 20px;
            --shadow-glow: 0 0 30px rgba(26, 86, 219, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #1a3a6b 0%, #2a1a5e 100%);
            min-height: 100vh;
            line-height: 1.6;
            background-attachment: fixed;
            transition: background 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0a1628 0%, #1a0a3a 100%);
            color: var(--dark-text);
        }

        /* ----- Premium Glassmorphism ----- */
        .glass-premium {
            background: var(--glass-primary);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-premium:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-hover);
            box-shadow: var(--glass-shadow-hover);
        }

        body.dark-mode .glass-premium {
            background: rgba(10, 22, 40, 0.5);
            border-color: rgba(255, 255, 255, 0.04);
        }

        body.dark-mode .glass-premium:hover {
            background: rgba(10, 22, 40, 0.7);
            border-color: rgba(212, 165, 71, 0.25);
        }

        /* ----- Header (frosted glass) ----- */
        .header {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }

        body.dark-mode .header {
            background: rgba(10, 22, 40, 0.70);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            max-width: 1400px;
            margin: 0 auto;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* The emblem is navy, so on the dark theme it sits on a white chip. */
        .header-left .brand-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 50%;
            background: #fff;
            padding: 3px;
            object-fit: contain;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .logo span {
            font-weight: 400;
            font-size: 14px;
            background: linear-gradient(135deg, var(--silver), var(--silver-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-search {
            flex: 1;
            max-width: 380px;
            min-width: 140px;
            position: relative;
        }
        .header-search input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            font-size: 14px;
            transition: 0.3s;
        }
        body.dark-mode .header-search input {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--dark-text);
        }
        .header-search input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 71, 0.10);
        }
        .header-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text);
            position: relative;
        }
        body.dark-mode .btn-icon {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }
        .btn-icon:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        body.dark-mode .notification-badge {
            border-color: var(--dark-bg);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .logout-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: var(--text);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        body.dark-mode .logout-btn {
            color: var(--dark-text);
            border-color: rgba(255, 255, 255, 0.04);
        }
        .logout-btn:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        /* ----- Sidebar (glass) ----- */
        .sidebar {
            width: 270px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 16px;
            position: fixed;
            height: calc(100vh - 66px);
            overflow-y: auto;
            transition: all 0.3s;
            z-index: 50;
        }

        body.dark-mode .sidebar {
            background: rgba(10, 22, 40, 0.60);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text);
            text-decoration: none;
            border-radius: 16px;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 14px;
        }
        body.dark-mode .sidebar-link {
            color: var(--dark-text);
        }

        .sidebar-link:hover {
            background: rgba(26, 86, 219, 0.06);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.25);
            transform: translateX(6px);
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        body.dark-mode .sidebar-footer {
            border-top-color: rgba(255, 255, 255, 0.04);
        }
        .sidebar-footer .sidebar-link {
            font-size: 13px;
        }

        /* ----- Main Content ----- */
        .main-content {
            flex: 1;
            margin-left: 270px;
            padding: 28px 32px 40px;
            transition: margin 0.3s;
        }

        /* ----- Stats Cards (with counter) ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            padding: 22px 20px;
            cursor: default;
            transition: all 0.3s;
        }

        .stat-title {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-change.up {
            color: var(--success);
        }
        .stat-change.down {
            color: var(--danger);
        }

        /* ----- Section Title ----- */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title span {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ----- Courses Grid ----- */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            margin-bottom: 40px;
        }

        .course-card {
            overflow: hidden;
            transition: all 0.3s;
            cursor: default;
        }

        .course-image {
            height: 150px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 20px 20px 0 0;
        }

        .course-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }
        .course-badge.in-progress {
            background: rgba(245, 158, 11, 0.85);
            color: white;
        }
        .course-badge.completed {
            background: rgba(16, 185, 129, 0.85);
            color: white;
        }
        .course-badge.new {
            background: rgba(26, 86, 219, 0.85);
            color: white;
        }

        .course-content {
            padding: 20px 22px 22px;
        }

        .course-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .course-meta {
            font-size: 13px;
            color: var(--text-light);
            margin: 6px 0 12px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Progress ring (SVG) */
        .progress-ring-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 14px 0;
        }
        .progress-ring-container {
            position: relative;
            width: 56px;
            height: 56px;
        }
        .progress-ring-container svg {
            transform: rotate(-90deg);
        }
        .progress-ring-container .bg {
            fill: none;
            stroke: rgba(0, 0, 0, 0.06);
            stroke-width: 5;
        }
        .progress-ring-container .fg {
            fill: none;
            stroke: var(--primary);
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease;
        }
        .progress-ring-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        body.dark-mode .progress-ring-container .bg {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.3);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            color: var(--text);
        }
        body.dark-mode .btn-outline {
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--dark-text);
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
        }

        /* ----- Empty State ----- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .empty-state i {
            font-size: 56px;
            color: var(--gold);
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        /* ----- Notifications Panel (glass) ----- */
        .notifications-panel {
            position: fixed;
            top: 66px;
            right: -420px;
            width: 400px;
            height: calc(100vh - 66px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.10);
            z-index: 200;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        body.dark-mode .notifications-panel {
            background: rgba(10, 22, 40, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.03);
        }
        .notifications-panel.open {
            right: 0;
        }

        .panel-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            position: sticky;
            top: 0;
            background: inherit;
            backdrop-filter: inherit;
            z-index: 2;
        }
        body.dark-mode .panel-header {
            border-bottom-color: rgba(255, 255, 255, 0.04);
        }

        .notification-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }
        .notification-item:hover {
            background: rgba(26, 86, 219, 0.04);
        }
        .notification-item.unread {
            border-left: 3px solid var(--gold);
        }
        .notification-item strong {
            display: block;
            font-size: 14px;
        }
        .notification-item p {
            font-size: 13px;
            margin: 4px 0;
            color: var(--text-light);
        }
        .notification-item .time {
            font-size: 11px;
            color: var(--text-light);
        }

        /* ----- Modal (glass) ----- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 28px;
            max-width: 580px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }
        body.dark-mode .modal-content {
            background: rgba(10, 22, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.03);
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        .modal-body {
            padding: 24px;
        }

        /* ----- Chat UI in modal ----- */
        .chat-messages-area {
            height: 340px;
            overflow-y: auto;
            padding: 8px 4px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
        }
        .message.received .bubble {
            background: rgba(26, 86, 219, 0.06);
            padding: 10px 16px;
            border-radius: 16px 16px 16px 4px;
            display: inline-block;
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.sent .bubble {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            padding: 10px 16px;
            border-radius: 16px 16px 4px 16px;
            display: inline-block;
        }

        /* ----- AI Tutor ----- */
        .ai-response {
            margin-top: 20px;
            padding: 20px;
            background: rgba(26, 86, 219, 0.04);
            border-radius: 16px;
            border-left: 4px solid var(--gold);
            display: none;
        }

        /* ----- Misc ----- */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 165, 71, 0.12);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }
        body.dark-mode .mobile-menu-btn {
            color: var(--dark-text);
        }

        /* ----- Responsive ----- */
        @media (max-width: 992px) {
            .courses-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 150;
                width: 270px;
                height: 100vh;
                top: 0;
                padding-top: 70px;
                border-right: none;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-search {
                display: none;
            }
            .header-content {
                padding: 8px 16px;
            }
            .mobile-menu-btn {
                display: block;
            }
            .notifications-panel {
                width: 100%;
                right: -100%;
            }
            .courses-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-right .user-name {
                display: none;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in-up {
            animation: fadeInUp 0.4s ease forwards;
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(212, 165, 71, 0.15);
            }
            50% {
                box-shadow: 0 0 20px 4px rgba(212, 165, 71, 0.06);
            }
        }
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes toastFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Form styles (used in profile) */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }
    </style>

    <!--
      The role guard confirms the session against the server before the page is
      revealed. This replaces the previous check, which treated the presence of
      any string in localStorage as proof of sign-in.
    -->
    <script src="/assets/js/wga-api.js"></script>
    <script src="/assets/js/wga-ui.js"></script>
    <script src="/assets/js/wga-guard.js" data-roles="student"></script>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle sidebar">☰</button>
                <img class="brand-mark" src="/Images/Brand/wuteve-emblem.png" alt="" width="34" height="34" />
                <a href="/" class="logo">Wuteve <span>Global Academy</span></a>
            </div>

            <div class="header-search">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearch" placeholder="Search courses, instructors..." />
            </div>

            <div class="header-right">
                <span class="user-name" id="user-name" style="font-weight:600;">Student</span>
                <button class="btn-icon" id="notifBtn" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notifCount">0</span>
                </button>
                <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">🌙</button>
                <div class="user-avatar" id="userAvatar">S</div>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </div>
    </header>

    <!-- ===== DASHBOARD ===== -->
    <div class="dashboard" style="display:flex;">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="#" class="sidebar-link active" data-page="overview"><i class="fas fa-tachometer-alt"></i> Overview</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="courses"><i class="fas fa-book"></i> My Courses</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="live-sessions"><i class="fas fa-video"></i> Live Sessions</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="community"><i class="fas fa-users"></i> Community</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="messages"><i class="fas fa-envelope"></i> Messages</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="certificates"><i class="fas fa-certificate"></i> Certificates</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="profile"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
            <div class="sidebar-footer">
                <!--
                  Bookmarks and Settings were removed: neither had a page, a
                  route or a render function, so both navigated to the overview
                  while the sidebar said otherwise. AI Tutor was removed for a
                  stronger reason — it presented a text box and a Send button for
                  an assistant that does not exist; askAI() returned a canned
                  reply. A control that lies about what it does is worse than no
                  control.
                -->
                <div class="sidebar-item"><a href="#" class="sidebar-link" data-page="courses"><i class="fas fa-book"></i> My Learning</a></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <div style="text-align:center;padding:60px;">
                <div class="loading-spinner"></div>
            </div>
        </main>
    </div>

    <!-- ===== NOTIFICATIONS PANEL ===== -->
    <div class="notifications-panel" id="notifPanel">
        <div class="panel-header">
            <span>Notifications</span>
            <button id="closeNotif" style="background:none;border:none;font-size:26px;cursor:pointer;color:var(--text-light);">&times;</button>
        </div>
        <div id="notifList"></div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Modal</span>
                <button id="closeModal" style="background:none;border:none;font-size:28px;cursor:pointer;color:var(--text-light);">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA LAYER
        // ============================================================
        // The mock fixtures that used to sit here are gone. Every value on this
        // page now comes from the API, so an empty list means the student
        // genuinely has nothing yet — and the empty states say so, rather than
        // inventing three courses with 75% of somebody else's work already done.
        //
        // The render functions below are unchanged in shape: they are pure
        // functions of `state`, so the work is mapping API responses onto the
        // fields they already read.

        let state = {
            user: {},
            stats: { enrolled: 0, completed: 0, hoursLearned: 0, certificates: 0, averageProgress: 0 },
            enrolledCourses: [],
            recommendedCourses: [],
            notifications: [],
            liveSessions: [],
            recordings: [],
            studyGroups: [],
            conversations: [],
            courseTitles: {},
            unread: { notifications: 0, messages: 0 },
            loading: true,
            error: null,
            currentPage: 'overview'
        };

        /** A gradient placeholder instead of a broken image when a course has no thumbnail. */
        function courseImageStyle(course) {
            return course && course.thumbnail
                ? `background-image:url('${course.thumbnail}')`
                : 'background-image:linear-gradient(135deg,#1a3a6b 0%,#2a1a5e 100%)';
        }

        /**
         * Map an enrollment (from /enrollments/me) onto the shape the render
         * functions read. All the derived values are computed here, once, rather
         * than repeated inside each view.
         */
        function mapEnrollment(enrollment) {
            const course = enrollment.course || {};
            const total = course.lessonCount || 0;
            const done = enrollment.completedCount || 0;

            return {
                _id: String(course.id || enrollment.courseId || ''),
                slug: course.slug || '',
                title: course.title || 'Untitled course',
                description: course.summary || '',
                thumbnail: course.thumbnail || '',
                progress: enrollment.progress || 0,
                hoursSpent: enrollment.hoursSpent || 0,
                lessonCount: total,
                completedCount: done,
                certificateIssued: Boolean(enrollment.certificateId),
                certificateId: enrollment.certificateId || null,
                instructorId: enrollment.instructorId || null,
                instructorName: course.instructorName || 'Wuteve Global Academy',
                nextLesson: total
                    ? `${done} of ${total} lessons complete`
                    : 'No lessons published yet',
                completedAt: enrollment.completedAt || null
            };
        }

        /**
         * Load everything the dashboard needs, in parallel.
         *
         * `/dashboard/student` answers the overview in one request (statistics,
         * what to continue, notifications, upcoming sessions, unread counts).
         * The rest is filled in alongside it. A failure of any one of these must
         * not blank the whole page, so each result is settled independently.
         */
        async function loadStudentData() {
            const [overview, enrollments, past, groups, threads, catalog, activity] = await Promise.all([
                WGA.get('/dashboard/student'),
                WGA.get('/enrollments/me', { query: { limit: 100 } }),
                WGA.get('/live-sessions', { query: { scope: 'past', limit: 12 } }),
                WGA.get('/study-groups', { query: { mine: 'true' } }),
                WGA.get('/messages/threads', { query: { limit: 50 } }),
                WGA.get('/courses', { query: { limit: 3, sort: 'newest' } }),
                WGA.get('/community/activity')
            ]);

            state.user = overview.user || WGA.getUser() || {};
            state.stats = overview.stats || state.stats;
            state.unread = overview.unread || state.unread;

            state.enrolledCourses = (enrollments.items || []).map(mapEnrollment);

            // Recommended means "published, and not one you are already doing".
            const enrolledIds = new Set(state.enrolledCourses.map((course) => course._id));

            state.recommendedCourses = (catalog.items || [])
                .filter((course) => !enrolledIds.has(String(course.id)))
                .map((course) => ({
                    _id: String(course.id),
                    slug: course.slug,
                    title: course.title,
                    description: course.summary || '',
                    thumbnail: course.thumbnail || '',
                    priceLabel: course.priceLabel,
                    isFree: course.isFree
                }));

            state.notifications = (overview.notifications || []).map((notification) => ({
                _id: String(notification.id),
                title: notification.title,
                message: notification.message,
                type: notification.type,
                link: notification.link,
                createdAt: notification.createdAt,
                read: Boolean(notification.read)
            }));

            state.liveSessions = (overview.upcomingSessions || []).map((session) => ({
                _id: String(session.id),
                title: session.title,
                courseTitle: session.courseTitle || '',
                startTime: session.startTime,
                endTime: session.endTime,
                // Only present when the server decided this student may join.
                meetingLink: session.meetingLink || null,
                attending: Boolean(session.isAttending)
            }));

            state.recordings = (past.items || []).map((session) => ({
                _id: String(session.id),
                title: session.title,
                courseTitle: session.courseTitle || '',
                endTime: session.endTime,
                recordingUrl: session.recordingUrl || null
            }));

            state.studyGroups = (groups.items || []).map((group) => ({
                id: String(group.id),
                name: group.name,
                members: group.memberCount,
                isMember: Boolean(group.isMember),
                threadId: group.threadId
            }));

            state.conversations = (threads.items || []).map((thread) => ({
                id: String(thread.id),
                type: thread.type,
                name: thread.displayName || thread.title || 'Conversation',
                lastMessage: thread.lastMessagePreview || 'No messages yet',
                time: thread.lastMessageAt ? WGAUI.formatRelative(thread.lastMessageAt) : '',
                unread: (thread.unreadCount || 0) > 0
            }));

            state.certificates = (overview.certificates || []).map((certificate) => ({
                id: String(certificate.id),
                certificateNumber: certificate.certificateNumber,
                verificationCode: certificate.verificationCode,
                courseTitle: certificate.courseTitle,
                courseId: String(certificate.courseId || ''),
                instructorName: certificate.instructorName || '',
                issueDate: certificate.issueDate,
                hoursCompleted: certificate.hoursCompleted,
                pdfUrl: certificate.pdfUrl || null,
                revoked: Boolean(certificate.revoked)
            }));

            state.discussions = (activity.posts || []).map((post) => ({
                id: String(post.id),
                title: post.title,
                excerpt: post.excerpt || '',
                courseTitle: post.courseTitle || '',
                courseId: String(post.courseId || ''),
                authorName: post.author ? post.author.name : 'Someone',
                replyCount: post.replyCount || 0,
                likeCount: post.likeCount || 0,
                createdAt: post.createdAt
            }));
        }

        // ============================================================
        //  AUTH
        // ============================================================
        /**
         * The session itself is verified by /assets/js/wga-guard.js before this
         * page is revealed, so there is nothing to decide here — this only reads
         * the already-confirmed user out of storage and paints the header.
         */
        function checkAuth() {
            const user = WGA.getUser() || {};
            state.user = { ...state.user, ...user };

            const nameEl = document.getElementById('user-name');
            const avatarEl = document.getElementById('userAvatar');

            if (nameEl) nameEl.textContent = user.firstName || 'Student';
            if (avatarEl) avatarEl.textContent = (user.firstName || 'S')[0].toUpperCase();

            updateNotifBadge();
            return true;
        }

        function updateNotifBadge() {
            const unread = state.notifications.filter(n => !n.read).length;
            document.getElementById('notifCount').textContent = unread;
        }

        // ============================================================
        //  UI HELPERS
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#3b82f6';
            toast.style.cssText = `
                position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
                background: ${bgColor}; color: white; padding: 12px 28px; border-radius: 40px;
                z-index: 2000; animation: toastFadeIn 0.3s ease; font-weight: 600; font-size: 14px;
                box-shadow: 0 8px 30px rgba(0,0,0,0.10); max-width: 90%; text-align: center;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300); }, 3200);
        }

        function openModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============================================================
        //  ANIMATED COUNTER
        // ============================================================
        function animateCounter(el, target, duration = 2000) {
            const start = 0;
            const startTime = performance.now();

            function update(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(eased * target);
                el.textContent = current.toLocaleString();
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function observeCounters() {
            const counters = document.querySelectorAll('.stat-value[data-target]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = parseInt(entry.target.dataset.target, 10);
                        animateCounter(entry.target, target);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.3 });
            counters.forEach(el => observer.observe(el));
        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================
        // ============================================================
        //  ACTIONS
        // ============================================================
        // These replace the placeholder toasts the views used to call. Each one
        // now does the thing it says it does.

        /** Open a course's page. Accepts a slug or an id. */
        function openCourse(idOrSlug) {
            if (!idOrSlug) return;
            window.location.href = '/course.html?course=' + encodeURIComponent(idOrSlug);
        }

        /** Open the public verification page for a certificate. */
        function openCertificate(verificationCode) {
            if (!verificationCode) return;
            window.location.href = '/verify/' + encodeURIComponent(verificationCode);
        }

        /** Toggle this student's place on a live session's guest list. */
        window.toggleAttendance = async function toggleAttendance(sessionId) {
            try {
                const result = await WGA.post(`/live-sessions/${encodeURIComponent(sessionId)}/attend`);
                showToast(result.attending ? 'You are on the guest list.' : 'Removed from the guest list.', 'success');

                await loadStudentData();
                loadPage(state.currentPage);
            } catch (error) {
                showToast(error.message || 'We could not update your place.', 'error');
            }
        };

        /** Open a conversation. */
        window.openThread = function openThread(threadId) {
            if (!threadId) {
                showToast('That conversation is not available yet.', 'info');
                return;
            }

            window.location.href = `/student-dashboard.html#/messages/${encodeURIComponent(threadId)}`;
            loadPage('messages');
        };

        function renderOverview() {
            // Taken from the server rather than recomputed here, so the numbers on
            // this page and the numbers anywhere else cannot disagree.
            const total = state.stats.enrolled || 0;
            const completed = state.stats.completed || 0;
            const totalHours = state.stats.hoursLearned || 0;
            const certs = state.stats.certificates || 0;

            // "Continue" means something genuinely in progress; if nothing is, offer
            // whatever has been enrolled in but not started.
            const inProgress = state.enrolledCourses.filter((c) => c.progress > 0 && c.progress < 100);
            const notStarted = state.enrolledCourses.filter((c) => c.progress === 0);
            const continueList = inProgress.length > 0 ? inProgress : notStarted.slice(0, 3);

            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium"><div class="stat-title">📚 Courses Enrolled</div><div class="stat-value" data-target="${total}">0</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">✅ Completed</div><div class="stat-value" data-target="${completed}">0</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">⏱️ Hours Learned</div><div class="stat-value" data-target="${totalHours}">0</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">🎓 Certificates</div><div class="stat-value" data-target="${certs}">0</div></div>
                </div>

                <div class="section-title"><span>📖 Continue Learning</span></div>
                <div class="courses-grid">
                    ${continueList.length > 0 ? continueList.map((c) => `
                        <div class="course-card glass-premium fade-in-up">
                            <div class="course-image" style="${courseImageStyle(c)}">
                                <span class="course-badge in-progress">${c.progress}%</span>
                            </div>
                            <div class="course-content">
                                <h3 class="course-title">${c.title}</h3>
                                <div class="course-meta"><i class="fas fa-user"></i> ${c.instructorName} · <i class="fas fa-clock"></i> ${c.hoursSpent}h spent</div>
                                <div class="progress-ring-wrap">
                                    <div class="progress-ring-container">
                                        <svg width="56" height="56" viewBox="0 0 56 56">
                                            <circle class="bg" cx="28" cy="28" r="22"/>
                                            <circle class="fg" cx="28" cy="28" r="22" stroke-dasharray="${2 * Math.PI * 22}" stroke-dashoffset="${(1 - c.progress / 100) * 2 * Math.PI * 22}"/>
                                        </svg>
                                        <span class="center-text">${c.progress}%</span>
                                    </div>
                                    <div><strong>Progress:</strong> ${c.nextLesson}</div>
                                </div>
                                <button class="btn-primary" onclick="openCourse('${c.slug || c._id}')">Continue →</button>
                            </div>
                        </div>
                    `).join('') : `
                        <div class="empty-state"><i class="fas fa-book-open"></i><h3>No courses in progress</h3><p>Enrol in a course to start learning</p><button class="btn-primary" onclick="window.location.href='/courses.html'">Browse Courses</button></div>
                    `}
                </div>

                <div class="section-title"><span>📅 Upcoming Live Sessions</span></div>
                ${state.liveSessions.length > 0 ? state.liveSessions.map((s) => `
                    <div class="stat-card glass-premium" style="margin-bottom:14px;">
                        <div class="stat-title">${s.title}</div>
                        <div class="stat-value" style="font-size:19px;">📅 ${WGAUI.formatDateTime(s.startTime)}</div>
                        <p>${s.courseTitle}</p>
                        ${s.meetingLink
                            ? `<button class="btn-primary" onclick="window.open('${s.meetingLink}','_blank')">Join Session →</button>`
                            : `<button class="btn-primary" onclick="toggleAttendance('${s._id}')">${s.attending ? 'On the guest list' : 'Save my place'}</button>`}
                    </div>
                `).join('') : `<div class="empty-state"><i class="fas fa-calendar-alt"></i><h3>No live sessions scheduled</h3><p>Your instructors have not scheduled anything yet</p></div>`}

                <div class="section-title"><span>🔥 Recommended For You</span></div>
                <div class="courses-grid">
                    ${state.recommendedCourses.length > 0 ? state.recommendedCourses.map((c) => `
                        <div class="course-card glass-premium">
                            <div class="course-image" style="${courseImageStyle(c)}"><span class="course-badge new">NEW</span></div>
                            <div class="course-content">
                                <h3 class="course-title">${c.title}</h3>
                                <p>${c.description}</p>
                                <button class="btn-primary" onclick="openCourse('${c.slug || c._id}')">${c.isFree ? 'Enrol Now →' : 'View Course →'}</button>
                            </div>
                        </div>
                    `).join('') : `<div class="empty-state"><i class="fas fa-compass"></i><h3>Nothing new to suggest</h3><p>You are enrolled in everything currently published</p></div>`}
                </div>
            `;
        }

        function renderCourses() {
            if (state.enrolledCourses.length === 0) {
                return `<div class="empty-state"><i class="fas fa-book-open"></i><h3>No courses yet</h3><p>Enrol in a course and it will appear here</p><button class="btn-primary" onclick="window.location.href='/courses.html'">Browse Catalog</button></div>`;
            }
            return `
                <div class="section-title"><span>📚 My Courses (${state.enrolledCourses.length})</span></div>
                <div class="courses-grid">
                    ${state.enrolledCourses.map(c => `
                        <div class="course-card glass-premium">
                            <div class="course-image" style="${courseImageStyle(c)}">
                                <span class="course-badge ${c.progress === 100 ? 'completed' : 'in-progress'}">${c.progress === 100 ? '✅ Completed' : c.progress + '%'}</span>
                            </div>
                            <div class="course-content">
                                <h3 class="course-title">${c.title}</h3>
                                <div class="course-meta"><i class="fas fa-user"></i> ${c.instructorName} · <i class="fas fa-clock"></i> ${c.hoursSpent}h</div>
                                <div class="progress-ring-wrap">
                                    <div class="progress-ring-container">
                                        <svg width="56" height="56" viewBox="0 0 56 56">
                                            <circle class="bg" cx="28" cy="28" r="22"/>
                                            <circle class="fg" cx="28" cy="28" r="22" stroke-dasharray="${2 * Math.PI * 22}" stroke-dashoffset="${(1 - c.progress/100) * 2 * Math.PI * 22}"/>
                                        </svg>
                                        <span class="center-text">${c.progress}%</span>
                                    </div>
                                    <div><strong>Progress:</strong> ${c.nextLesson}</div>
                                </div>
                                <button class="btn-primary" onclick="openCourse('${c.slug || c._id}')">${c.progress === 100 ? 'Review' : 'Continue'} →</button>
                                <button class="btn-primary btn-outline" style="margin-left:8px;" title="Course discussion" onclick="loadPage('community')"><i class="fas fa-users"></i></button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderLiveSessions() {
            const upcoming = state.liveSessions;
            const past = state.recordings;

            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium"><div class="stat-title">🟢 Upcoming</div><div class="stat-value">${upcoming.length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">📼 Past Sessions</div><div class="stat-value">${past.length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">✋ Saved Places</div><div class="stat-value">${upcoming.filter((s) => s.attending).length}</div></div>
                </div>
                <div class="section-title">🟢 Upcoming Live Classes</div>
                ${upcoming.length > 0 ? upcoming.map((s) => `
                    <div class="stat-card glass-premium" style="margin-bottom:16px;">
                        <div class="stat-title">${s.title}</div>
                        <div class="stat-value" style="font-size:19px;">📅 ${WGAUI.formatDateTime(s.startTime)}</div>
                        <p>${s.courseTitle}</p>
                        ${s.meetingLink
                            ? `<button class="btn-primary" onclick="window.open('${s.meetingLink}','_blank')">Join Session →</button>`
                            : `<button class="btn-primary" onclick="toggleAttendance('${s._id}')">${s.attending ? '✓ On the guest list' : 'Save my place'}</button>`}
                    </div>
                `).join('') : `<div class="empty-state"><i class="fas fa-calendar-alt"></i><h3>No upcoming sessions</h3><p>Nothing is scheduled for your courses just now</p></div>`}

                <div class="section-title">📼 Past Sessions</div>
                <div class="courses-grid">
                    ${past.length > 0 ? past.map((s) => `
                        <div class="course-card glass-premium"><div class="course-content"><h3 class="course-title">${s.title}</h3><p>${s.courseTitle}</p><p style="font-size:13px;color:var(--text-light);">${WGAUI.formatDate(s.endTime)}</p>${
                            s.recordingUrl
                                ? `<button class="btn-primary" onclick="window.open('${s.recordingUrl}','_blank')">Watch →</button>`
                                : `<p style="font-size:13px;color:var(--text-light);">No recording was posted</p>`
                        }</div></div>
                    `).join('') : `<div class="empty-state"><i class="fas fa-video"></i><h3>No past sessions yet</h3></div>`}
                </div>
            `;
        }

        function renderCommunity() {
            return `
                <div class="section-title">� Recent Discussions</div>
                ${state.discussions.length > 0 ? state.discussions.map((d) => `
                    <div class="stat-card glass-premium" style="margin-bottom:12px;">
                        <div style="display:flex;justify-content:space-between;gap:12px;">
                            <strong>${d.title}</strong>
                            <span style="font-size:12px;color:var(--text-light);white-space:nowrap;">${WGAUI.formatRelative(d.createdAt)}</span>
                        </div>
                        <div style="font-size:13px;color:var(--text-light);margin:4px 0;">${d.courseTitle}</div>
                        <div style="font-size:14px;">${d.excerpt}</div>
                        <div style="font-size:12.5px;color:var(--text-light);margin-top:6px;">
                            ${WGAUI.escapeHtml(d.authorName)} · ${d.replyCount} ${d.replyCount === 1 ? 'reply' : 'replies'} · ${d.likeCount} likes
                        </div>
                    </div>
                `).join('') : `<div class="empty-state"><i class="fas fa-comments"></i><h3>No discussions yet</h3><p>Questions asked in your courses will appear here</p></div>`}

                <div class="section-title">📚 Your Course Communities</div>
                <div class="courses-grid">
                    ${state.enrolledCourses.length > 0 ? state.enrolledCourses.map((c) => `
                        <div class="course-card glass-premium"><div class="course-content"><h3 class="course-title">${c.title}</h3><p>Discuss this course with your peers</p><button class="btn-primary" onclick="openCourse('${c.slug || c._id}')">Open Course</button></div></div>
                    `).join('') : `<div class="empty-state"><i class="fas fa-book-open"></i><h3>No courses yet</h3><button class="btn-primary" onclick="window.location.href='/courses.html'">Browse Catalog</button></div>`}
                </div>

                <div class="section-title">👥 Study Groups</div>
                <div class="courses-grid">
                    ${state.studyGroups.length > 0 ? state.studyGroups.map((g) => `
                        <div class="course-card glass-premium"><div class="course-content"><h3 class="course-title">${g.name}</h3><p>${g.members} ${g.members === 1 ? 'member' : 'members'}</p>${g.isMember ? '<p style="font-size:13px;color:#10b981;">✓ You are a member</p>' : ''}</div></div>
                    `).join('') : `<div class="empty-state"><i class="fas fa-user-group"></i><h3>No study groups</h3><p>Study groups you join will appear here</p></div>`}
                </div>
            `;
        }

        function renderMessages() {
            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium"><div class="stat-title">📩 Unread</div><div class="stat-value">${state.conversations.filter((c) => c.unread).length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">💬 Conversations</div><div class="stat-value">${state.conversations.length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">👥 Groups</div><div class="stat-value">${state.studyGroups.length}</div></div>
                </div>
                <div class="section-title">💬 Conversations</div>
                ${state.conversations.length > 0 ? state.conversations.map((c) => `
                    <div class="stat-card glass-premium" style="margin-bottom:12px;cursor:pointer;" onclick="openThread('${c.id}')">
                        <div style="display:flex;justify-content:space-between;"><strong>${c.name}</strong><span style="font-size:12px;color:var(--text-light);">${c.time}</span></div>
                        <div style="font-size:14px;">${c.lastMessage}</div>
                        ${c.unread ? '<span style="background:var(--gold);color:#0f172a;padding:2px 12px;border-radius:30px;font-size:11px;display:inline-block;margin-top:6px;">New</span>' : ''}
                    </div>
                `).join('') : `<div class="empty-state"><i class="fas fa-envelope"></i><h3>No messages yet</h3><p>Messages with your instructors and study groups appear here</p></div>`}
                <button class="btn-primary" onclick="openNewMessageModal()">+ New Message</button>
            `;
        }

        function renderCertificates() {
            const earned = state.certificates.filter((c) => !c.revoked);

            if (earned.length === 0) {
                return `<div class="empty-state"><i class="fas fa-certificate"></i><h3>No certificates yet</h3><p>Finish every lesson in a course and your certificate is issued automatically</p><button class="btn-primary" onclick="loadPage('courses')">View Courses</button></div>`;
            }

            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium"><div class="stat-title">🎓 Earned</div><div class="stat-value">${earned.length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">🔗 Verifiable</div><div class="stat-value">${earned.length}</div></div>
                </div>
                <div class="courses-grid">
                    ${earned.map((c) => `
                        <div class="course-card glass-premium" style="text-align:center;">
                            <div class="course-content">
                                <i class="fas fa-certificate" style="font-size:56px;color:var(--gold);margin-bottom:12px;"></i>
                                <h3 class="course-title">${c.courseTitle}</h3>
                                <p>Issued: ${WGAUI.formatDate(c.issueDate)}</p>
                                <p style="font-size:13px;color:var(--text-light);margin-top:6px;">
                                    Certificate ${c.certificateNumber}${c.hoursCompleted ? ` · ${c.hoursCompleted} hours` : ''}
                                </p>
                                <div style="display:inline-flex;gap:8px;margin:12px 0;padding:6px 16px;background:rgba(212,165,71,0.08);border-radius:30px;">
                                    <i class="fas fa-link"></i> Publicly verifiable
                                </div>
                                <button class="btn-primary" onclick="openCertificate('${c.verificationCode}')">View &amp; Verify</button>
                                ${c.pdfUrl ? `<a class="btn-primary btn-outline" href="${c.pdfUrl}" target="_blank" rel="noopener">Download PDF</a>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <p style="text-align:center;margin-top:22px;font-size:13px;color:var(--text-light);">
                    Anyone can verify a certificate from Wuteve Global Academy — no account needed.
                </p>
            `;
        }

        function renderProfile() {
            const u = state.user;

            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium"><div class="stat-title">⏱️ Hours Learned</div><div class="stat-value">${state.stats.hoursLearned || 0}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">📚 Courses</div><div class="stat-value">${state.stats.enrolled || 0}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">✅ Completed</div><div class="stat-value">${state.stats.completed || 0}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">🎓 Certificates</div><div class="stat-value">${state.stats.certificates || 0}</div></div>
                </div>
                <div class="stat-card glass-premium" style="max-width:600px;">
                    <h3 style="margin-bottom:20px; color:var(--gold);">👤 Profile Information</h3>
                    <div class="form-group"><label>First Name</label><input type="text" id="pFirstName" value="${WGAUI.escapeHtml(u.firstName || '')}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.15);"></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="pLastName" value="${WGAUI.escapeHtml(u.lastName || '')}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.15);"></div>
                    <div class="form-group"><label>Email</label><input type="email" value="${WGAUI.escapeHtml(u.email || '')}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.15);" disabled></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="pPhone" value="${WGAUI.escapeHtml(u.phone || '')}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.15);"></div>
                    <p style="font-size:12.5px;color:var(--text-light);margin-bottom:14px;">Your email address is used to sign in and cannot be changed here.</p>
                    <button class="btn-primary" onclick="updateProfile()">Update Profile</button>
                    <button class="btn-primary btn-outline" style="margin-left:12px;" onclick="openChangePassword()">Change Password</button>
                </div>
            `;
        }

        // ============================================================
        //  ACTION HANDLERS
        // ============================================================
        // Removed from this section: askAI, openChat and sendChatMessage.
        //
        // askAI answered any question with one of two canned paragraphs — the
        // page presented it as an assistant that was "here 24/7". openChat and
        // sendChatMessage opened a conversation window in which the other person
        // always replied "Thanks! I'll get back to you soon." after 800ms.
        // Neither reached a server. A student could have believed they had
        // messaged their instructor.

        window.openNewMessageModal = function openNewMessageModal() {
            // Recipients are the instructors of this student's courses, which is
            // the only relationship the API guarantees a student may message.
            const byId = new Map();

            state.enrolledCourses.forEach((c) => {
                if (c.instructorId) byId.set(c.instructorId, c.instructorName);
            });

            if (byId.size === 0) {
                openModal(
                    '✉️ New Message',
                    `<p>You are not enrolled in any course yet, so there is nobody to message.</p>
                     <p style="font-size:13px;color:var(--text-light);margin-top:10px;">Once you enrol, you can message your instructor from here.</p>`
                );
                return;
            }

            const options = Array.from(byId.entries())
                .map(([id, name]) => `<option value="${id}">${WGAUI.escapeHtml(name)}</option>`)
                .join('');

            openModal(
                '✉️ New Message',
                `<div class="form-group"><label>To</label><select id="nmRecipient" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);">${options}</select></div>
                 <div class="form-group"><label>Message</label><textarea rows="4" id="nmBody" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);" placeholder="Type your message..."></textarea></div>
                 <button class="btn-primary" onclick="sendNewMessage()">Send</button>`
            );
        };

        window.sendNewMessage = async function sendNewMessage() {
            const recipientId = document.getElementById('nmRecipient')?.value;
            const message = document.getElementById('nmBody')?.value?.trim();

            if (!recipientId || !message) {
                showToast('Write a message before sending.', 'error');
                return;
            }

            try {
                await WGA.post('/messages/threads', { recipientId, message });
                closeModal();
                showToast('Message sent.', 'success');

                await loadStudentData();
                loadPage('messages');
            } catch (error) {
                showToast(error.message || 'We could not send that message.', 'error');
            }
        };

        window.updateProfile = async function updateProfile() {
            const firstName = document.getElementById('pFirstName')?.value.trim();
            const lastName = document.getElementById('pLastName')?.value.trim();
            const phone = document.getElementById('pPhone')?.value.trim();

            try {
                const data = await WGA.patch('/auth/me', { firstName, lastName, phone });

                state.user = { ...state.user, ...data.user };
                WGA.setSession({ user: data.user });

                document.getElementById('user-name').textContent = data.user.firstName || 'Student';
                document.getElementById('userAvatar').textContent = (data.user.firstName || 'S')[0].toUpperCase();

                showToast('Your profile has been saved.', 'success');
            } catch (error) {
                // Field-level messages from the API, so the student knows which
                // input to fix.
                if (error.details && error.details.length) {
                    showToast(error.details[0].message, 'error');
                    return;
                }
                showToast(error.message || 'We could not save your profile.', 'error');
            }
        };

        window.openChangePassword = function openChangePassword() {
            openModal(
                '🔑 Change Password',
                `<div class="form-group"><label>Current password</label><input type="password" id="cpCurrent" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);"></div>
                 <div class="form-group"><label>New password</label><input type="password" id="cpNew" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);"></div>
                 <div class="form-group"><label>Confirm new password</label><input type="password" id="cpConfirm" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);"></div>
                 <p style="font-size:12.5px;color:var(--text-light);margin-bottom:14px;">At least 8 characters, including a letter and a number. You will be signed out of every other device.</p>
                 <button class="btn-primary" onclick="submitChangePassword()">Update password</button>`
            );
        };

        window.submitChangePassword = async function submitChangePassword() {
            const currentPassword = document.getElementById('cpCurrent')?.value || '';
            const newPassword = document.getElementById('cpNew')?.value || '';
            const confirmPassword = document.getElementById('cpConfirm')?.value || '';

            if (!currentPassword || !newPassword) {
                showToast('Fill in both password fields.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('The two new passwords do not match.', 'error');
                return;
            }

            try {
                // The API revokes every other session and returns a fresh pair
                // for this device, so the student is not signed out here.
                const data = await WGA.post('/auth/change-password', { currentPassword, newPassword });

                WGA.setSession(data);
                closeModal();
                showToast('Your password has been changed. Other devices were signed out.', 'success');
            } catch (error) {
                showToast(error.message || 'We could not change your password.', 'error');
            }
        };

        // ============================================================
        //  NOTIFICATIONS
        // ============================================================
        function loadNotifications() {
            const container = document.getElementById('notifList');
            container.innerHTML = state.notifications.map(n => `
                <div class="notification-item ${n.read ? '' : 'unread'}" onclick="markRead('${n._id}')">
                    <strong>${n.title}</strong>
                    <p>${n.message}</p>
                    <span class="time">${new Date(n.createdAt).toLocaleString()}</span>
                </div>
            `).join('');
        }

        window.markRead = async function (id) {
            const notification = state.notifications.find((x) => x._id === id);
            if (!notification || notification.read) return;

            try {
                await WGA.post(`/notifications/${encodeURIComponent(id)}/read`);
                notification.read = true;
                state.unread.notifications = Math.max(0, (state.unread.notifications || 1) - 1);
                updateNotifBadge();
                loadNotifications();
            } catch (error) {
                showToast(error.message || 'We could not mark that as read.', 'error');
            }
        };

        // ============================================================
        //  PAGE NAVIGATION
        // ============================================================
        async function loadPage(page) {
            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div></div>';
            state.currentPage = page;

            setTimeout(() => {
                let html = '';
                switch (page) {
                    case 'overview':
                        html = renderOverview();
                        break;
                    case 'courses':
                        html = renderCourses();
                        break;
                    case 'live-sessions':
                        html = renderLiveSessions();
                        break;
                    case 'community':
                        html = renderCommunity();
                        break;
                    case 'messages':
                        html = renderMessages();
                        break;
                    case 'certificates':
                        html = renderCertificates();
                        break;
                    case 'profile':
                        html = renderProfile();
                        break;
                    default:
                        html = renderOverview();
                }
                content.innerHTML = html;
                observeCounters();
            }, 300);

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.toggle('active', link.getAttribute('data-page') === page);
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            if (!checkAuth()) return;

            // Load everything before the first render, so the overview is built
            // from real data. If it fails we say so — showing zeros instead would
            // read as "you have done nothing" rather than "we could not reach the
            // server".
            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div></div>';

            try {
                await loadStudentData();
            } catch (error) {
                content.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-triangle-exclamation"></i>
                        <h3>We could not load your dashboard</h3>
                        <p>${WGAUI.escapeHtml(error.message || 'Please try again in a moment.')}</p>
                        <button class="btn-primary" onclick="window.location.reload()">Try again</button>
                    </div>`;
                return;
            }

            await loadPage('overview');
            loadNotifications();

            // Sign out through the API so the refresh token is revoked on the
            // server. Clearing localStorage alone leaves a live session that
            // anyone holding the token could keep using.
            document.getElementById('logout-btn').addEventListener('click', () => {
                WGA.logout().finally(() => {
                    window.location.href = '/login.html?reason=signout';
                });
            });

            document.getElementById('notifBtn').addEventListener('click', () => {
                document.getElementById('notifPanel').classList.toggle('open');
                loadNotifications();
            });
            document.getElementById('closeNotif').addEventListener('click', () => {
                document.getElementById('notifPanel').classList.remove('open');
            });

            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = link.getAttribute('data-page');
                    loadPage(page);
                    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
                });
            });

            const themeToggle = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
            });

            document.getElementById('globalSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = e.target.value.trim();
                    // Search the real catalog rather than reporting that a search
                    // happened and then doing nothing.
                    if (val) window.location.href = '/courses.html?q=' + encodeURIComponent(val);
                }
            });
        }

        init();
    </script>
</body>
</html>
