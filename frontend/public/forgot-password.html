<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Imges/Brand/wuteve-emblem.png" />
  <title>Reset your password · Wuteve Global Academy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/wga-shell.css" />
</head>
<body>
  <header class="wga-header">
    <a class="wga-brand" href="/">
      <img class="brand-mark" src="/Imges/Brand/wuteve-emblem.png" alt="" width="34" height="34" />
      Wuteve <span class="accent">Global Academy</span>
    </a>
    <button class="wga-theme-toggle" data-theme-toggle type="button" aria-label="Toggle colour theme">🌙</button>
  </header>

  <main class="wga-main wga-narrow">
    <div class="wga-card">
      <h1>Forgot your password?</h1>
      <p>Enter the email address on your account and we will send you a link to choose a new password.</p>

      <div class="wga-alert" id="status" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="wga-field">
          <label class="wga-label" for="email">Email address</label>
          <input class="wga-input" type="email" id="email" name="email" autocomplete="email"
                 placeholder="you@example.com" required />
        </div>

        <button class="wga-btn wga-btn-primary wga-btn-block" type="submit" id="submit">
          <i class="fas fa-paper-plane" aria-hidden="true"></i>
          Send reset link
        </button>
      </form>

      <p class="wga-divider" style="margin-bottom:0;">
        Remembered it? <a href="/login.html">Back to sign in</a>
      </p>
    </div>

    <p class="wga-muted" style="text-align:center;margin-top:20px;font-size:13px;">
      For your security we send the same response whether or not that address has an account.
    </p>
  </main>

  <script src="/assets/js/wga-api.js"></script>
  <script src="/assets/js/wga-ui.js"></script>
  <script>
    (function () {
      'use strict';

      WGAUI.initTheme();

      var form = document.getElementById('forgot-form');
      var button = document.getElementById('submit');
      var statusBox = document.getElementById('status');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var email = document.getElementById('email').value.trim();

        if (!email) {
          WGAUI.status(statusBox, 'Enter the email address on your account.', 'error');
          return;
        }

        WGAUI.status(statusBox, null);
        WGAUI.setBusy(button, true, 'Sending…');

        WGA.post('/auth/forgot-password', { email })
          .then(function () {
            // The message the server returns is intentionally the same in both
            // cases, so it does not reveal whether the address is registered.
            WGAUI.status(
              statusBox,
              'If that email address has an account, a password reset link is on its way. Check your inbox and your spam folder.',
              'success'
            );
            form.reset();
          })
          .catch(function (error) {
            if (error.code === 'RATE_LIMITED') {
              WGAUI.status(statusBox, 'Too many requests. Please wait a little while and try again.', 'error');
            } else if (error.details && error.details.length) {
              WGAUI.status(statusBox, error.details[0].message, 'error');
            } else {
              WGAUI.status(statusBox, error.message || 'We could not send the link. Please try again.', 'error');
            }
          })
          .finally(function () {
            WGAUI.setBusy(button, false);
          });
      });
    })();
  </script>
</body>
</html>
