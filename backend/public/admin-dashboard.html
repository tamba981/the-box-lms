<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
    <title>Admin Dashboard · Wuteve Global Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ----- CSS Variables & Base ----- */
        :root {
            --primary: #1a56db;
            --primary-dark: #0f3b8c;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #0f3b8c 100%);
            --gold: #d4a547;
            --gold-light: #f0d080;
            --silver: #c0c0c0;
            --silver-light: #e8e8e8;
            --secondary: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f0f5ff;
            --border: #e5e7eb;
            --dark-bg: #0a1628;
            --dark-text: #e2e8f0;
            --dark-card: rgba(30, 41, 59, 0.7);
            --dark-border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --glass-blur: 20px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 30px rgba(26, 86, 219, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #0f2b5e 0%, #1a0a3a 100%);
            min-height: 100vh;
            line-height: 1.6;
            background-attachment: fixed;
            transition: background 0.3s;
        }

        body.dark-mode {
            --text-light: #94a3b8; /* #6b7280 is a light-background grey: 3.65:1 here */
            background: linear-gradient(135deg, #0a1628 0%, #1a0a3a 100%);
            color: var(--dark-text);
        }

        /* ----- Glassmorphism Premium ----- */
        .glass-premium {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            transition: all 0.3s ease;
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(212, 165, 71, 0.25);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(26, 86, 219, 0.08);
        }

        body.dark-mode .glass-premium {
            background: rgba(10, 22, 40, 0.5);
            border-color: rgba(255, 255, 255, 0.03);
        }

        body.dark-mode .glass-hover:hover {
            background: rgba(10, 22, 40, 0.7);
            border-color: rgba(212, 165, 71, 0.20);
        }

        /* ----- Header (glass) ----- */
        .header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }

        body.dark-mode .header {
            background: rgba(10, 22, 40, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            max-width: 1600px;
            margin: 0 auto;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* The emblem is navy, so on the dark theme it sits on a white chip. */
        .header-left .brand-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 50%;
            background: #fff;
            padding: 3px;
            object-fit: contain;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            font-weight: 400;
            font-size: 14px;
            background: linear-gradient(135deg, var(--silver), var(--silver-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .header-search {
            flex: 1;
            max-width: 420px;
            min-width: 160px;
            position: relative;
        }
        .header-search input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            font-size: 14px;
            transition: 0.3s;
        }
        body.dark-mode .header-search input {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }
        .header-search input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 71, 0.08);
        }
        .header-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text);
            position: relative;
        }
        body.dark-mode .btn-icon {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            color: var(--dark-text);
        }
        .btn-icon:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        body.dark-mode .notification-badge {
            border-color: var(--dark-bg);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.20);
        }

        .logout-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        body.dark-mode .logout-btn {
            color: var(--dark-text);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .logout-btn:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        /* ----- Sidebar (glass) ----- */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 16px;
            position: fixed;
            height: calc(100vh - 73px);
            overflow-y: auto;
            transition: all 0.3s;
            z-index: 50;
        }

        body.dark-mode .sidebar {
            background: rgba(10, 22, 40, 0.65);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text);
            text-decoration: none;
            border-radius: 16px;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 14px;
        }
        body.dark-mode .sidebar-link {
            color: var(--dark-text);
        }

        .sidebar-link:hover {
            background: rgba(26, 86, 219, 0.05);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.25);
            transform: translateX(6px);
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        body.dark-mode .sidebar-footer {
            border-top-color: rgba(255, 255, 255, 0.03);
        }

        .sidebar-footer .sidebar-link {
            font-size: 13px;
        }

        /* ----- Main Content ----- */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 28px 32px 40px;
            transition: margin 0.3s;
        }

        /* Quick Stats Banner (glass) */
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .quick-stat {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        body.dark-mode .quick-stat {
            background: rgba(30, 41, 59, 0.20);
            border-color: rgba(255, 255, 255, 0.02);
        }
        .quick-stat .label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }
        .quick-stat .value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 2px;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            padding: 24px 20px;
            transition: all 0.3s;
            cursor: default;
        }

        .stat-title {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-change.up {
            color: var(--success);
        }
        .stat-change.down {
            color: var(--danger);
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            padding: 24px 20px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        canvas {
            max-height: 260px;
            width: 100% !important;
        }

        /* Tables (glass) */
        .table-container {
            padding: 20px 0 0;
            overflow-x: auto;
            margin-bottom: 24px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 0 20px 16px;
        }

        .table-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .table-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-toolbar input,
        .table-toolbar select {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-size: 13px;
        }
        body.dark-mode .table-toolbar input,
        body.dark-mode .table-toolbar select {
            background: rgba(30, 41, 59, 0.20);
            border-color: rgba(255, 255, 255, 0.03);
            color: var(--dark-text);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        body.dark-mode .data-table th,
        body.dark-mode .data-table td {
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }

        .data-table th {
            font-weight: 600;
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .data-table tr:hover td {
            background: rgba(26, 86, 219, 0.02);
        }
        body.dark-mode .data-table tr:hover td {
            background: rgba(26, 86, 219, 0.03);
        }

        .badge {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge.active {
            background: var(--success);
            color: white;
        }
        .badge.inactive {
            background: var(--danger);
            color: white;
        }
        .badge.pending {
            background: var(--warning);
            color: white;
        }
        .badge.approved {
            background: var(--success);
            color: white;
        }
        .badge.draft {
            background: var(--text-light);
            color: white;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: none;
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            margin: 0 2px;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn.edit {
            color: var(--primary);
        }
        .action-btn.delete {
            color: var(--danger);
        }
        .action-btn.view {
            color: var(--success);
        }
        .action-btn.approve {
            color: var(--success);
        }

        /* Buttons */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.30);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            color: var(--text);
        }
        body.dark-mode .btn-outline {
            border-color: rgba(255, 255, 255, 0.03);
            color: var(--dark-text);
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
        }

        /* Modal (glass) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            max-width: 600px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-lg);
        }
        body.dark-mode .modal-content {
            background: rgba(10, 22, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.02);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        body.dark-mode .modal-header {
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }
        body.dark-mode .form-group input,
        body.dark-mode .form-group select,
        body.dark-mode .form-group textarea {
            background: rgba(30, 41, 59, 0.20);
            border-color: rgba(255, 255, 255, 0.03);
            color: var(--dark-text);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 71, 0.06);
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 165, 71, 0.10);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Activity Feed */
        .activity-feed {
            padding: 6px 0;
        }
        .activity-item {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            align-items: flex-start;
        }
        body.dark-mode .activity-item {
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(26, 86, 219, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            flex-shrink: 0;
        }
        .activity-text {
            flex: 1;
        }
        .activity-text .time {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }
        body.dark-mode .mobile-menu-btn {
            color: var(--dark-text);
        }

        @media (max-width: 992px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 150;
                width: 280px;
                transition: transform 0.3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .quick-stats {
                grid-template-columns: 1fr 1fr;
            }
            .mobile-menu-btn {
                display: block;
            }
            .header-search {
                display: none;
            }
            .header-content {
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .quick-stats {
                grid-template-columns: 1fr 1fr;
            }
            .table-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>

<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-content">

    <script>
        // ============================================================
        //  LIVE DATA
        // ============================================================
        /**
         * This object used to be a fixture: 15,234 users, 456 courses, $125,680
         * of revenue, 5,678 certificates and five invented people called John
         * Doe. Every figure an administrator saw was fabricated, and several of
         * the action handlers ("Certificate verified on blockchain!", "Settings
         * saved!") reported success for work that never happened.
         *
         * It now holds only what the API returned. Empty arrays and zeroes mean
         * "nothing here yet" and the pages say so, rather than inventing rows.
         */
        let adminData = {
            user: null,
            stats: null,
            users: [],
            courses: [],
            pendingCourses: [],
            // Applications waiting on a decision. A separate fetch from `users`
            // because that list is capped at 50 rows overall, so a waiting
            // applicant could otherwise sit past the end of it and never be seen.
            pendingInstructors: [],
            certificates: [],
            payments: [],
            manualOrders: [],
            manualStats: null,
            enrollments: [],
            revenue: [],
            recent: { signups: [], enrollments: [] },
            unread: 0
        };

        let state = {
            currentPage: 'overview',
            charts: {},
            notifOpen: false,
            cvStatus: 'pending',
            reviewStatus: 'pending',
            admissionStatus: 'pending'
        };

        /** Load everything the dashboard summarises, in parallel. */
        async function loadAdminData() {
            // WGA.get already unwraps the { success, data } envelope and takes
            // its query string as `query`, not `params`.
            const [stats, users, courses, pending, pendingInstructors, certificates, payments, enrollments, notifications, manualOrders, manualStats] =
                await Promise.all([
                    WGA.get('/admin/stats'),
                    WGA.get('/admin/users', { query: { limit: 50 } }),
                    WGA.get('/admin/courses', { query: { limit: 50 } }),
                    WGA.get('/admin/courses', { query: { status: 'pending', limit: 50 } }),
                    WGA.get('/admin/users', { query: { role: 'instructor', status: 'pending', limit: 50 } }),
                    WGA.get('/admin/certificates', { query: { limit: 50 } }),
                    WGA.get('/payments', { query: { limit: 50 } }),
                    WGA.get('/admin/enrollments', { query: { limit: 50 } }),
                    WGA.get('/notifications', { query: { limit: 20 } }),
                    // Every manual order that is not yet settled, so the queue is
                    // never hiding one behind a filter the operator forgot about.
                    WGA.get('/admin/payments/manual', { query: { limit: 50 } }),
                    WGA.get('/admin/payments/manual/stats')
                ]);

            adminData.user = WGA.getUser();
            adminData.stats = stats;
            adminData.users = users.items || [];
            adminData.courses = courses.items || [];
            adminData.pendingCourses = pending.items || [];
            adminData.pendingInstructors = pendingInstructors.items || [];
            adminData.certificates = certificates.items || [];
            adminData.certificateCounts = certificates.counts || { issued: 0, revoked: 0, total: 0 };
            adminData.payments = payments.items || [];
            adminData.manualOrders = manualOrders.items || [];
            adminData.manualStats = manualStats || null;
            adminData.enrollments = enrollments.items || [];
            adminData.revenue = stats.revenue || [];
            adminData.recent = stats.recent || { signups: [], enrollments: [] };
            adminData.notifications = notifications.items || [];
            adminData.unread =
                notifications.unreadCount === undefined
                    ? (notifications.items || []).filter((n) => !n.read).length
                    : notifications.unreadCount;
        }

        // ============================================================
        //  AUTH
        // ============================================================
        function checkAuth() {
            // The page guard already confirmed this session with the server and
            // refused to reveal the document otherwise, so there is nothing left
            // to verify here — and no reason to trust localStorage for the role,
            // which is what the previous version of this function did.
            const user = WGA.getUser();
            if (!user) return false;

            adminData.user = user;
            const avatar = document.getElementById('userAvatar');
            if (avatar) {
                // The photo replaces the initial, but the element still carries
                // its own click handler (the account menu), so nothing here
                // takes over the click.
                avatar.innerHTML = WGAUI.avatar(user, 40);
                avatar.style.padding = '0';
                avatar.style.overflow = 'hidden';

                // It is a div styled as a button, so give it the keyboard
                // behaviour a real button would have had.
                avatar.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openMyAccount();
                    }
                });
            }
            return true;
        }

        // ============================================================
        //  UI HELPERS (preserved + enhanced)
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#3b82f6';
            toast.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: ${bgColor}; color: white; padding: 12px 28px; border-radius: 40px;
                z-index: 2000; animation: fadeInUp 0.3s ease; font-weight: 600; font-size: 14px;
                box-shadow: 0 8px 30px rgba(0,0,0,0.10); max-width: 90%; text-align: center;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3200);
        }

        function openModal(title, body) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============================================================
        //  ANIMATED COUNTER
        // ============================================================
        /**
         * Count up to a figure.
         *
         * Small counts are set immediately — a four-item total has nothing to
         * reveal, and easing through 0,1,2,3 puts a number on screen that is
         * simply wrong for two seconds. A timer backstop pins the final value in
         * case the browser throttles animation frames in a background tab.
         */
        function animateNumber(element, target, duration = 2000) {
            const value = Number.isFinite(target) ? target : 0;
            const finish = () => { element.textContent = value.toLocaleString(); };

            if (value < 10) {
                finish();
                return;
            }

            const startTime = performance.now();
            let done = false;

            function update(currentTime) {
                if (done) return;

                const progress = Math.min((currentTime - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                element.textContent = Math.round(eased * value).toLocaleString();

                if (progress < 1) requestAnimationFrame(update);
                else done = true;
            }

            requestAnimationFrame(update);
            setTimeout(() => { if (!done) { done = true; finish(); } }, duration + 400);
        }

        /** Start every stat counter that has scrolled into view. */
        function observeCounters() {
            const counters = document.querySelectorAll('.stat-value[data-target]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    const target = parseInt(entry.target.dataset.target, 10);
                    animateNumber(entry.target, Number.isNaN(target) ? 0 : target);
                    observer.unobserve(entry.target);
                });
            }, { threshold: 0.3 });

            counters.forEach((el) => observer.observe(el));
        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================
        /** Real revenue totals, or an honest blank when nothing has been sold. */
        function revenueHeadline(entries) {
            if (!entries || entries.length === 0) return { value: '—', note: 'No payments recorded' };

            const primary = entries[0];
            const note =
                entries.length > 1
                    ? `Across ${entries.length} currencies: ${entries.map((entry) => `${entry.totalLabel} (${entry.payments})`).join(' · ')}`
                    // "Paid enrolment" was accurate while a payment could only buy
                    // a course. A certificate fee is money and is not an enrolment.
                    : `${primary.payments} paid transaction${primary.payments === 1 ? '' : 's'}`;

            return { value: primary.totalLabel, note, mixed: entries.length > 1 };
        }

        /**
         * A stat figure.
         *
         * The number is written into the markup straight away rather than being
         * rendered as 0 and left for the IntersectionObserver to fill in. The
         * observer only reports elements that are actually on screen, so cards
         * below the fold kept the placeholder — the dashboard read "Courses 0"
         * beside "5 published". Counting up is a decoration layered on top of a
         * correct value, never a substitute for one.
         */
        function statValue(value, style) {
            if (typeof value !== 'number' || !Number.isFinite(value)) {
                return `<div class="stat-value"${style ? ` style="${style}"` : ''}>—</div>`;
            }

            return `<div class="stat-value" data-target="${value}"${style ? ` style="${style}"` : ''}>${value.toLocaleString()}</div>`;
        }

        function renderOverview() {
            const stats = adminData.stats || {};
            const users = stats.users || { total: 0, students: 0, instructors: 0, admins: 0 };
            const courses = stats.courses || { total: 0, published: 0, draft: 0, pending: 0 };
            const enrollments = stats.enrollments || { total: 0, completed: 0 };
            const certificates = stats.certificates || { issued: 0 };
            const revenue = revenueHeadline(adminData.revenue);

            // There is no revenue-over-time series and no signup-over-time series
            // in the API, so there are no charts here. The previous version drew
            // two of them from hardcoded arrays — graphs of nothing, presented as
            // the platform's own figures.
            const rows = (items, empty, render) =>
                items.length > 0
                    ? items.map(render).join('')
                    : `<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--text-light);">${empty}</td></tr>`;

            const signups = adminData.recent.signups || [];
            const recentEnrollments = adminData.recent.enrollments || [];

            return `
                <div class="stats-grid">
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Total Users</div>${statValue(users.total)}<div class="stat-change">${users.students} students · ${users.instructors} instructors · ${users.admins} admin${users.admins === 1 ? '' : 's'}</div></div>
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Courses</div>${statValue(courses.total)}<div class="stat-change">${courses.published} published · ${courses.draft} draft${courses.pending ? ` · ${courses.pending} awaiting review` : ''}</div></div>
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Enrolments</div>${statValue(enrollments.total)}<div class="stat-change">${enrollments.completed} completed</div></div>
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Certificates Issued</div>${statValue(certificates.issued)}<div class="stat-change">currently valid</div></div>
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Revenue</div><div class="stat-value" style="font-size:24px;">${WGAUI.escapeHtml(revenue.value)}</div><div class="stat-change"${revenue.mixed ? ' style="color:#b45309;"' : ''}>${WGAUI.escapeHtml(revenue.note)}</div></div>
                    <div class="stat-card glass-premium glass-hover"><div class="stat-title">Needs Attention</div>${statValue(stats.needsAttention ? stats.needsAttention.pendingCourses : null, (stats.needsAttention?.pendingCourses || 0) > 0 ? 'color:var(--warning);' : '')}<div class="stat-change">course${(stats.needsAttention?.pendingCourses || 0) === 1 ? '' : 's'} awaiting review</div></div>
                </div>

                <div class="table-container glass-premium">
                    <div class="table-header">
                        <h3>🔄 Recent Activity</h3>
                        <div class="table-toolbar"><button class="btn-primary btn-outline" onclick="loadPage('users')">View All</button></div>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Who</th><th>What</th><th>When</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${rows([...signups.map((u) => ({ u })), ...recentEnrollments.map((e) => ({ e }))], 'Nothing has happened yet.',
                                ({ u, e }) => u
                                    ? `<tr><td>${WGAUI.escapeHtml(u.fullName || u.email)}</td><td>created a ${WGAUI.escapeHtml(u.role)} account</td><td>${WGAUI.formatRelative(u.createdAt)}</td><td><button class="action-btn view" onclick="viewUser('${u.id}')"><i class="fas fa-eye"></i></button></td></tr>`
                                    : `<tr><td>${WGAUI.escapeHtml(e.studentName)}</td><td>enrolled in ${WGAUI.escapeHtml(e.courseTitle)}</td><td>${WGAUI.formatRelative(e.enrolledAt)}</td><td><button class="action-btn view" onclick="viewUser('${e.studentId || ''}')"><i class="fas fa-eye"></i></button></td></tr>`
                            )}
                        </tbody>
                    </table>
                </div>

                <div class="table-container glass-premium">
                    <div class="table-header">
                        <h3>⏳ Pending Course Approvals</h3>
                        <div class="table-toolbar"><button class="btn-primary btn-outline" onclick="loadPage('courses')">View All</button></div>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Course</th><th>Instructor</th><th>Price</th><th>Updated</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${adminData.pendingCourses.length > 0
                                ? adminData.pendingCourses.map((c) => `
                                    <tr>
                                        <td>${WGAUI.escapeHtml(c.title)}</td>
                                        <td>${WGAUI.escapeHtml(c.instructor ? c.instructor.name : '—')}</td>
                                        <td>${WGAUI.escapeHtml(c.priceLabel)}</td>
                                        <td>${WGAUI.formatRelative(c.updatedAt)}</td>
                                        <td>
                                            <button class="action-btn approve" onclick="approveCourse('${c.id}')"><i class="fas fa-check-circle"></i> Approve</button>
                                            <button class="action-btn delete" onclick="rejectCourse('${c.id}')"><i class="fas fa-times-circle"></i> Reject</button>
                                        </td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--text-light);">No courses are waiting for review.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderUsers() {
            const statusBadge = (status) =>
                `<span class="badge ${status === 'active' ? 'active' : 'inactive'}">${WGAUI.escapeHtml(status)}</span>`;

            return `
                <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">👥 User Management</span>
                    <button class="btn-primary" onclick="openAddUserModal()">+ Add User</button>
                </div>
                <div class="table-container glass-premium">
                    <div class="table-header">
                        <div class="table-toolbar">
                            <input type="text" id="userSearch" placeholder="Search users..." oninput="filterUsersTable()" />
                            <select id="userRoleFilter" onchange="filterUsersTable()">
                                <option value="">All Roles</option>
                                <option value="student">Student</option>
                                <option value="instructor">Instructor</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <button class="btn-primary btn-outline" onclick="exportUsersCsv()">Export CSV</button>
                    </div>
                    <table class="data-table" id="usersTable">
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Enrolments</th><th>Joined</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${adminData.users.length > 0
                                ? adminData.users.map((user) => `
                                    <tr data-role="${WGAUI.escapeHtml(user.role)}" data-name="${WGAUI.escapeHtml((user.fullName || '').toLowerCase())}">
                                        <td>${WGAUI.escapeHtml(user.fullName || '—')}</td>
                                        <td>${WGAUI.escapeHtml(user.email)}</td>
                                        <td><span class="badge" style="background:var(--gold);color:#0f172a;">${WGAUI.escapeHtml(user.role)}</span></td>
                                        <td>${statusBadge(user.status)}</td>
                                        <td>${user.stats ? `${user.stats.enrollments} (${user.stats.completed} done)` : '—'}</td>
                                        <td>${WGAUI.formatDate(user.createdAt)}</td>
                                        <td>
                                            <button class="action-btn view" title="View account" onclick="viewUser('${user.id}')"><i class="fas fa-eye"></i></button>
                                            <button class="action-btn edit" title="Edit account" onclick="editUser('${user.id}')"><i class="fas fa-edit"></i></button>
                                        </td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-light);">No accounts yet.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderCourses() {
            const statusBadge = (status) => {
                const tone = status === 'published' ? 'active' : status === 'pending' ? 'pending' : 'inactive';
                return `<span class="badge ${tone}">${WGAUI.escapeHtml(status)}</span>`;
            };

            return `
                <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">📚 Course Management</span>
                    <button class="btn-primary btn-outline" onclick="exportCoursesCsv()">Export CSV</button>
                </div>
                <div class="table-container glass-premium">
                    <div class="table-header">
                        <div class="table-toolbar">
                            <input type="text" id="courseSearch" placeholder="Search courses..." oninput="filterTable('courseSearch','coursesTable')" />
                        </div>
                    </div>
                    <table class="data-table" id="coursesTable">
                        <thead><tr><th>Title</th><th>Instructor</th><th>Enrolments</th><th>Price</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${adminData.courses.length > 0
                                ? adminData.courses.map((c) => `
                                    <tr>
                                        <td>${WGAUI.escapeHtml(c.title)}</td>
                                        <td>${WGAUI.escapeHtml(c.instructor ? c.instructor.name : '—')}</td>
                                        <td>${c.enrollmentCount || 0}</td>
                                        <td>${WGAUI.escapeHtml(c.priceLabel)}</td>
                                        <td>${statusBadge(c.status)}</td>
                                        <td>${WGAUI.formatDate(c.updatedAt || c.createdAt)}</td>
                                        <td>
                                            <a class="action-btn view" href="/course.html?slug=${encodeURIComponent(c.slug)}" target="_blank" rel="noopener" title="Open public page"><i class="fas fa-eye"></i></a>
                                            ${c.status !== 'published'
                                                ? `<button class="action-btn approve" onclick="approveCourse('${c.id}')"><i class="fas fa-check-circle"></i> Approve</button>`
                                                : ''}
                                            ${c.status !== 'draft' || c.reviewNote
                                                ? `<button class="action-btn delete" onclick="rejectCourse('${c.id}')"><i class="fas fa-undo"></i> Return to draft</button>`
                                                : ''}
                                        </td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-light);">No courses yet.</td></tr>`}
                        </tbody>
                    </table>
                </div>

                <div style="margin-top:28px;">
                    <h3 style="font-weight:700;margin-bottom:16px;">⏳ Awaiting Review</h3>
                    <div class="table-container glass-premium">
                        <table class="data-table">
                            <thead><tr><th>Title</th><th>Instructor</th><th>Price</th><th>Updated</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${adminData.pendingCourses.length > 0
                                    ? adminData.pendingCourses.map((c) => `
                                        <tr>
                                            <td>${WGAUI.escapeHtml(c.title)}</td>
                                            <td>${WGAUI.escapeHtml(c.instructor ? c.instructor.name : '—')}</td>
                                            <td>${WGAUI.escapeHtml(c.priceLabel)}</td>
                                            <td>${WGAUI.formatRelative(c.updatedAt)}</td>
                                            <td>
                                                <button class="action-btn approve" onclick="approveCourse('${c.id}')"><i class="fas fa-check-circle"></i> Approve</button>
                                                <button class="action-btn delete" onclick="rejectCourse('${c.id}')"><i class="fas fa-times-circle"></i> Reject</button>
                                            </td>
                                        </tr>
                                    `).join('')
                                    : `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-light);">No courses are waiting for review.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        /*
         * Instructor CVs.
         *
         * Its own page rather than a column on the Instructors page: reviewing a
         * document is a queue — read, approve or send back — and mixing it into a
         * roster of everyone makes both jobs worse. The queue is fetched per tab
         * because it changes as instructors upload, which is the one thing the
         * summary payload cannot know.
         */
        state.cvStatus = state.cvStatus || 'pending';

        function cvTabStyle(active) {
            return `padding:9px 18px;border-radius:999px;border:1px solid var(--border);` +
                `background:${active ? 'var(--primary)' : 'transparent'};` +
                `color:${active ? '#fff' : 'inherit'};font-weight:600;font-size:14px;cursor:pointer;`;
        }

        function renderInstructorCvs() {
            const tabs = ['pending', 'approved', 'rejected'];

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">Instructor CVs</span>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
                    ${tabs
                        .map(
                            (tab) =>
                                `<button class="cv-tab" data-status="${tab}" style="${cvTabStyle(state.cvStatus === tab)}" onclick="loadCvQueue('${tab}')">${tab.charAt(0).toUpperCase() + tab.slice(1)}</button>`
                        )
                        .join('')}
                </div>
                <div id="cvBody"><div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div></div>
            `;
        }

        function renderCvRows(instructors) {
            if (!instructors.length) {
                const empty = {
                    pending: 'No CVs are waiting. When an instructor uploads one it appears here.',
                    approved: 'No CVs have been approved yet.',
                    rejected: 'No CVs have been sent back yet.',
                };

                return `<div class="stat-card glass-premium"><div class="stat-title">Nothing ${state.cvStatus}</div><div style="font-size:14px;color:var(--text-light);margin-top:6px;">${empty[state.cvStatus] || ''}</div></div>`;
            }

            const rows = instructors
                .map((instructor) => {
                    const submitted = instructor.cvUploadedAt
                        ? new Date(instructor.cvUploadedAt).toLocaleDateString()
                        : '-';

                    return `
                        <tr>
                            <td>
                                ${WGAUI.escapeHtml(instructor.name)}
                                <div style="font-size:12px;color:var(--text-light);">${WGAUI.escapeHtml(instructor.cvOriginalFilename || '')}</div>
                            </td>
                            <td>${WGAUI.escapeHtml(instructor.email)}</td>
                            <td>${submitted}</td>
                            <td style="white-space:nowrap;">
                                <button class="btn-primary btn-outline btn-sm" onclick="downloadInstructorCv('${instructor.id}', this)">Download</button>
                                ${state.cvStatus === 'approved' ? '' : `<button class="btn-primary btn-sm" onclick="approveCv('${instructor.id}', this)">Approve</button>`}
                                ${state.cvStatus === 'rejected' ? '' : `<button class="btn-primary btn-outline btn-sm" onclick="rejectCv('${instructor.id}', this)">Reject</button>`}
                            </td>
                        </tr>
                    `;
                })
                .join('');

            return `
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Submitted</th><th>Actions</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        window.loadCvQueue = async function loadCvQueue(status) {
            state.cvStatus = status || 'pending';

            document.querySelectorAll('.cv-tab').forEach((tab) => {
                tab.style.cssText = cvTabStyle(tab.dataset.status === state.cvStatus);
            });

            const body = document.getElementById('cvBody');
            if (!body) return;

            body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

            try {
                const data = await WGA.get('/admin/instructors/cv?status=' + encodeURIComponent(state.cvStatus));
                body.innerHTML = renderCvRows(data.instructors || []);
            } catch (error) {
                body.innerHTML = `<p>${WGAUI.escapeHtml(error.message || 'Could not load the queue.')}</p>`;
            }
        };

        window.downloadInstructorCv = (id, button) =>
            withBusy(button, async () => {
                const response = await fetch(WGA.API_BASE + '/admin/instructors/' + encodeURIComponent(id) + '/cv', {
                    headers: { Authorization: 'Bearer ' + WGA.getAccessToken() },
                });

                if (!response.ok) {
                    let message = 'That CV could not be downloaded.';
                    try {
                        const payload = await response.json();
                        if (payload && payload.message) message = payload.message;
                    } catch (error) {
                        /* not json */
                    }
                    throw new Error(message);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');

                link.href = url;
                link.download = 'instructor-cv.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            });

        window.approveCv = (id, button) =>
            withBusy(button, async () => {
                await WGA.post('/admin/instructors/' + encodeURIComponent(id) + '/cv/approve');
                showToast('CV approved.', 'success');
                await loadCvQueue(state.cvStatus);
            });

        window.rejectCv = (id) => {
            openModal(
                'Reject CV',
                `
                    <div class="form-group"><label>Reason</label><textarea id="cvRejectReason" rows="4" maxlength="500" placeholder="What needs adding or changing?"></textarea></div>
                    <p style="font-size:12.5px;color:var(--text-light);">The instructor sees this, so be specific. At least 10 characters.</p>
                    <button class="btn-primary" onclick="confirmRejectCv('${id}', this)">Send back to instructor</button>
                `
            );
        };

        window.confirmRejectCv = (id, button) =>
            withBusy(button, async () => {
                const reason = (document.getElementById('cvRejectReason')?.value || '').trim();

                if (reason.length < 10) {
                    showToast('Give a reason of at least 10 characters.', 'error');
                    return;
                }

                await WGA.post('/admin/instructors/' + encodeURIComponent(id) + '/cv/reject', { reason });
                closeModal();
                showToast('CV sent back to the instructor.', 'success');
                await loadCvQueue(state.cvStatus);
            });

        function renderInstructors() {
            const instructors = adminData.users.filter((u) => u.role === 'instructor');
            const applications = adminData.pendingInstructors || [];

            // Course counts are counted from the course list already loaded, not
            // asserted. The previous version printed a `courses` field that only
            // existed in its own fixture.
            const coursesByInstructor = new Map();
            adminData.courses.forEach((course) => {
                if (!course.instructor) return;
                const id = course.instructor.id;
                coursesByInstructor.set(id, (coursesByInstructor.get(id) || 0) + 1);
            });

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">🧑‍🏫 Instructor Management</span>
                    <button class="btn-primary" onclick="openAddUserModal('instructor')">+ Add Instructor</button>
                </div>
                <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
                    <div class="stat-card glass-premium"><div class="stat-title">Total Instructors</div><div class="stat-value">${instructors.length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Active</div><div class="stat-value">${instructors.filter((i) => i.status === 'active').length}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Awaiting review</div><div class="stat-value">${applications.length}</div></div>
                </div>
                ${renderPendingApplications(applications)}
                <div class="table-container glass-premium">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Courses</th><th>Joined</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${instructors.length > 0
                                ? instructors.map((inst) => `
                                    <tr>
                                        <td>${WGAUI.escapeHtml(inst.fullName || '—')}</td>
                                        <td>${WGAUI.escapeHtml(inst.email)}</td>
                                        <td><span class="badge ${inst.status === 'active' ? 'active' : 'inactive'}">${WGAUI.escapeHtml(inst.status)}</span></td>
                                        <td>${coursesByInstructor.get(inst.id) || 0}</td>
                                        <td>${WGAUI.formatDate(inst.createdAt)}</td>
                                        <td><button class="action-btn edit" onclick="editUser('${inst.id}')"><i class="fas fa-edit"></i></button></td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-light);">No instructor accounts yet.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        /**
         * Applications a person submitted through /become-instructor.html.
         *
         * They are accounts in the database from the moment they apply, but they
         * are `pending` and cannot sign in, so this queue is the only place they
         * are visible. Everything shown here is the applicant's own claim, not a
         * verified fact — the CV is attached to the row so it can be checked
         * before the decision is made.
         */
        function renderPendingApplications(applications) {
            if (!applications.length) {
                return `
                    <div class="table-container glass-premium" style="margin-bottom:24px;">
                        <div style="padding:26px;">
                            <h3 style="font-weight:700;margin-bottom:6px;">Applications</h3>
                            <p style="font-size:14px;color:var(--text-light);margin:0;">Nothing is waiting for review. Applications sent through the “Teach on Wuteve” page appear here.</p>
                        </div>
                    </div>
                `;
            }

            const rows = applications
                .map((applicant) => {
                    const expertise = (applicant.expertise || []).slice(0, 3).join(', ');
                    const more = (applicant.expertise || []).length > 3 ? ` +${applicant.expertise.length - 3}` : '';

                    return `
                        <tr>
                            <td>
                                ${WGAUI.escapeHtml(applicant.fullName || '—')}
                                <div style="font-size:12px;color:var(--text-light);">${WGAUI.escapeHtml(applicant.email || '')}</div>
                            </td>
                            <td>${applicant.appliedAt ? WGAUI.formatDate(applicant.appliedAt) : WGAUI.formatDate(applicant.createdAt)}</td>
                            <td>${applicant.yearsExperience === null || applicant.yearsExperience === undefined ? '—' : WGAUI.escapeHtml(String(applicant.yearsExperience))}</td>
                            <td>${expertise ? WGAUI.escapeHtml(expertise + more) : '—'}</td>
                            <td>${applicant.hasCv ? '<span class="badge approved">attached</span>' : '<span class="badge inactive">none</span>'}</td>
                            <td style="white-space:nowrap;">
                                <button class="action-btn view" title="Read the application" onclick="viewApplication('${applicant.id}')"><i class="fas fa-eye"></i></button>
                                ${applicant.hasCv ? `<button class="btn-primary btn-outline btn-sm" onclick="downloadInstructorCv('${applicant.id}', this)">CV</button>` : ''}
                                <button class="btn-primary btn-sm" onclick="approveInstructor('${applicant.id}', this)">Approve</button>
                                <button class="btn-primary btn-outline btn-sm" onclick="rejectInstructor('${applicant.id}')">Reject</button>
                            </td>
                        </tr>
                    `;
                })
                .join('');

            return `
                <div class="table-container glass-premium" style="margin-bottom:24px;">
                    <div class="table-header">
                        <div class="table-toolbar">
                            <strong style="font-size:16px;">Applications awaiting review (${applications.length})</strong>
                        </div>
                    </div>
                    <p style="padding:0 20px 12px;margin:0;font-size:13px;color:var(--text-light);">
                        These applicants cannot sign in until you decide. Approving sends a welcome email; rejecting sends the reason you type.
                    </p>
                    <table class="data-table">
                        <thead><tr><th>Applicant</th><th>Applied</th><th>Years</th><th>Expertise</th><th>CV</th><th>Decision</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        /** Everything the applicant claimed, in one place, before a decision. */
        window.viewApplication = (id) => {
            const applicant = (adminData.pendingInstructors || []).find((item) => item.id === id);
            if (!applicant) return;

            const field = (label, value) =>
                `<div class="form-group"><label>${label}</label><div>${value ? WGAUI.escapeHtml(String(value)) : '—'}</div></div>`;

            openModal(
                applicant.fullName || 'Application',
                `
                    ${field('Email', applicant.email)}
                    ${field('Phone', applicant.phone)}
                    ${field('Location', applicant.location)}
                    ${field('Applied', applicant.appliedAt ? WGAUI.formatDateTime(applicant.appliedAt) : null)}
                    ${field('Years of experience', applicant.yearsExperience)}
                    ${field('Areas of expertise', (applicant.expertise || []).join(', '))}
                    ${field('Degrees, certifications and experience', applicant.credentialSummary)}
                    ${field('Qualifications', applicant.qualifications)}
                    ${applicant.videoIntroUrl ? `<div class="form-group"><label>Video introduction</label><div><a href="${WGAUI.escapeHtml(applicant.videoIntroUrl)}" target="_blank" rel="noopener noreferrer">Open link</a></div></div>` : ''}
                    <div class="form-group"><label>CV</label><div>${applicant.hasCv ? 'Attached. Use the CV button to download it.' : 'Not supplied.'}</div></div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="btn-primary" onclick="approveInstructor('${applicant.id}', this)">Approve</button>
                        <button class="btn-primary btn-outline" onclick="closeModal(); rejectInstructor('${applicant.id}')">Reject</button>
                    </div>
                `
            );
        };

        window.approveInstructor = (id, button) =>
            withBusy(button, async () => {
                await WGA.post('/admin/instructors/' + encodeURIComponent(id) + '/approve');
                closeModal();
                showToast('Instructor approved. They can sign in now.', 'success');
                await refresh();
                await loadPage('instructors');
            });

        window.rejectInstructor = (id) => {
            const applicant = (adminData.pendingInstructors || []).find((item) => item.id === id) || {};

            openModal(
                'Reject application',
                `
                    <p style="margin:0 0 14px;font-size:14px;">
                        ${WGAUI.escapeHtml(applicant.fullName || 'This applicant')} will be emailed this reason and will not be able to sign in.
                    </p>
                    <div class="form-group"><label>Reason</label><textarea id="instructorRejectReason" rows="4" maxlength="500" placeholder="What was missing, or why the application does not fit?"></textarea></div>
                    <p style="font-size:12.5px;color:var(--text-light);">At least 10 characters. Be specific — the applicant reads this.</p>
                    <button class="btn-primary" onclick="confirmRejectInstructor('${id}', this)">Reject application</button>
                `
            );
        };

        window.confirmRejectInstructor = (id, button) =>
            withBusy(button, async () => {
                const reason = (document.getElementById('instructorRejectReason')?.value || '').trim();

                if (reason.length < 10) {
                    showToast('Give a reason of at least 10 characters.', 'error');
                    return;
                }

                await WGA.post('/admin/instructors/' + encodeURIComponent(id) + '/reject', { reason });
                closeModal();
                showToast('Application rejected and the applicant has been told why.', 'success');
                await refresh();
                await loadPage('instructors');
            });

        /** The credential a certificate records; older records default to certificate. */
        function credentialLabel(value) {
            if (value === 'diploma') return 'Diploma';
            if (value === 'degree') return 'Degree';
            return 'Certificate';
        }

        /**
         * Download a certificate's PDF as an administrator.
         *
         * Same reason as the student page: the endpoint needs a bearer token, and
         * an <a> cannot send one, so the file is fetched as a blob. Admins may
         * download any certificate.
         */
        window.downloadCertificate = async function downloadCertificate(certificateId, button) {
            const target = button || null;
            const original = target ? target.innerHTML : '';

            if (target) {
                target.disabled = true;
                target.innerHTML = '<span class="spinner"></span>';
            }

            try {
                const response = await fetch(
                    WGA.API_BASE + '/certificates/' + encodeURIComponent(certificateId) + '/download',
                    { headers: { Authorization: 'Bearer ' + WGA.getAccessToken() } }
                );

                if (!response.ok) {
                    let message = 'We could not prepare that certificate.';
                    try {
                        const payload = await response.json();
                        if (payload && payload.message) message = payload.message;
                    } catch (error) {
                        // Not JSON; the default message stands.
                    }
                    throw new Error(message);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');

                link.href = url;
                link.download = 'Wuteve-Certificate.pdf';
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            } catch (error) {
                WGAUI.toast(error.message || 'We could not download that certificate.', 'error');
            } finally {
                if (target) {
                    target.disabled = false;
                    target.innerHTML = original;
                }
            }
        };

        function renderCertificates() {
            const filter = state.certStatus || '';
            const option = (value, label) =>
                `<option value="${value}"${filter === value ? ' selected' : ''}>${label}</option>`;

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">🎓 Certificate Management</span>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <select id="certStatus" onchange="loadCertificates(this.value)" style="padding:10px 14px;border-radius:10px;">
                            ${option('', 'All certificates')}
                            ${option('issued', 'Issued')}
                            ${option('pending_payment', 'Awaiting payment')}
                            ${option('revoked', 'Revoked')}
                        </select>
                        <button class="btn-primary btn-outline" onclick="exportCertificatesCsv()">Export CSV</button>
                    </div>
                </div>
                <div id="certBody">${renderCertificateBody()}</div>
                <p style="margin-top:18px;font-size:13px;color:var(--text-light);">
                    Certificates are verifiable at a public link and can be revoked here. One can be
                    reserved without being issued — a free course may charge for its certificate, and
                    until the fee is confirmed the document stays unissued and cannot be downloaded.
                </p>
            `;
        }

        function renderCertificateBody() {
            const counts = adminData.certificateCounts || { issued: 0, revoked: 0, pendingPayment: 0, total: 0 };

            const rowStatus = (c) => {
                if (c.revoked) {
                    return `<span class="badge inactive" title="${WGAUI.escapeHtml(c.revokedReason || '')}">revoked</span>`;
                }
                if (c.status === 'pending_payment') {
                    return `<span class="badge pending" title="The student has finished; the ${WGAUI.escapeHtml(c.feeLabel || 'fee')} has not been confirmed">awaiting payment</span>`;
                }
                return '<span class="badge active">valid</span>';
            };

            return `
                <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
                    <div class="stat-card glass-premium"><div class="stat-title">Currently Valid</div><div class="stat-value">${counts.issued}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Awaiting payment</div><div class="stat-value">${counts.pendingPayment || 0}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Revoked</div><div class="stat-value">${counts.revoked}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Total</div><div class="stat-value">${counts.total}</div></div>
                </div>
                <div class="table-container glass-premium">
                    <table class="data-table">
                        <thead><tr><th>Number</th><th>Credential</th><th>Student</th><th>Course</th><th>Issued</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${adminData.certificates.length > 0
                                ? adminData.certificates.map((c) => `
                                    <tr>
                                        <td>${WGAUI.escapeHtml(c.certificateNumber)}</td>
                                        <td>${WGAUI.escapeHtml(credentialLabel(c.credential))}</td>
                                        <td>${WGAUI.escapeHtml(c.studentName)}</td>
                                        <td>${WGAUI.escapeHtml(c.courseTitle)}</td>
                                        <td>${WGAUI.formatDate(c.issueDate)}</td>
                                        <td>${rowStatus(c)}</td>
                                        <td>
                                            <a class="action-btn view" href="/verify/${encodeURIComponent(c.verificationCode)}" target="_blank" rel="noopener" title="Open public verification"><i class="fas fa-eye"></i></a>
                                            ${c.status === 'pending_payment'
                                                // Downloading a reserved certificate answers 402 by design, so the
                                                // button is not offered rather than offered and refused.
                                                ? '<span style="font-size:12px;color:var(--text-light);">not issued yet</span>'
                                                : `<button class="action-btn view" title="Download PDF" onclick="downloadCertificate('${c.id}', this)"><i class="fas fa-download"></i></button>`}
                                            ${c.revoked ? '' : `<button class="action-btn delete" onclick="revokeCertificate('${c.id}', '${WGAUI.escapeHtml(c.certificateNumber)}')"><i class="fas fa-ban"></i> Revoke</button>`}
                                        </td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-light);">No certificates in this view.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.loadCertificates = async function loadCertificates(status) {
            state.certStatus = status || '';

            const body = document.getElementById('certBody');
            if (!body) return;

            body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

            try {
                const query = { limit: 50 };
                if (state.certStatus) query.status = state.certStatus;

                const data = await WGA.get('/admin/certificates', { query });
                adminData.certificates = data.items || [];
                adminData.certificateCounts = data.counts || adminData.certificateCounts;
                body.innerHTML = renderCertificateBody();
            } catch (error) {
                body.innerHTML = `<p style="padding:20px;">${WGAUI.escapeHtml(error.message || 'Could not load certificates.')}</p>`;
            }
        };

        function renderPayments() {
            const revenue = adminData.revenue || [];
            const headline = revenueHeadline(revenue);

            /**
             * The manual queue, kept above the card table rather than behind a
             * tab. These are the only rows on this screen that are waiting on a
             * person, and a transfer nobody confirms is a student who paid and
             * never got in — which is the one failure this page exists to prevent.
             */
            const manualOrders = adminData.manualOrders || [];
            const manualStats = adminData.manualStats || { counts: {}, collectedLabel: '$0.00' };
            const manualCounts = manualStats.counts || {};

            const manualBadge = (status) => {
                const map = {
                    pending: ['inactive', 'Not sent yet'],
                    awaiting_verification: ['pending', 'Payment received'],
                    paid: ['active', 'Verified'],
                    rejected: ['inactive', 'Rejected'],
                    expired: ['inactive', 'Expired']
                };
                const pair = map[status] || ['inactive', status];
