                return `<span class="badge ${pair[0]}">${WGAUI.escapeHtml(pair[1])}</span>`;
            };

            const manualTable = manualOrders.length === 0
                ? `<div class="table-container glass-premium" style="padding:26px;text-align:center;color:var(--text-light);">No manual orders. When a student chooses to pay by transfer, the order appears here for you to confirm.</div>`
                : `<div class="table-container glass-premium">
                    <table class="data-table">
                        <thead><tr><th>Order</th><th>Student</th><th>Course</th><th>For</th><th>Amount</th><th>Sent</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${manualOrders.map((order) => `
                                <tr>
                                    <td style="font-family:monospace;font-size:12px;">${WGAUI.escapeHtml(order.orderId || '—')}${
                                        order.paymentReference ? `<div style="font-size:11px;color:var(--text-light);">ref ${WGAUI.escapeHtml(order.paymentReference)}</div>` : ''
                                    }</td>
                                    <td>${WGAUI.escapeHtml(order.studentName || '—')}
                                        <div style="font-size:11px;color:var(--text-light);">${WGAUI.escapeHtml(order.studentEmail || '')}</div>${
                                        order.studentPhone ? `<div style="font-size:11px;color:var(--text-light);">${WGAUI.escapeHtml(order.studentPhone)}</div>` : ''
                                    }</td>
                                    <td>${WGAUI.escapeHtml(order.courseTitle || '—')}</td>
                                    <td>${(order.purpose || 'enrollment') === 'certificate'
                                        ? '<span class="badge approved">certificate</span>'
                                        : '<span class="badge" style="background:var(--gold);color:#0f172a;">course</span>'}</td>
                                    <td>${WGAUI.escapeHtml(order.amountLabel || '')}</td>
                                    <td>${order.markedPaidAt ? WGAUI.formatDateTime(order.markedPaidAt) : '—'}</td>
                                    <td>${manualBadge(order.status)}</td>
                                    <td style="white-space:nowrap;">${
                                        order.status === 'awaiting_verification' || order.status === 'pending'
                                            ? `<button class="action-btn" onclick="verifyManualOrder('${order.orderId}', this)"><i class="fas fa-check"></i> Mark paid</button>
                                               <button class="action-btn delete" onclick="rejectManualOrder('${order.orderId}', this)"><i class="fas fa-xmark"></i> Reject</button>`
                                            : '—'
                                    }</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">💳 Payments</span>
                    <button class="btn-primary btn-outline" onclick="refreshPage(this)">Refresh</button>
                </div>
                <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
                    <div class="stat-card glass-premium"><div class="stat-title">Revenue Collected</div><div class="stat-value" style="font-size:24px;">${WGAUI.escapeHtml(headline.value)}</div><div class="stat-change"${headline.mixed ? ' style="color:#b45309;"' : ''}>${WGAUI.escapeHtml(headline.note)}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Paid Transactions</div><div class="stat-value">${adminData.payments.length}</div><div class="stat-change">most recent first</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Awaiting Verification</div><div class="stat-value">${manualCounts.awaitingVerification || 0}</div><div class="stat-change">${manualCounts.pending || 0} not sent yet</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Collected Offline</div><div class="stat-value" style="font-size:24px;">${WGAUI.escapeHtml(manualStats.collectedLabel || '$0.00')}</div><div class="stat-change">${manualCounts.confirmed || 0} confirmed transfer${(manualCounts.confirmed || 0) === 1 ? '' : 's'}</div></div>
                </div>
                <h3 style="font-size:16px;font-weight:700;margin:26px 0 4px;">Manual transfers</h3>
                <p style="font-size:13px;color:var(--text-light);margin:0 0 14px;">Check the account, then mark the order paid. A course order enrols the student; a certificate order issues the document. Either way the student is emailed.</p>
                ${manualTable}
                <h3 style="font-size:16px;font-weight:700;margin:26px 0 4px;">Settled payments</h3>
                <p style="font-size:13px;color:var(--text-light);margin:0 0 14px;">Everything that has been paid, including transfers confirmed above. This is the ledger, not the queue.</p>
                <div class="table-container glass-premium">
                    <table class="data-table">
                        <thead><tr><th>Reference</th><th>Course</th><th>Amount</th><th>Paid</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${adminData.payments.length > 0
                                ? adminData.payments.map((p) => `
                                    <tr>
                                        <td style="font-family:monospace;font-size:12px;">${WGAUI.escapeHtml(p.id)}</td>
                                        <td>${WGAUI.escapeHtml(p.courseTitle || '—')}</td>
                                        <td>${WGAUI.escapeHtml(p.amountLabel)}</td>
                                        <td>${p.paidAt ? WGAUI.formatDateTime(p.paidAt) : '—'}</td>
                                        <td><span class="badge ${p.status === 'paid' ? 'active' : 'inactive'}">${WGAUI.escapeHtml(p.status)}</span></td>
                                        <td>${p.status === 'paid' && !p.refundedAt
                                            ? `<button class="action-btn delete" onclick="refundPayment('${p.id}')" title="Marks the payment refunded and closes the enrolment. Does not move money — issue the refund in Stripe."><i class="fas fa-rotate-left"></i> Mark refunded</button>`
                                            : '—'}</td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-light);">No payments recorded. Paid course purchases appear here.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ============================================================
        //  REVIEWS
        //
        // A review is only visible on the course page once it has been approved,
        // and only approved reviews count towards the course's rating. This page
        // is where that decision is made, so it is also the only place a pending
        // review's text can be read.
        // ============================================================

        function reviewStars(rating) {
            const filled = Math.round(Number(rating) || 0);
            let out = '';
            for (let i = 1; i <= 5; i += 1) out += `<i class="fa${i <= filled ? 's' : 'r'} fa-star" aria-hidden="true"></i>`;
            return `<span style="color:var(--gold, #c9a227);white-space:nowrap;">${out}</span>`;
        }

        function renderReviewsPage() {
            const tabs = ['pending', 'approved', 'rejected', 'all'];

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">⭐ Course reviews</span>
                </div>
                <p style="font-size:13px;color:var(--text-light);margin:0 0 16px;">
                    A review is shown on the course page, and counted in its rating, only after it is approved here.
                </p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
                    ${tabs
                        .map(
                            (tab) =>
                                `<button class="review-tab" data-status="${tab}" style="${cvTabStyle(state.reviewStatus === tab)}" onclick="loadReviewQueue('${tab}')">${tab.charAt(0).toUpperCase() + tab.slice(1)}</button>`
                        )
                        .join('')}
                </div>
                <div id="reviewBody"><div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div></div>
            `;
        }

        function renderReviewRows(items) {
            if (!items.length) {
                const empty = {
                    pending: 'No reviews are waiting. A student review appears here as soon as it is submitted.',
                    approved: 'No reviews have been published yet.',
                    rejected: 'No reviews have been sent back yet.',
                    all: 'No reviews have been written yet.'
                };

                const label = state.reviewStatus === 'all' ? 'to show' : state.reviewStatus;
                return `<div class="stat-card glass-premium"><div class="stat-title">Nothing ${WGAUI.escapeHtml(label)}</div><div style="font-size:14px;color:var(--text-light);margin-top:6px;">${WGAUI.escapeHtml(empty[state.reviewStatus] || '')}</div></div>`;
            }

            const rows = items
                .map((review) => {
                    const submitted = review.createdAt ? WGAUI.formatDate(review.createdAt) : '—';
                    const course = review.courseTitle
                        ? `<a href="/course.html?course=${encodeURIComponent(review.courseSlug || review.courseId)}" target="_blank" rel="noopener">${WGAUI.escapeHtml(review.courseTitle)}</a>`
                        : '—';

                    const note =
                        review.status === 'rejected' && review.moderationNote
                            ? `<div style="font-size:12px;color:#b91c1c;margin-top:6px;">Reason sent: ${WGAUI.escapeHtml(review.moderationNote)}</div>`
                            : '';

                    return `
                        <tr>
                            <td>${WGAUI.escapeHtml(review.author.name)}</td>
                            <td>${course}</td>
                            <td>${reviewStars(review.rating)}<div style="font-size:12px;color:var(--text-light);">${review.rating} of 5</div></td>
                            <td style="max-width:420px;">
                                ${review.title ? `<div style="font-weight:700;">${WGAUI.escapeHtml(review.title)}</div>` : ''}
                                <div style="font-size:13.5px;line-height:1.55;">${WGAUI.escapeHtml(review.body)}</div>
                                ${note}
                            </td>
                            <td style="white-space:nowrap;">${submitted}</td>
                            <td style="white-space:nowrap;">
                                ${review.status === 'approved' ? '' : `<button class="btn-primary btn-sm" onclick="approveReview('${review.id}', this)">Approve</button>`}
                                ${review.status === 'rejected' ? '' : `<button class="btn-primary btn-outline btn-sm" onclick="rejectReview('${review.id}', this)">Reject</button>`}
                                <button class="action-btn delete" onclick="deleteReview('${review.id}', this)" title="Delete this review permanently">Delete</button>
                            </td>
                        </tr>
                    `;
                })
                .join('');

            return `
                <table class="data-table">
                    <thead><tr><th>Student</th><th>Course</th><th>Rating</th><th>Review</th><th>Submitted</th><th>Actions</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        window.loadReviewQueue = async function loadReviewQueue(status) {
            state.reviewStatus = status || 'pending';

            document.querySelectorAll('.review-tab').forEach((tab) => {
                tab.style.cssText = cvTabStyle(tab.dataset.status === state.reviewStatus);
            });

            const body = document.getElementById('reviewBody');
            if (!body) return;

            body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

            try {
                const data = await WGA.get('/admin/reviews?status=' + encodeURIComponent(state.reviewStatus) + '&limit=100');
                body.innerHTML = renderReviewRows(data.items || []);
            } catch (error) {
                body.innerHTML = `<div class="stat-card glass-premium"><div class="stat-title">Could not load reviews</div><div style="font-size:14px;color:var(--text-light);margin-top:6px;">${WGAUI.escapeHtml(error.message || 'Please try again.')}</div></div>`;
            }
        };

        window.approveReview = async function approveReview(id, button) {
            if (button) button.disabled = true;

            try {
                const data = await WGA.post('/admin/reviews/' + encodeURIComponent(id) + '/approve');
                WGAUI.toast(data.message || 'Review published.', 'success');
                await loadReviewQueue(state.reviewStatus);
            } catch (error) {
                if (button) button.disabled = false;
                WGAUI.toast(error.message || 'That review could not be approved.', 'error');
            }
        };

        window.rejectReview = async function rejectReview(id, button) {
            const reason = window.prompt('Why is this review not being published? The student will see this.');

            if (reason === null) return;

            if (reason.trim().length < 10) {
                WGAUI.toast('Give a reason of at least 10 characters.', 'error');
                return;
            }

            if (button) button.disabled = true;

            try {
                const data = await WGA.post('/admin/reviews/' + encodeURIComponent(id) + '/reject', { reason: reason.trim() });
                WGAUI.toast(data.message || 'Review sent back to the student.', 'success');
                await loadReviewQueue(state.reviewStatus);
            } catch (error) {
                if (button) button.disabled = false;
                WGAUI.toast(error.message || 'That review could not be rejected.', 'error');
            }
        };

        window.deleteReview = async function deleteReview(id, button) {
            if (!window.confirm('Delete this review permanently? Its rating will be removed from the course.')) return;

            if (button) button.disabled = true;

            try {
                const data = await WGA.del('/admin/reviews/' + encodeURIComponent(id));
                WGAUI.toast(data.message || 'Review removed.', 'success');
                await loadReviewQueue(state.reviewStatus);
            } catch (error) {
                if (button) button.disabled = false;
                WGAUI.toast(error.message || 'That review could not be deleted.', 'error');
            }
        };

        // ============================================================
        //  ADMISSIONS (offline courses)
        //
        // Applications submitted from /apply.html. Approving or rejecting one
        // emails the applicant, so the two are separate buttons rather than a
        // dropdown — a decision here is final from the applicant's point of view.
        // ============================================================

        function renderAdmissionsPage() {
            const tabs = ['pending', 'approved', 'rejected', 'all'];

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">🎓 Offline admissions</span>
                    <input id="admissionSearch" type="search" placeholder="Name, email or tracking number"
                        style="padding:9px 12px;border-radius:10px;border:1px solid var(--d-line, #e3e8f0);min-width:240px;"
                        oninput="clearTimeout(window.__admissionSearchTimer);window.__admissionSearchTimer=setTimeout(()=>loadAdmissionQueue(state.admissionStatus, this.value), 350)" />
                </div>
                <p style="font-size:13px;color:var(--text-light);margin:0 0 16px;">
                    Applications for in-person classes. Approving one emails the applicant with the outcome and what happens next.
                </p>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
                    ${tabs
                        .map(
                            (tab) =>
                                `<button class="admission-tab" data-status="${tab}" style="${cvTabStyle(state.admissionStatus === tab)}" onclick="loadAdmissionQueue('${tab}')">${tab.charAt(0).toUpperCase() + tab.slice(1)}</button>`
                        )
                        .join('')}
                </div>
                <div id="admissionBody"><div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div></div>
            `;
        }

        function admissionRows(items) {
            if (!items.length) {
                return `<div class="stat-card glass-premium"><div class="stat-title">Nothing ${WGAUI.escapeHtml(state.admissionStatus)}</div><div style="font-size:14px;color:var(--text-light);margin-top:6px;">Applications submitted from the offline admission form appear here.</div></div>`;
            }

            return `
                <table class="data-table">
                    <thead><tr><th>Applicant</th><th>Class</th><th>Contact</th><th>Tracking</th><th>Files</th><th>Submitted</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${items
                            .map((item) => {
                                const files = [
                                    item.photoUrl ? `<a href="${item.photoUrl}" target="_blank" rel="noopener">Photo</a>` : '',
                                    ...(item.documents || []).map(
                                        (doc) => `<a href="${doc.url || '#'}" target="_blank" rel="noopener">${WGAUI.escapeHtml(doc.name || 'Document')}</a>`
                                    )
                                ].filter(Boolean);

                                return `
                                <tr>
                                    <td>
                                        <strong>${WGAUI.escapeHtml(item.fullName)}</strong>
                                        <div style="font-size:12px;color:var(--text-light);">${WGAUI.escapeHtml(item.gender || '')} · born ${item.dateOfBirth ? WGAUI.formatDate(item.dateOfBirth) : '—'}</div>
                                    </td>
                                    <td>${WGAUI.escapeHtml(item.classLevel)}</td>
                                    <td style="font-size:13px;">
                                        <div>${WGAUI.escapeHtml(item.email)}</div>
                                        <div style="color:var(--text-light);">${WGAUI.escapeHtml(item.mobile)}</div>
                                    </td>
                                    <td style="font-family:monospace;font-size:12px;">${WGAUI.escapeHtml(item.trackingNumber)}</td>
                                    <td style="font-size:12.5px;">${files.length ? files.join('<br />') : '—'}</td>
                                    <td style="white-space:nowrap;">${item.createdAt ? WGAUI.formatDate(item.createdAt) : '—'}</td>
                                    <td style="white-space:nowrap;">
                                        ${item.status === 'approved' ? '' : `<button class="btn-primary btn-sm" onclick="approveAdmission('${item.id}', this)">Approve</button>`}
                                        ${item.status === 'rejected' ? '' : `<button class="btn-primary btn-outline btn-sm" onclick="rejectAdmission('${item.id}', this)">Reject</button>`}
                                    </td>
                                </tr>`;
                            })
                            .join('')}
                    </tbody>
                </table>
            `;
        }

        window.loadAdmissionQueue = async function loadAdmissionQueue(status, search) {
            state.admissionStatus = status || 'pending';

            document.querySelectorAll('.admission-tab').forEach((tab) => {
                tab.style.cssText = cvTabStyle(tab.dataset.status === state.admissionStatus);
            });

            const body = document.getElementById('admissionBody');
            if (!body) return;

            body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

            try {
                const term = (search !== undefined ? search : document.getElementById('admissionSearch')?.value || '').trim();
                const query = '?status=' + encodeURIComponent(state.admissionStatus) + '&limit=100' + (term ? '&q=' + encodeURIComponent(term) : '');
                const data = await WGA.get('/admin/admissions' + query);

                body.innerHTML = admissionRows(data.items || []);

                const badge = document.getElementById('pendingAdmissionCount');
                if (badge) {
                    const pending = (data.counts && data.counts.pending) || 0;
                    badge.textContent = pending ? String(pending) : '';
                    badge.style.display = pending ? 'inline-block' : 'none';
                }
            } catch (error) {
                body.innerHTML = `<div class="stat-card glass-premium"><div class="stat-title">Could not load applications</div><div style="font-size:14px;color:var(--text-light);margin-top:6px;">${WGAUI.escapeHtml(error.message || 'Please try again.')}</div></div>`;
            }
        };

        window.approveAdmission = async function approveAdmission(id, button) {
            const note = window.prompt('Optional note for the applicant (what to bring, when to come). Leave blank to send none.');

            if (note === null) return;
            if (button) button.disabled = true;

            try {
                const data = await WGA.patch('/admin/admissions/' + encodeURIComponent(id), { decision: 'approved', note: note.trim() });
                WGAUI.toast(data.message || 'Application approved.', 'success');
                await loadAdmissionQueue(state.admissionStatus);
            } catch (error) {
                if (button) button.disabled = false;
                WGAUI.toast(error.message || 'That application could not be approved.', 'error');
            }
        };

        window.rejectAdmission = async function rejectAdmission(id, button) {
            const reason = window.prompt('Why is this application not being accepted? The applicant will see this.');

            if (reason === null) return;

            if (reason.trim().length < 10) {
                WGAUI.toast('Give a reason of at least 10 characters.', 'error');
                return;
            }

            if (button) button.disabled = true;

            try {
                const data = await WGA.patch('/admin/admissions/' + encodeURIComponent(id), { decision: 'rejected', note: reason.trim() });
                WGAUI.toast(data.message || 'Application declined.', 'success');
                await loadAdmissionQueue(state.admissionStatus);
            } catch (error) {
                if (button) button.disabled = false;
                WGAUI.toast(error.message || 'That application could not be declined.', 'error');
            }
        };

        function renderReports() {
            const enrollments = adminData.enrollments || [];
            const completed = enrollments.filter((e) => e.status === 'completed').length;
            const total = enrollments.length;

            // Derived from the enrolments actually on the platform. The previous
            // version printed "+23% year over year", "68% completion" and "42 min
            // average session" — none of which were measured, and the last of
            // which the platform cannot measure at all.
            const completionRate = total > 0 ? Math.round((completed / total) * 100) : null;

            const byCourse = new Map();
            enrollments.forEach((e) => {
                if (!e.course) return;
                const entry = byCourse.get(e.course.id) || { title: e.course.title, count: 0, completed: 0 };
                entry.count += 1;
                if (e.status === 'completed') entry.completed += 1;
                byCourse.set(e.course.id, entry);
            });

            const top = Array.from(byCourse.values()).sort((a, b) => b.count - a.count).slice(0, 10);

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">📊 Platform Report</span>
                    <button class="btn-primary btn-outline" onclick="exportEnrollmentsCsv()">Export enrolments</button>
                </div>
                <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
                    <div class="stat-card glass-premium"><div class="stat-title">Completion Rate</div><div class="stat-value">${completionRate === null ? '—' : completionRate + '%'}</div><div class="stat-change">${total > 0 ? `${completed} of ${total} enrolments finished` : 'No enrolments yet'}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Enrolments</div><div class="stat-value">${total}</div><div class="stat-change">across ${byCourse.size} course${byCourse.size === 1 ? '' : 's'}</div></div>
                    <div class="stat-card glass-premium"><div class="stat-title">Certificates</div><div class="stat-value">${(adminData.certificateCounts || {}).issued || 0}</div><div class="stat-change">currently valid</div></div>
                </div>
                <div class="table-container glass-premium">
                    <h3 style="margin-bottom:16px;">🏆 Courses by Enrolments</h3>
                    <table class="data-table">
                        <thead><tr><th>Course</th><th>Enrolments</th><th>Completed</th><th>Completion</th></tr></thead>
                        <tbody>
                            ${top.length > 0
                                ? top.map((row) => `
                                    <tr>
                                        <td>${WGAUI.escapeHtml(row.title)}</td>
                                        <td>${row.count}</td>
                                        <td>${row.completed}</td>
                                        <td>${Math.round((row.completed / row.count) * 100)}%</td>
                                    </tr>
                                `).join('')
                                : `<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text-light);">Nobody has enrolled yet.</td></tr>`}
                        </tbody>
                    </table>
                </div>
                <p style="margin-top:18px;font-size:13px;color:var(--text-light);">
                    Every figure on this page is counted from your own data. There are no
                    revenue-over-time or growth-over-time charts because the platform does not
                    record the history they would need.
                </p>
            `;
        }

        function renderAnnouncements() {
            const audiences = [
                { value: 'all', label: 'Everyone' },
                { value: 'students', label: 'All students' },
                { value: 'instructors', label: 'All instructors' }
            ];

            return `
                <div style="margin-bottom:20px;">
                    <span style="font-size:24px;font-weight:700;">📣 Send an Announcement</span>
                </div>
                <div class="glass-premium" style="padding:24px;max-width:640px;">
                    <div class="form-group"><label>Title</label><input type="text" id="annTitle" maxlength="160" placeholder="e.g. Scheduled maintenance on Sunday" /></div>
                    <div class="form-group"><label>Message</label><textarea id="annMessage" rows="4" maxlength="1000" placeholder="What do you need to tell them?"></textarea></div>
                    <div class="form-group"><label>Audience</label>
                        <select id="annAudience">${audiences.map((a) => `<option value="${a.value}">${a.label}</option>`).join('')}</select>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:8px;font-weight:500;">
                            <input type="checkbox" id="annEmail" style="width:auto;" />
                            Also send by email
                        </label>
                        <p style="font-size:12.5px;color:var(--text-light);margin:6px 0 0;">Email is queued to at most 500 people per announcement. Requires a mail provider to be configured.</p>
                    </div>
                    <button class="btn-primary" onclick="sendAnnouncement()">Send Announcement</button>

        // ============================================================
        //  PAGE LOADER
        // ============================================================
        async function loadPage(page) {
            const content = document.getElementById('main-content');
            content.innerHTML =
                '<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div></div>';

            state.currentPage = page;

            let html = '';
            switch (page) {
                case 'overview':
                    html = renderOverview();
                    break;
                case 'users':
                    html = renderUsers();
                    break;
                case 'courses':
                    html = renderCourses();
                    break;
                case 'instructors':
                    html = renderInstructors();
                    break;
                case 'instructor-cvs':
                    html = renderInstructorCvs();
                    break;
                case 'certificates':
                    html = renderCertificates();
                    break;
                case 'payments':
                    html = renderPayments();
                    break;
                case 'reviews':
                    html = renderReviewsPage();
                    break;
                case 'admissions':
                    html = renderAdmissionsPage();
                    break;
                case 'enquiries':
                    html = renderEnquiries();
                    break;
                case 'reports':
                    html = renderReports();
                    break;
                case 'announcements':
                    html = renderAnnouncements();
                    break;
                default:
                    html = renderOverview();
            }

            content.innerHTML = html;
            observeCounters();

            // The CV queue is a separate fetch: it changes as instructors upload,
            // and it is the only page whose contents are not in the summary payload.
            if (page === 'instructor-cvs') await loadCvQueue(state.cvStatus || 'pending');

            // Reviews arrive without warning, so the queue is fetched when it is
            // opened rather than counted into the summary at sign-in.
            if (page === 'reviews') await loadReviewQueue(state.reviewStatus || 'pending');

            // Admissions arrive without warning, so the queue is fetched when it is
            // opened rather than counted into the summary at sign-in.
            if (page === 'admissions') await loadAdmissionQueue(state.admissionStatus || 'pending');

            // Enquiries are fetched on demand too. They arrive without warning, so a
            // count baked into the summary payload at sign-in would be stale by the
            // time anyone looked at it.
            if (page === 'enquiries') await loadEnquiries();

            document.querySelectorAll('.sidebar-link').forEach((link) => {
                link.classList.toggle('active', link.getAttribute('data-page') === page);
            });
        }

        function filterTable(searchId, tableId) {
            const table = document.getElementById(tableId);
            if (!table) return;

            const term = (document.getElementById(searchId)?.value || '').toLowerCase();
            table.querySelectorAll('tbody tr').forEach((row) => {
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        }

        /**
         * Search and role filter together.
         *
         * Both controls used to call `filterTable` with their own id, so each one
         * only saw itself: typing a name and then picking a role silently
         * discarded the search.
         */
        function filterUsersTable() {
            const table = document.getElementById('usersTable');
            if (!table) return;

            const term = (document.getElementById('userSearch')?.value || '').toLowerCase();
            const role = document.getElementById('userRoleFilter')?.value || '';

            table.querySelectorAll('tbody tr').forEach((row) => {
                const matchesTerm = !term || (row.dataset.name || '').includes(term) || row.textContent.toLowerCase().includes(term);
                const matchesRole = !role || row.dataset.role === role;
                row.style.display = matchesTerm && matchesRole ? '' : 'none';
            });
        }

        /* ---------------------------------------------------------------- *
         * CSV export — built in the browser from data already on the page
         * ---------------------------------------------------------------- */

        function downloadCsv(filename, header, rows) {
            if (rows.length === 0) {
                showToast('There is nothing to export yet.', 'info');
                return;
            }

            const escape = (value) => `"${String(value === null || value === undefined ? '' : value).replace(/"/g, '""')}"`;
            const csv = [header, ...rows].map((row) => row.map(escape).join(',')).join('\r\n');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            showToast(`Exported ${rows.length} row${rows.length === 1 ? '' : 's'}.`, 'success');
        }

        // Every handler below used to show a success toast without calling
        // anything — "Course approved!", "User updated successfully!",
        // "Certificate verified on blockchain!". They now call the API and report

        async function withBusy(button, task) {
            const label = button ? button.textContent : '';
            try {
                if (button) { button.disabled = true; button.textContent = 'Working…'; }
                await task();
            } catch (error) {
                showToast(error.message || 'Something went wrong.', 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = label; }
            }

        window.submitChangePassword = async function submitChangePassword() {

            const currentPassword = document.getElementById('cpCurrent')?.value || '';

            try {
                const data = await WGA.post('/auth/change-password', { currentPassword, newPassword });

        window.verifyManualOrder = (orderId, button) =>

                const consequences = isCertificate

                document.getElementById('annTitle').value = '';
                document.getElementById('annMessage').value = '';
                document.getElementById('annEmail').checked = false;

                showToast(
                    `Sent to ${result.notified} ${result.notified === 1 ? 'person' : 'people'}` +
                        (result.emailQueued ? `, ${result.emailQueued} emails queued.` : '.'),
                    'success'
                );
            });

        window.openAddUserModal = (presetRole) => {
            openModal(
                'Add Account',
                `
                    <div class="form-group"><label>First name</label><input type="text" id="new-first" /></div>
                    <div class="form-group"><label>Last name</label><input type="text" id="new-last" /></div>
                    <div class="form-group"><label>Email</label><input type="email" id="new-email" /></div>
                    <div class="form-group"><label>Role</label>
                        <select id="new-role">
                            ${['student', 'instructor', 'admin'].map((r) => `<option value="${r}"${presetRole === r ? ' selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Temporary password</label><input type="password" id="new-password" /></div>
                    <p style="font-size:12.5px;color:var(--text-light);">At least 10 characters. This is the only place a role can be set — public sign-up always creates a student, and the account is marked as email-verified because you chose the password.</p>
                    <button class="btn-primary" onclick="addUser(this)">Create account</button>
                `
            );
        };

        window.addUser = (button) =>
            withBusy(button, async () => {
                await WGA.post('/admin/users', {
                    firstName: document.getElementById('new-first').value.trim(),
                    lastName: document.getElementById('new-last').value.trim(),
                    email: document.getElementById('new-email').value.trim(),
                    role: document.getElementById('new-role').value,
                    password: document.getElementById('new-password').value
                });

                closeModal();
                showToast('Account created.', 'success');
                await refresh();
                await loadPage('users');
            });

        /** Reload the summary data after a mutation, then re-render. */
        async function refresh() {
            try {
                await loadAdminData();
                updateNotifBadge();
                updatePendingInstructorBadge();
            } catch (error) {
                showToast(error.message || 'Could not refresh the data.', 'error');
            }
        }

        /**
         * How many instructor applications are waiting. Shown on the sidebar so
         * an application is not invisible until somebody happens to open the
         * Instructors page — the applicant is promised a decision in 48 hours.
         */
        function updatePendingInstructorBadge() {
            const badge = document.getElementById('pendingInstructorCount');
            if (!badge) return;

            const count = (adminData.pendingInstructors || []).length;
            badge.textContent = String(count);
            badge.style.display = count > 0 ? 'inline-block' : 'none';
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifCount');
            if (badge) badge.textContent = String(adminData.unread || 0);
            renderNotifList();
        }

        function renderNotifList() {
            const body = document.getElementById('notifBody');
            if (!body) return;

            if (!adminData.notifications || adminData.notifications.length === 0) {
                body.innerHTML =
                    '<div style="padding:26px;text-align:center;color:var(--text-light);font-size:14px;">No notifications yet.</div>';
                return;
            }

            body.innerHTML = adminData.notifications
                .map(
                    (n) => `
                    <div class="activity-item">
                        <div class="activity-icon"><i class="fas fa-bell"></i></div>
                        <div class="activity-text">
                            <strong>${WGAUI.escapeHtml(n.title)}</strong>
                            ${WGAUI.escapeHtml(n.message)}
                            <span class="time">${WGAUI.formatRelative(n.createdAt)}</span>
                        </div>
                    </div>
                `
                )
                .join('');
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function initBody() {
            if (!checkAuth()) return;

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
            });

            // Sidebar navigation
            document.querySelectorAll('.sidebar-link').forEach((link) => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadPage(link.getAttribute('data-page'));
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.remove('open');
                    }
                });
            });

            // Logout. Goes through the API so the refresh token is revoked on the
            // server; clearing localStorage alone would leave the session alive
            // for anyone holding the token.
            document.getElementById('logout-btn').addEventListener('click', () => {
                WGA.logout().finally(() => {
                    window.location.href = '/login.html?reason=signout';
                });
            });

            // Modal close
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });

            // Notification panel
            const notifModal = document.getElementById('notifModal');
            document.getElementById('notifBtn').addEventListener('click', () => {
                renderNotifList();
                notifModal.classList.add('active');
            });
            document.getElementById('close-notif').addEventListener('click', () => notifModal.classList.remove('active'));
            notifModal.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) notifModal.classList.remove('active');
            });

            // Mobile menu
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });

            // Global search jumps to the users list.
            document.getElementById('globalSearch').addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                const term = e.target.value.trim();
                if (!term) return;

                loadPage('users').then(() => {
                    const input = document.getElementById('userSearch');
                    if (input) {
                        input.value = term;
                        filterUsersTable();
                    }
                });
            });

            // Load the real data before the first paint, so no page can render a
            // placeholder figure as though it were a measurement.
            try {
                await loadAdminData();
                updateNotifBadge();
                updatePendingInstructorBadge();
                await loadPage('overview');
            } catch (error) {
                showFatal(error);
            }
        }

        /**
         * One failure path for the whole page.
         *
         * A single exception during setup used to leave the loading state on
         * screen for ever, because the only handler guarded the data load and
         * the throw happened before it. A dashboard that hangs is
         * indistinguishable from a slow network, so nobody reports it; a
         * dashboard that says what went wrong gets fixed.
         */
        function showFatal(error) {
            const message = WGAUI.escapeHtml((error && error.message) || 'Unexpected error');
            const card =
                '<div class="glass-premium" style="padding:40px;text-align:center;max-width:560px;margin:60px auto;">' +
                '<h2 style="margin-bottom:10px;">We could not load the dashboard</h2>' +
                '<p style="color:var(--text-light);margin-bottom:20px;">' + message + '</p>' +
                '<button class="btn-primary" onclick="window.location.reload()">Try again</button>' +
                '</div>';

            const main = document.getElementById('main-content');

            if (main) {
                main.innerHTML = card;
                return;
            }

            if (document.body) document.body.innerHTML = card;
        }

        async function init() {
            try {
                await initBody();
            } catch (error) {
                showFatal(error);
            }
        }

        init();
    </script>
</body>
</html>
