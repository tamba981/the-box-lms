<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Images/Brand/wuteve-emblem.png" />
    <title>Instructor Dashboard · Wuteve Global Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Self-hosted: the CSP allows jsdelivr for scripts but not for stylesheets. -->
    <link rel="stylesheet" href="/assets/vendor/quill/quill.snow.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ----- CSS Variables & Base ----- */
        :root {
            --primary: #1a56db;
            --primary-dark: #0f3b8c;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #0f3b8c 100%);
            --gold: #d4a547;
            --gold-light: #f0d080;
            --silver: #c0c0c0;
            --silver-light: #e8e8e8;
            --secondary: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f0f5ff;
            --border: #e5e7eb;
            --dark-bg: #0a1628;
            --dark-text: #e2e8f0;
            --dark-card: rgba(30, 41, 59, 0.7);
            --dark-border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --glass-primary: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-border-hover: rgba(26, 86, 219, 0.30);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --glass-shadow-hover: 0 12px 48px rgba(26, 86, 219, 0.10);
            --glass-blur: 20px;
            --shadow-glow: 0 0 30px rgba(26, 86, 219, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #1a3a6b 0%, #2a1a5e 100%);
            min-height: 100vh;
            line-height: 1.6;
            background-attachment: fixed;
            transition: background 0.3s;
        }

        body.dark-mode {
            --text-light: #94a3b8; /* #6b7280 is a light-background grey: 3.65:1 here */
            background: linear-gradient(135deg, #0a1628 0%, #1a0a3a 100%);
            color: var(--dark-text);
        }

        /* ----- Premium Glassmorphism ----- */
        .glass-premium {
            background: var(--glass-primary);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-premium:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-hover);
            box-shadow: var(--glass-shadow-hover);
        }

        body.dark-mode .glass-premium {
            background: rgba(10, 22, 40, 0.5);
            border-color: rgba(255, 255, 255, 0.04);
        }

        body.dark-mode .glass-premium:hover {
            background: rgba(10, 22, 40, 0.7);
            border-color: rgba(212, 165, 71, 0.25);
        }

        .glass-gradient {
            background: linear-gradient(135deg, rgba(26, 86, 219, 0.10), rgba(212, 165, 71, 0.06));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
        }

        /* ----- Header (frosted glass) ----- */
        .header {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }

        body.dark-mode .header {
            background: rgba(10, 22, 40, 0.70);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            max-width: 1600px;
            margin: 0 auto;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* The emblem is navy, so on the dark theme it sits on a white chip. */
        .header-left .brand-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 50%;
            background: #fff;
            padding: 3px;
            object-fit: contain;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .logo span {
            font-weight: 400;
            font-size: 14px;
            background: linear-gradient(135deg, var(--silver), var(--silver-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .instructor-badge {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }

        .header-search {
            flex: 1;
            max-width: 380px;
            min-width: 140px;
            position: relative;
        }
        .header-search input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            font-size: 14px;
            transition: 0.3s;
        }
        body.dark-mode .header-search input {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }
        .header-search input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 71, 0.10);
        }
        .header-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text);
            position: relative;
        }
        body.dark-mode .btn-icon {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            color: var(--dark-text);
        }
        .btn-icon:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        body.dark-mode .notification-badge {
            border-color: var(--dark-bg);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.20);
        }

        .logout-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        body.dark-mode .logout-btn {
            color: var(--dark-text);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .logout-btn:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        /* ----- Sidebar (glass) ----- */
        .sidebar {
            width: 270px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 16px;
            position: fixed;
            height: calc(100vh - 66px);
            overflow-y: auto;
            transition: all 0.3s;
            z-index: 50;
        }

        body.dark-mode .sidebar {
            background: rgba(10, 22, 40, 0.60);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text);
            text-decoration: none;
            border-radius: 16px;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 14px;
        }
        body.dark-mode .sidebar-link {
            color: var(--dark-text);
        }

        .sidebar-link:hover {
            background: rgba(26, 86, 219, 0.06);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.25);
            transform: translateX(6px);
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        body.dark-mode .sidebar-footer {
            border-top-color: rgba(255, 255, 255, 0.03);
        }
        .sidebar-footer .sidebar-link {
            font-size: 13px;
        }

        /* ----- Main Content ----- */
        .main-content {
            flex: 1;
            margin-left: 270px;
            padding: 28px 32px 40px;
            transition: margin 0.3s;
        }

        /* ----- Stats Cards (with counter) ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            padding: 22px 20px;
            cursor: default;
        }

        .stat-title {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .stat-change {
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-change.up {
            color: var(--success);
        }
        .stat-change.down {
            color: var(--danger);
        }

        /* ----- Section Title ----- */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title span {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ----- Courses Grid ----- */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            margin-bottom: 40px;
        }

        .course-card {
            overflow: hidden;
            transition: all 0.3s;
            cursor: default;
        }

        .course-image {
            height: 150px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 20px 20px 0 0;
        }

        .course-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }
        .course-badge.published {
            background: rgba(16, 185, 129, 0.85);
            color: white;
        }
        .course-badge.draft {
            background: rgba(245, 158, 11, 0.85);
            color: white;
        }
        .course-badge.pending {
            background: rgba(239, 68, 68, 0.85);
            color: white;
        }

        .course-content {
            padding: 20px 22px 22px;
        }

        .course-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .course-meta {
            font-size: 13px;
            color: var(--text-light);
            margin: 6px 0 12px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--gold), #b8942e);
            color: #0f172a;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212, 165, 71, 0.30);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            color: var(--text);
        }
        body.dark-mode .btn-outline {
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #0f172a;
            border-color: var(--gold);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 12px;
        }

        /* ----- Tables (glass) ----- */
        .table-container {
            padding: 0 0 0;
            overflow-x: auto;
            margin-bottom: 24px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px 12px;
        }

        .table-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .table-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-toolbar input,
        .table-toolbar select {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-size: 13px;
        }
        body.dark-mode .table-toolbar input,
        body.dark-mode .table-toolbar select {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        body.dark-mode .data-table th,
        body.dark-mode .data-table td {
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }

        .data-table th {
            font-weight: 600;
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .data-table tr:hover td {
            background: rgba(26, 86, 219, 0.02);
        }

        .badge {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge.active {
            background: var(--success);
            color: white;
        }
        .badge.pending {
            background: var(--warning);
            color: white;
        }
        .badge.completed {
            background: var(--success);
            color: white;
        }
        .badge.in-progress {
            background: var(--info);
            color: white;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: none;
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            margin: 0 2px;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn.edit {
            color: var(--primary);
        }
        .action-btn.delete {
            color: var(--danger);
        }
        .action-btn.view {
            color: var(--success);
        }
        .action-btn.message {
            color: var(--info);
        }

        /* ----- Chart Cards ----- */
        .chart-card {
            padding: 24px 22px;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        canvas {
            max-height: 260px;
            width: 100% !important;
        }

        /* ----- Empty State ----- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .empty-state i {
            font-size: 56px;
            color: var(--gold);
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        /* ----- Modal (glass) ----- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 28px;
            max-width: 680px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        body.dark-mode .modal-content {
            background: rgba(10, 22, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.03);
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }
        body.dark-mode .form-group input,
        body.dark-mode .form-group select,
        body.dark-mode .form-group textarea {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.04);
            color: var(--dark-text);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 71, 0.08);
        }

        /* ----- Notifications Panel ----- */
        .notifications-panel {
            position: fixed;
            top: 66px;
            right: -420px;
            width: 400px;
            height: calc(100vh - 66px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 200;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        body.dark-mode .notifications-panel {
            background: rgba(10, 22, 40, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.02);
        }
        .notifications-panel.open {
            right: 0;
        }

        .panel-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            position: sticky;
            top: 0;
            background: inherit;
            backdrop-filter: inherit;
            z-index: 2;
        }

        .notification-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            cursor: default;
            transition: 0.2s;
        }
        .notification-item:hover {
            background: rgba(26, 86, 219, 0.03);
        }
        .notification-item.unread {
            border-left: 3px solid var(--gold);
        }

        /* ----- Loading ----- */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 165, 71, 0.10);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;

    <script>
        // ============================================================
        //  DATA LAYER
        // ============================================================
        // Everything below is filled in by loadInstructorData() from the API.
        //
        // The views were written against a single `instructorData` object, which
        // makes this straightforward: populate that object and every view becomes
        // real without rewriting any of them.
        //
        // Removed along with the fixtures that used to sit here: assignments and
        // quizzes. Neither exists in the API — there is no assignment model, no
        // submission, no grading and no quiz engine — so those pages displayed
        // fabricated submission counts and average scores for work that could not
        // be set. They are gone rather than left looking functional.

        let instructorData = {
            user: {},
            stats: {
                totalStudents: 0,
                totalCourses: 0,
                publishedCourses: 0,
                totalRevenue: 0,
                monthlyRevenue: 0,
                averageRating: 0,
                completionRate: null
            },
            revenue: { totalCents: 0, totalLabel: '—', monthlyCents: 0, monthlyLabel: '—', payments: 0, monthlyPayments: 0 },
            courses: [],
            studentCourses: [],
            students: [],
            liveClasses: [],
            recordings: [],
            messages: [],
            notifications: [],
            unread: { notifications: 0, messages: 0 }
        };

        let state = {
            currentPage: 'overview',
            coursePage: 1,
            charts: {}
        };

        /** A gradient placeholder instead of a broken image when there is no thumbnail. */
        function courseImageStyle(course) {
            return course && course.thumbnail
                ? `background-image:url('${course.thumbnail}')`
                : 'background-image:linear-gradient(135deg,#1a3a6b 0%,#2a1a5e 100%)';
        }

        /**
         * One shape for a course, whichever endpoint it came from.
         *
         * `/dashboard/instructor` returns a 12-row preview and `/courses/mine`
         * returns a page of the full list. The two carry the live enrolment count
         * under different names — `enrollmentCount` on the paginated one — so this
         * is the single place that difference is handled.
         *
         * `certificateFeeCents` must survive this mapping: the Edit dialog reads
         * it to preselect the fee, and saving sends back whatever is selected. It
         * was missing here, so every edit silently reset the fee to "None" —
         * twenty live courses had a fee at the time.
         */
        function toInstructorCourse(course) {
            const students = course.enrollmentCount !== undefined && course.enrollmentCount !== null
                ? course.enrollmentCount
                : (course.enrolledCount || 0);

            return {
                id: String(course.id),
                slug: course.slug,
                title: course.title,
                description: course.summary || '',
                thumbnail: course.thumbnail || '',
                students,
                status: course.status,
                price: (course.priceCents || 0) / 100,
                priceLabel: course.priceLabel,
                isFree: course.isFree,
                certificateFeeCents: course.certificateFeeCents || 0,
                rating: course.rating || 0,
                lessonCount: course.lessonCount || 0,
                createdAt: course.publishedAt || null
            };
        }

        /**
         * Every course the instructor can manage, by id.
         *
         * The overview payload only carries twelve courses, and My Courses loads
         * the full list separately. Edit used to search only the overview's twelve
         * and return silently for anything else, so 35 of 47 courses could not be
         * edited at all. This holds whichever list was loaded last, and edits fall
         * back to fetching a course the page has never seen.
         */
        const courseCache = new Map();

        function rememberCourses(courses) {
            courses.forEach((course) => courseCache.set(String(course.id), course));
        }

        async function resolveCourse(id) {
            const key = String(id);
            if (courseCache.has(key)) return courseCache.get(key);

            const data = await WGA.get('/courses/' + encodeURIComponent(key));
            const course = toInstructorCourse(data.course || data);
            courseCache.set(key, course);
            return course;
        }

        /**
         * Load everything the instructor views need, in parallel.
         *
         * One request answers the overview; the rest fill in the pages that need
         * a full list rather than a summary.
         */
        async function loadInstructorData() {
            const [dashboard, students, sessions, past, threads, notifications, taxonomy, mine] = await Promise.all([
                WGA.get('/dashboard/instructor'),
                WGA.get('/dashboard/instructor/students', { query: { limit: 100 } }),
                WGA.get('/live-sessions', { query: { scope: 'all', limit: 50 } }),
                WGA.get('/live-sessions', { query: { scope: 'past', limit: 20 } }),
                WGA.get('/messages/threads', { query: { limit: 50 } }),
                WGA.get('/notifications', { query: { limit: 20 } }),
                // The categories and credentials the API will accept. Read rather
                // than hard-coded: the form used to offer three options and could
                // not name the two categories four courses were already using.
                WGA.get('/courses/taxonomy'),
                // The dashboard payload carries only the twelve most recent
                // courses. Every picker and dialog needs the whole list, so it is
                // fetched once here rather than per control.
                WGA.get('/courses/mine', { query: { limit: 100 } })
            ]);

            instructorData.taxonomy = taxonomy || { categories: [], credentials: [] };

            const stats = dashboard.stats || {};
            const revenue = dashboard.revenue || {};

            instructorData.user = dashboard.user || WGA.getUser() || {};

            instructorData.stats = {
                totalStudents: stats.students || 0,
                totalCourses: stats.courses || 0,
                publishedCourses: stats.published || 0,
                drafts: stats.drafts || 0,
                pending: stats.pending || 0,
                // The API sums money in integer cents; this is the only place it
                // becomes a decimal, and only for display arithmetic.
                totalRevenue: (revenue.totalCents || 0) / 100,
                monthlyRevenue: (revenue.monthlyCents || 0) / 100,
                averageRating: stats.averageRating || 0,
                ratingCount: stats.ratingCount || 0,
                // null, not 0, when there are no students: 0% would read as
                // "nobody finishes this course", which is a different claim.
                completionRate: stats.completionRate === null || stats.completionRate === undefined
                    ? null
                    : stats.completionRate,
                averageProgress: stats.averageProgress || 0
            };

            instructorData.revenue = revenue;

            instructorData.courses = (dashboard.courses || []).map(toInstructorCourse);
            rememberCourses(instructorData.courses);

            // Every non-archived course this instructor owns, for the pickers and
            // for Edit. Falls back to the preview if the list could not be read.
            instructorData.allCourses = (mine && mine.items ? mine.items : []).map(toInstructorCourse);
            if (instructorData.allCourses.length) rememberCourses(instructorData.allCourses);
            else instructorData.allCourses = instructorData.courses;

            instructorData.students = (students.items || []).map((student) => ({
                id: student.id,
                // `id` is the enrolment, `studentId` the account. They are not
                // interchangeable: messaging is addressed to a user, so passing
                // the enrolment id asked the API for a person who does not exist
                // and came back with "that student could not be found". The
                // compose picker had the same gap and silently listed nobody.
                studentId: student.studentId,
                name: student.name,
                email: student.email,
                avatarUrl: student.avatarUrl,
                courseId: student.courseId,
                courseTitle: student.courseTitle,
                progress: student.progress,
                status: student.status,
                enrolledAt: student.enrolledAt,
                lastActive: student.lastActive
            }));

            instructorData.studentCourses = students.courses || [];

            instructorData.liveClasses = (sessions.items || []).map((session) => ({
                id: String(session.id),
                courseId: String(session.courseId || ''),
                courseTitle: session.courseTitle || '',
                title: session.title,
                date: session.startTime,
                endTime: session.endTime,
                attendees: session.attendeeCount || 0,
                status: session.status,
                meetingLink: session.meetingLink || null,
                recording: session.recordingUrl || null
            }));

            instructorData.recordings = (past.items || []).filter((session) => session.recordingUrl);

            instructorData.messages = (threads.items || []).map((thread) => ({
                id: String(thread.id),
                from: thread.displayName || thread.title || 'Conversation',
                message: thread.lastMessagePreview || 'No messages yet',
                date: thread.lastMessageAt,
                read: !(thread.unreadCount > 0)
            }));

            instructorData.notifications = (notifications.items || []).map((notification) => ({
                id: String(notification.id),
                title: notification.title,
                message: notification.message,
                createdAt: notification.createdAt,
                read: Boolean(notification.read)
            }));

            instructorData.unread = {
                notifications: notifications.unreadCount || 0,
                messages: threads.unreadTotal || 0
            };
        }

        // ============================================================
        //  AUTH (preserved)
        // ============================================================
        /** Open a course's public page. */
        function openCourse(idOrSlug) {
            if (!idOrSlug) return;
            window.location.href = '/course.html?course=' + encodeURIComponent(idOrSlug);
        }

        /**
         * The header avatar: the uploaded photo when there is one, initials
         * otherwise. Clicking it is how a photo is set, because an instructor
         * with twenty students in front of them should not have to go looking
         * for a settings page to look like themselves.
         */
        async function renderHeaderAvatar() {
            const avatarEl = document.getElementById('userAvatar');
            if (!avatarEl) return;

            /**
             * Prefer the loaded profile to whatever is in localStorage.
             *
             * `checkAuth` runs before the dashboard data arrives, and
             * `instructorData.user` starts as an empty object — which is truthy,
             * so it used to win over the stored user and the initials helper
             * rendered its "?" placeholder. The header then kept that question
             * mark for the whole session.
             */
            const loaded = (typeof instructorData !== 'undefined' && instructorData.user) || null;
            const stored = WGA.getUser() || null;
            const user = (loaded && loaded.firstName ? loaded : stored || loaded || {});
            avatarEl.innerHTML = WGAUI.avatar(user, 40);
            avatarEl.style.cursor = 'pointer';
            avatarEl.title = 'Change your photo';
            avatarEl.setAttribute('role', 'button');
            avatarEl.setAttribute('tabindex', '0');
            avatarEl.setAttribute('aria-label', 'Change your photo');

            const changePhoto = async (event) => {
                if (event) event.preventDefault();

                const dataUrl = await WGAUI.pickAvatar({ size: 256 });
                if (!dataUrl) return;

                try {
                    const result = await WGA.put('/auth/me/avatar', { image: dataUrl });
                    if (typeof instructorData !== 'undefined') {
                        instructorData.user = Object.assign({}, instructorData.user, result.user);
                    }
                    renderHeaderAvatar();
                    WGAUI.toast('Your photo has been updated.', 'success');
                } catch (error) {
                    const details = Array.isArray(error.details) ? error.details : [];
                    WGAUI.toast(
                        (details[0] && details[0].message) || error.message || 'We could not save that photo.',
                        'error'
                    );
                }
            };

            avatarEl.onclick = changePhoto;
            avatarEl.onkeydown = (event) => {
                if (event.key === 'Enter' || event.key === ' ') changePhoto(event);
            };
        }

         * The session and the role are verified by /assets/js/wga-guard.js before

         * version read the role out of localStorage, which the visitor controls.
         */
        function checkAuth() {

        /**
         * Count up to a figure.
         *
         * Two guards, both learned the hard way. Reading the DOM while a counter
         * was still animating showed "3 published courses" next to four published
         * courses — the easing meant the number on screen was simply wrong for
         * two seconds, which is the same failure as printing a made-up figure.
         *
         * So: small counts are set immediately rather than counted up to (there
         * is nothing to reveal about a four-course total), and a timer backstop
         * pins the final value in case the browser throttles animation frames in
         * a background tab and the last frame never arrives.
         */
        function animateCounter(el, target, duration = 2000) {
            const value = Number.isFinite(target) ? target : 0;

            function finish() {
                el.textContent = value.toLocaleString();
            }

            if (value < 10) {
                finish();
                return;
            }

            const startTime = performance.now();
            let done = false;

            function update(now) {
                if (done) return;

                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                el.textContent = Math.round(eased * value).toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    done = true;
                }
            }

            requestAnimationFrame(update);

            setTimeout(() => {
                if (done) return;
                done = true;
                finish();
            }, duration + 400);
        }

        function observeCounters() {
            const counters = document.querySelectorAll('.stat-value[data-target]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = parseInt(entry.target.dataset.target, 10);
                        animateCounter(entry.target, target);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.3 });
            counters.forEach(el => observer.observe(el));
        }

         * heading used to read "My Courses (12)" for an instructor with 47. The
         * list is therefore fetched from /courses/mine, which paginates on the
         * server, and the heading counts what the server says exists.
         */
        window.loadMyCourses = async function loadMyCourses(page) {
            state.coursePage = Math.max(1, Number(page) || 1);

            const body = document.getElementById('myCoursesBody');
            if (!body) return;

            body.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

            try {
                const data = await WGA.get('/courses/mine', {
                    query: { page: state.coursePage, limit: 100 }
                });

                const courses = (data.items || []).map(toInstructorCourse);
                rememberCourses(courses);
                const paging = data.pagination || { page: 1, limit: 100, total: courses.length, totalPages: 1, hasNextPage: false, hasPrevPage: false };

                const title = document.getElementById('myCoursesTitle');
                if (title) title.textContent = `📚 My Courses (${paging.total})`;

                if (!courses.length) {
                    body.innerHTML = `
                        <div class="empty-state"><i class="fas fa-book"></i><h3>No courses yet</h3><p>Your courses appear here once you create one</p><button class="btn-primary" onclick="loadPage('create-course')">Create a Course</button></div>

                    return;

                const start = (paging.page - 1) * paging.limit + 1;
                const end = start + courses.length - 1;

                const pager = `
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;">

                `;

                body.innerHTML = `

                    ${pager}

                body.innerHTML = `

                        <h3>We could not load your courses</h3>
                        <p>${WGAUI.escapeHtml(error.message || 'Please try again.')}</p>

        function courseOptions(selectedId) {

        /**

        function categoryOptions() {
            const list = (instructorData.taxonomy && instructorData.taxonomy.categories) || [];
            if (!list.length) return '<option value="">Categories unavailable — reload the page</option>';

            return list
                .map((category) => `<option value="${WGAUI.escapeHtml(category.slug)}">${WGAUI.escapeHtml(category.label)}</option>`)

        function credentialOptions() {
            const list = (instructorData.taxonomy && instructorData.taxonomy.credentials) || [];
            if (!list.length) return '<option value="certificate">Certificate of Completion</option>';

        /**
         * The certificate fees an instructor may choose.
         *
         * The same six amounts the API accepts, written here as dollars because
         * that is what the instructor is thinking in. The server stores cents.
         */
        const CERTIFICATE_FEES_CENTS = [0, 1000, 2000, 3000, 4000, 5000];

        function certificateFeeOptions(selectedCents) {
            const selected = Number(selectedCents) || 0;

            return CERTIFICATE_FEES_CENTS.map((cents) => {
                const label = cents === 0 ? 'None — the certificate is included' : `$${cents / 100}`;
                return `<option value="${cents}"${cents === selected ? ' selected' : ''}>${label}</option>`;

        /**

        function syncCertificateFeeVisibility(priceInputId, groupId) {
            const group = document.getElementById(groupId);
            if (!group) return;

            const price = Number(document.getElementById(priceInputId)?.value || 0);
            group.style.display = price > 0 ? 'none' : '';
        }

        window.syncCertificateFeeField = () =>

        /* ------------------------------------------------------------------ *
         * Course cover images
         *
         * Uploaded, not linked. Asking an instructor to find hosting for a picture
         * and paste in a URL is the step where most of them stop, and the course is
         * left showing a placeholder.
         * ------------------------------------------------------------------ */

        /**
         * Shrink a chosen image in the browser before uploading it.
         *
         * A photo straight off a phone is several megabytes and the API refuses
         * anything over 600 KB. Downscaling here means an instructor can pick any
         * picture they already have, rather than being told to go and resize it
         * first. A cover is never displayed larger than a card, so 1280x720 is ample.
         */
        function prepareCoverImage(file) {
            return new Promise((resolve, reject) => {
                if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type || '')) {
                    reject(new Error('Choose a PNG, JPEG or WebP image.'));
                    return;
                }

                const reader = new FileReader();

                reader.onerror = () => reject(new Error('That file could not be read.'));

                reader.onload = () => {
                    const image = new Image();

                    image.onerror = () => reject(new Error('That file is not an image we can display.'));

                    image.onload = () => {
                        const scale = Math.min(1, 1280 / image.width, 720 / image.height);
                        const width = Math.max(1, Math.round(image.width * scale));
                        const height = Math.max(1, Math.round(image.height * scale));

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(image, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };

                    image.src = reader.result;
                };

                reader.readAsDataURL(file);
            });
        }

        /** Show the chosen file at once, so the instructor sees what they picked. */
        window.previewCourseCover = async function previewCourseCover(input) {
            const box = document.getElementById(input.dataset.preview || 'courseThumbPreview');
            const file = input.files && input.files[0];

            if (!box) return;

            if (!file) {
                box.innerHTML = '';
                box.dataset.prepared = '';
                return;
            }

            try {
                const dataUrl = await prepareCoverImage(file);
                box.dataset.prepared = dataUrl;
                box.innerHTML =
                    '<img src="' + dataUrl + '" alt="" style="width:100%;max-width:340px;border-radius:12px;border:1px solid var(--border);display:block;" />';
            } catch (error) {
                input.value = '';
                box.dataset.prepared = '';
                box.innerHTML = '';
                showToast(error.message, 'error');
            }
        };

        /**
         * The API reports a rejected image as a field message inside `details`, plus
         * a generic sentence at the top level. Showing the generic one would tell an
         * instructor "The submitted data is invalid" and nothing about what to fix.
         */
        function coverErrorMessage(error) {
            const detail = error && error.details && error.details[0];
            return (detail && detail.message) || (error && error.message) || 'We could not save that cover image.';
        }

        /** Returns true when the cover was stored, so callers can report honestly. */

         * "Edit" on a different lesson the old markup is still in the DOM for a

        let lessonFormOwner = null;

        function lessonTypeLabel(type) {

        function redrawLessonModal() {
