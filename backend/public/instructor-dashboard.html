        window.manageLessons = async function manageLessons(courseId) {
            const course = courseCache.get(String(courseId))
                || instructorData.courses.find((c) => String(c.id) === String(courseId));
            lessonState.courseId = courseId;
            lessonState.title = 'Lessons' + (course ? ' · ' + WGAUI.escapeHtml(course.title) : '');
            lessonState.editing = null;

            openModal(lessonState.title, '<div class="wga-skeleton" style="height:140px;"></div>');

            try {
                // Whether uploads are possible has to be known before the form is
                // built, so an instructor is never offered a control that cannot work.
                const [lessons, storage] = await Promise.all([
                    WGA.get('/courses/' + encodeURIComponent(courseId) + '/lessons'),
                    WGA.get('/courses/storage').catch(() => ({ enabled: false, missing: [] }))
                ]);
                lessonState.items = lessons.lessons || lessons.items || [];
                lessonState.storage = storage;
                refreshLessonModal();
            } catch (error) {
                openModal(lessonState.title, '<p>' + WGAUI.escapeHtml(error.message || 'Could not load the syllabus.') + '</p>');
            }
        };

        /* ---- Quiz editor ------------------------------------------- *
         *
         * One quiz per lesson. The editor redraws the whole modal on every change,
         * and the lesson fields live in that same modal — so each action reads the
         * form back into state first, or adding a question would silently discard
         * whatever the instructor had just typed into the lesson title.
         * ------------------------------------------------------------ */

        const quizState = { lessonId: null, exists: false, title: 'Quiz', passPercent: 70, maxAttempts: 0, questions: [] };

        async function resetQuizState(lessonId) {
            quizState.lessonId = lessonId;
            quizState.exists = false;
            quizState.title = 'Quiz';
            quizState.passPercent = 70;
            quizState.maxAttempts = 0;
            quizState.questions = [];

            if (!lessonId) return;

            try {
                const data = await WGA.get('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(lessonId) + '/quiz');
                if (!data.quiz) return;

                quizState.exists = true;
                quizState.title = data.quiz.title || 'Quiz';
                quizState.passPercent = data.quiz.passPercent;
                quizState.maxAttempts = data.quiz.maxAttempts;
                quizState.questions = (data.quiz.questions || []).map((question) => ({
                    prompt: question.prompt,
                    kind: question.kind || 'single',
                    explanation: question.explanation || '',
                    points: question.points || 1,
                    options: (question.options || []).map((option) => ({ text: option.text, isCorrect: Boolean(option.isCorrect) }))
                }));
            } catch (error) {
                /* No quiz yet is the ordinary case, not a failure. */
            }
        }

        function quizQuestionEditor(question, index) {
            const options = (question.options || [])
                .map((option, optionIndex) => `
                    <div class="quiz-opt-row">
                        <input type="radio" name="correct-${index}" ${option.isCorrect ? 'checked' : ''} onchange="quizMarkCorrect(${index},${optionIndex})" title="Mark as the correct answer" />
                        <input type="text" class="quiz-opt-text" value="${WGAUI.escapeHtml(option.text || '')}" placeholder="Option ${optionIndex + 1}" />
                        <button class="btn-primary btn-outline btn-sm" onclick="quizRemoveOption(${index},${optionIndex})" title="Remove this option">&times;</button>
                    </div>
                `)
                .join('');

            return `
                <div class="quiz-q-editor">
                    <div class="quiz-q-editor-head">
                        <strong>Question ${index + 1}</strong>
                        <button class="btn-primary btn-outline btn-sm" onclick="quizRemoveQuestion(${index})">Remove</button>
                    </div>
                    <div class="form-group"><label>Question</label><input type="text" class="quiz-prompt" value="${WGAUI.escapeHtml(question.prompt || '')}" placeholder="What should the student know?" /></div>
                    ${options}
                    <button class="btn-primary btn-outline btn-sm" onclick="quizAddOption(${index})">+ Option</button>
                    <div class="form-group" style="margin-top:10px;"><label>Explanation (shown after submitting)</label><input type="text" class="quiz-explanation" value="${WGAUI.escapeHtml(question.explanation || '')}" placeholder="Why that answer is right" /></div>
                </div>
            `;
        }

        function quizEditorHTML() {
            const questions = quizState.questions.map((question, index) => quizQuestionEditor(question, index)).join('');

            return `
                <div class="lesson-form">
                    <h4>Quiz</h4>
                    <div style="display:flex;gap:14px;flex-wrap:wrap;">
                        <div class="form-group" style="flex:1 1 140px;"><label>Pass mark (%)</label><input type="number" id="quizPass" min="0" max="100" value="${quizState.passPercent}" /></div>
                        <div class="form-group" style="flex:1 1 170px;"><label>Attempts allowed (0 = unlimited)</label><input type="number" id="quizAttempts" min="0" max="100" value="${quizState.maxAttempts}" /></div>
                    </div>
                    ${questions || '<p class="lesson-hint">No questions yet. A lesson without a quiz simply has none.</p>'}
                    <button class="btn-primary btn-outline btn-sm" onclick="quizAddQuestion()">+ Add question</button>
                    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="btn-primary btn-sm" id="quizSaveBtn" onclick="quizSave()">${quizState.exists ? 'Save quiz' : 'Create quiz'}</button>
                        ${quizState.exists ? '<button class="btn-primary btn-outline btn-sm" onclick="quizRemove()">Remove quiz</button>' : ''}
                    </div>
                    <p class="lesson-hint">
                        Every question needs exactly one correct answer. Students see the questions but never the
                        answers, and marking happens on the server.
                    </p>
                </div>
            `;
        }

        /** Read the lesson form back into state, so a redraw cannot lose it. */
        function captureLessonForm() {
            const editing = lessonState.editing;
            if (!editing) return;
            if (lessonFormOwner !== editing) return;

            const val = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
            const on = (id) => { const el = document.getElementById(id); return el ? el.checked : undefined; };

            if (val('lessonTitle') !== undefined) editing.title = val('lessonTitle');
            if (val('lessonSummary') !== undefined) editing.summary = val('lessonSummary');
            if (val('lessonType') !== undefined) editing.type = val('lessonType');
            if (val('lessonContent') !== undefined) editing.content = val('lessonContent');
            if (val('lessonDuration') !== undefined) editing.durationMinutes = Number(val('lessonDuration') || 0);
            if (on('lessonPreview') !== undefined) editing.isPreview = on('lessonPreview');
            if (val('lessonVideoUrl') !== undefined) editing.videoUrl = val('lessonVideoUrl');

            // Materials are a list of rows now, so they are read as a list.
            const rows = [...document.querySelectorAll('#lessonMaterials .material-row')];
            if (rows.length) {
                editing.materials = rows.map((row) => ({
                    title: row.querySelector('.material-title')?.value.trim() || '',
                    url: row.querySelector('.material-url')?.value.trim() || ''
                }));
            }

            const mode = document.querySelector('input[name="lessonVideoMode"]:checked');
            if (mode) editing.videoMode = mode.value;
        }

        function captureQuizForm() {
            const pass = document.getElementById('quizPass');
            const attempts = document.getElementById('quizAttempts');
            if (pass) quizState.passPercent = Number(pass.value || 0);
            if (attempts) quizState.maxAttempts = Number(attempts.value || 0);

            document.querySelectorAll('.quiz-q-editor').forEach((editor, index) => {
                const question = quizState.questions[index];
                if (!question) return;

                const prompt = editor.querySelector('.quiz-prompt');
                const explanation = editor.querySelector('.quiz-explanation');
                if (prompt) question.prompt = prompt.value;
                if (explanation) question.explanation = explanation.value;

                editor.querySelectorAll('.quiz-opt-row').forEach((row, optionIndex) => {
                    const option = question.options[optionIndex];
                    const text = row.querySelector('.quiz-opt-text');
                    if (option && text) option.text = text.value;
                });
            });
        }

        /** Capture, mutate, redraw — the order every quiz action uses. */
        function editQuiz(mutate) {
            captureLessonForm();
            captureQuizForm();
            mutate();
            refreshLessonModal();
        }

        window.quizAddQuestion = function quizAddQuestion() {
            editQuiz(() => {
                quizState.questions.push({
                    prompt: '', kind: 'single', explanation: '', points: 1,
                    options: [{ text: '', isCorrect: true }, { text: '', isCorrect: false }]
                });
            });
        };

        window.quizRemoveQuestion = function quizRemoveQuestion(index) {
            editQuiz(() => { quizState.questions.splice(index, 1); });
        };

        window.quizAddOption = function quizAddOption(index) {
            editQuiz(() => {
                const question = quizState.questions[index];
                if (question && question.options.length < 10) question.options.push({ text: '', isCorrect: false });
            });
        };

        window.quizRemoveOption = function quizRemoveOption(index, optionIndex) {
            editQuiz(() => {
                const question = quizState.questions[index];
                if (!question || question.options.length <= 2) return;

                const wasCorrect = question.options[optionIndex].isCorrect;
                question.options.splice(optionIndex, 1);
                // Never leave a question with no right answer; the API refuses it.
                if (wasCorrect && question.options.length) question.options[0].isCorrect = true;
            });
        };

        /** One correct answer per question, so the radios behave as a group. */
        window.quizMarkCorrect = function quizMarkCorrect(index, optionIndex) {
            editQuiz(() => {
                const question = quizState.questions[index];
                if (!question) return;
                question.options.forEach((option, i) => { option.isCorrect = i === optionIndex; });
            });
        };

        window.quizSave = async function quizSave() {
            captureLessonForm();
            captureQuizForm();

            const lessonId = quizState.lessonId || (lessonState.editing && lessonState.editing.id);
            if (!lessonId) { showToast('Save the lesson first, then add its quiz.', 'error'); return; }

            const questions = quizState.questions.filter((question) => (question.prompt || '').trim().length >= 2);
            if (!questions.length) { showToast('Write at least one question.', 'error'); return; }

            if (questions.some((question) => question.options.some((option) => !(option.text || '').trim()))) {
                showToast('Every option needs text.', 'error');
                return;
            }

            if (!questions.every((question) => question.options.some((option) => option.isCorrect))) {
                showToast('Mark the correct answer on every question.', 'error');
                return;
            }

            const button = document.getElementById('quizSaveBtn');
            WGAUI.setBusy(button, true, 'Saving…');

            try {
                const saved = await WGA.put('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(lessonId) + '/quiz', {
                    title: quizState.title || 'Quiz',
                    passPercent: quizState.passPercent,
                    maxAttempts: quizState.maxAttempts,
                    questions: questions.map((question) => ({
                        prompt: question.prompt.trim(),
                        kind: question.kind || 'single',
                        explanation: question.explanation || '',
                        points: question.points || 1,
                        options: question.options.map((option) => ({ text: option.text.trim(), isCorrect: Boolean(option.isCorrect) }))
                    }))
                });

                quizState.exists = true;
                quizState.questions = (saved.quiz.questions || []).map((question) => ({
                    prompt: question.prompt,
                    kind: question.kind,
                    explanation: question.explanation || '',
                    points: question.points,
                    options: (question.options || []).map((option) => ({ text: option.text, isCorrect: Boolean(option.isCorrect) }))
                }));

                refreshLessonModal();
                showToast('Quiz saved.', 'success');
            } catch (error) {
                WGAUI.setBusy(button, false);
                const detail = error.details && error.details.length ? error.details[0].message : null;
                showToast(detail || error.message || 'Could not save the quiz.', 'error');
            }
        };

        window.quizRemove = async function quizRemove() {
            const lessonId = quizState.lessonId || (lessonState.editing && lessonState.editing.id);
            if (!lessonId) return;
            if (!window.confirm('Remove this quiz? Student attempts are kept.')) return;

            try {
                await WGA.del('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(lessonId) + '/quiz');
                await resetQuizState(lessonId);
                refreshLessonModal();
                showToast('Quiz removed.', 'success');
            } catch (error) {
                showToast(error.message || 'Could not remove the quiz.', 'error');
            }
        };

        window.lessonNew = function lessonNew() {
            lessonState.quizOpen = false;
            lessonState.editing = { isNew: true, title: '', summary: '', type: 'video', content: '', durationMinutes: 0, isPreview: false, published: true, videoMode: 'none', materials: [] };
            resetQuizState(null);
            refreshLessonModal();
        };

        window.lessonEdit = async function lessonEdit(id) {
            const summary = lessonState.items.find((l) => String(l.id) === String(id));
            if (!summary) return;

            lessonState.quizOpen = false;

            /**
             * The syllabus list is a summary: it carries no notes, no video
             * address and no materials, only a resource count. Building the form
             * from it showed those fields empty, and saving wrote the emptiness
             * back over the real lesson — silently deleting them.
             */
            let lesson = summary;
            try {
                const full = await WGA.get(
                    '/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(id)
                );
                if (full && full.lesson) lesson = Object.assign({}, summary, full.lesson);
            } catch (error) {
                showToast(error.message || 'That lesson could not be loaded in full.', 'error');
            }

            lessonState.editing = Object.assign({}, lesson, {
                isNew: false,
                content: lesson.content || '',
                videoUrl: lesson.videoUrl || (lesson.video && lesson.video.url) || '',
                videoMode: lesson.videoType === 'upload' ? 'upload' : (lesson.videoType === 'link' ? 'link' : 'none'),
                isUploaded: lesson.videoType === 'upload',
                materials: (lesson.resources || []).map((resource) => ({
                    title: resource.title || '',
                    url: resource.url || ''
                }))
            });

            // Load the existing quiz before drawing the form, so the editor opens
            // with it rather than appearing empty and then filling in.
            await resetQuizState(id);
            refreshLessonModal();
        };

        window.lessonCancelEdit = function lessonCancelEdit() {
            lessonState.editing = null;
            refreshLessonModal();
        };

        window.setLessonVideoMode = function setLessonVideoMode() {
            const chosen = document.querySelector('input[name="lessonVideoMode"]:checked');
            const mode = chosen ? chosen.value : 'none';
            const link = document.getElementById('lessonLinkPane');
            const upload = document.getElementById('lessonUploadPane');
            if (link) link.style.display = mode === 'link' ? 'block' : 'none';
            if (upload) upload.style.display = mode === 'upload' ? 'block' : 'none';
        };

        function bindLessonModal() {
            const modal = document.getElementById('modalBody') || document;
            if (modal.querySelector && modal.querySelector('input[name="lessonVideoMode"]')) setLessonVideoMode();
            if (document.getElementById('lessonVideoUrl')) updateVideoPreview();
            mountLessonEditor();
        }

        /*
         * The rich-text editor.
         *
         * Quill writes into a hidden `#lessonContent`, so everything downstream —
         * captureLessonForm, the redraws, lessonSave — keeps reading one plain
         * input and none of it had to change.
         *
         * The toolbar is deliberately only the formats the server keeps. Offering
         * a button whose output the sanitizer strips would let an instructor watch
         * their formatting disappear on save with no explanation.
         */
        const LESSON_TOOLBAR = [
            ['bold', 'italic', 'underline', 'strike'],
            [{ header: [2, 3, 4] }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            [{ align: [] }],
            ['blockquote', 'code-block'],
            ['link'],
            ['clean']
        ];

        function mountLessonEditor() {
            const host = document.getElementById('lessonRichEditor');
            const field = document.getElementById('lessonContent');
            if (!host || !field) return;

            lessonState.editor = null;

            // If the vendored script did not load, writing notes still has to work.
            if (typeof window.Quill !== 'function') {
                const area = document.createElement('textarea');
                area.rows = 8;
                area.value = field.value;
                area.addEventListener('input', () => { field.value = area.value; });
                host.replaceWith(area);
                return;
            }

            const quill = new window.Quill(host, {
                theme: 'snow',
                placeholder: 'What this lesson covers. Shown under the video.',
                modules: { toolbar: LESSON_TOOLBAR }
            });

            if (field.value) quill.clipboard.dangerouslyPasteHTML(field.value);

            quill.on('text-change', () => {
                // An empty Quill document is a single empty paragraph, which would
                // be saved as "<p><br></p>" and then render as a stray blank block.
                const html = quill.root.innerHTML.trim();
                field.value = html === '<p><br></p>' ? '' : html;
            });

            lessonState.editor = quill;
        }

        /* ---- Materials, as rows rather than one textarea ----------------
         *
         * "Title | URL" per line was compact to write and impossible to check: a
         * missing pipe silently dropped a material. A row cannot be misunderstood,
         * and each half is one input wide, which is what a phone keyboard needs.
         */
        function materialRowsHTML(editing) {
            const materials = (editing && editing.materials) || [];

            if (!materials.length) {
                return `<p class="lesson-hint" style="margin:0 0 10px;">No materials yet.</p>`;
            }

            return materials
                .map(
                    (material, index) => `
                    <div class="material-row">
                        <input type="text" class="material-title" maxlength="200" placeholder="Title, e.g. Worksheet" value="${WGAUI.escapeHtml(material.title || '')}" aria-label="Material title" />
                        <input type="url" class="material-url" maxlength="2000" placeholder="https://example.com/worksheet.pdf" value="${WGAUI.escapeHtml(material.url || '')}" aria-label="Material address" />
                        <button type="button" class="btn-primary btn-outline btn-sm material-remove" onclick="removeMaterial(${index})" title="Remove">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `
                )
                .join('');
        }

        window.addMaterial = function addMaterial() {
            captureLessonForm();
            const editing = lessonState.editing;
            if (!editing) return;
            editing.materials = (editing.materials || []).concat({ title: '', url: '' });
            redrawLessonModal();
        };

        window.removeMaterial = function removeMaterial(index) {
            captureLessonForm();
            const editing = lessonState.editing;
            if (!editing) return;
            editing.materials = (editing.materials || []).filter((_, position) => position !== index);
            redrawLessonModal();
        };

        /** The quiz is a lot of form for something most lessons do not have. */
        window.toggleQuizEditor = function toggleQuizEditor() {
            captureLessonForm();
            captureQuizForm();
            lessonState.quizOpen = !lessonState.quizOpen;
            redrawLessonModal();
        };

        /**
         * Show the video's own thumbnail once the address is recognisably one.
         *
         * Only YouTube can be looked up without a third party: the thumbnail is
         * served from a fixed path. Vimeo needs an API call, so it gets a plain
         * confirmation instead of an invented image.
         */
        window.updateVideoPreview = function updateVideoPreview() {
            const field = document.getElementById('lessonVideoUrl');
            const holder = document.getElementById('lessonVideoPreview');
            if (!field || !holder) return;

            const value = (field.value || '').trim();
            if (!value) {
                holder.innerHTML = '';
                return;
            }

            let host = '';
            let id = '';

            try {
                const url = new URL(value);
                host = url.hostname.toLowerCase().replace(/^www\./, '');

                if (host === 'youtu.be') {
                    id = url.pathname.slice(1).split('/')[0];
                } else if (host === 'youtube.com' || host === 'm.youtube.com') {
                    if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
                    else if (url.pathname.startsWith('/embed/')) id = url.pathname.split('/')[2] || '';
                    else if (url.pathname.startsWith('/shorts/')) id = url.pathname.split('/')[2] || '';
                }
            } catch (error) {
                holder.innerHTML = '';
                return;
            }

            if (id && /^[A-Za-z0-9_-]{6,20}$/.test(id)) {
                holder.innerHTML =
                    '<img src="https://img.youtube.com/vi/' + encodeURIComponent(id) + '/mqdefault.jpg" alt="" ' +
                    'style="width:100%;max-width:260px;border-radius:10px;display:block;margin-top:10px;" ' +
                    'onerror="this.remove()" />';
                return;
            }

            holder.innerHTML = host.includes('vimeo')
                ? '<p class="lesson-hint" style="margin:8px 0 0;"><i class="fas fa-check"></i> Vimeo link recognised.</p>'
                : '<p class="lesson-hint lesson-hint-warn" style="margin:8px 0 0;">That is not a YouTube or Vimeo address.</p>';
        };

        window.lessonSave = async function lessonSave(action, source) {
            const button = source || document.getElementById('lessonSaveBtn');
            const editing = lessonState.editing;
            if (!editing) return;

            // "Publish" and "Save draft" are the same write with one flag, so the
            // lesson cannot end up visible after somebody chose draft.
            const publish = action !== 'draft';

            const title = (document.getElementById('lessonTitle')?.value || '').trim();
            if (title.length < 2) { showToast('Give the lesson a title.', 'error'); return; }

            const videoMode = (document.querySelector('input[name="lessonVideoMode"]:checked') || {}).value || 'none';
            const videoUrl = (document.getElementById('lessonVideoUrl')?.value || '').trim();

            if (videoMode === 'link' && !videoUrl) { showToast('Paste a YouTube or Vimeo address, or choose No video.', 'error'); return; }

            const materials = [...document.querySelectorAll('#lessonMaterials .material-row')]
                .map((row) => ({
                    title: row.querySelector('.material-title')?.value.trim() || '',
                    url: row.querySelector('.material-url')?.value.trim() || ''
                }))
                .filter((item) => item.title || item.url);

            const incomplete = materials.find((item) => !item.title || !/^https?:\/\//i.test(item.url));
            if (incomplete) {
                showToast('Each material needs a title and an address starting with http:// or https://.', 'error');
                return;
            }

            const payload = {
                title: title,
                summary: (document.getElementById('lessonSummary')?.value || '').trim(),
                type: document.getElementById('lessonType')?.value || 'video',
                content: document.getElementById('lessonContent')?.value || '',
                durationMinutes: Number(document.getElementById('lessonDuration')?.value || 0),
                isPreview: Boolean(document.getElementById('lessonPreview')?.checked),
                published: publish,
                resources: materials
            };

            WGAUI.setBusy(button, true, 'Saving…');

            try {
                let lesson;
                if (editing.isNew) {
                    lesson = (await WGA.post('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons', payload)).lesson;
                } else {
                    lesson = (await WGA.patch('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(editing.id), payload)).lesson;
                }

                const id = lesson.id || editing.id;
                // The redraw below builds from this object, so it has to carry what
                // was just saved — otherwise saving an upload wipes the notes field.
                lessonState.editing = Object.assign({}, editing, {
                    isNew: false,
                    id: id,
                    isUploaded: lesson.videoType === 'upload',
                    content: payload.content,
                    materials: materials
                });
                // A lesson that has just been created can now carry a quiz, so the
                // editor stops saying "save the lesson first".
                if (!quizState.lessonId) quizState.lessonId = id;

                /**
                 * The video is saved separately from the lesson, because it is a
                 * different operation: a link is a field, an upload is a file that
                 * has to land in a bucket. Switching between them replaces the
                 * other, which is why this runs after the lesson itself exists.
                 */
                if (videoMode === 'none') {
                    if (lesson.videoType !== 'none') {
                        await WGA.del('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(id) + '/video');
                        lessonState.editing.isUploaded = false;
                    }
                } else if (videoMode === 'link') {
                    await WGA.put('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(id) + '/video/link', { url: videoUrl });
                }

                await refreshLessons();
                showToast(
                    publish
                        ? (editing.isNew ? 'Lesson published.' : 'Lesson saved and published.')
                        : 'Draft saved. Students cannot see it yet.',
                    'success'
                );

                // An upload needs the lesson to exist first, so the file picker and
                // progress bar stay on screen for it rather than the modal closing.
                if (videoMode === 'upload') {
                    refreshLessonModal();
                } else {
                    lessonState.editing = null;
                    refreshLessonModal();
                }
            } catch (error) {
                WGAUI.setBusy(button, false);
                const detail = error.details && error.details.length ? error.details[0].message : null;
                showToast(detail || error.message || 'We could not save that lesson.', 'error');
            }
        };

        window.lessonDelete = async function lessonDelete(id) {
            const lesson = lessonState.items.find((l) => String(l.id) === String(id));
            if (!lesson) return;
            if (!window.confirm('Delete "' + lesson.title + '"? Student progress for this lesson is removed too.')) return;

            try {
                await WGA.del('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(id));
                if (lessonState.editing && String(lessonState.editing.id) === String(id)) lessonState.editing = null;
                await refreshLessons();
                refreshLessonModal();
                showToast('Lesson removed.', 'success');
            } catch (error) {
                showToast(error.message || 'Could not remove that lesson.', 'error');
            }
        };

        /** Swap with the neighbour, which is what the API does with an order change. */
        window.lessonMove = async function lessonMove(id, delta) {
            const index = lessonState.items.findIndex((l) => String(l.id) === String(id));
            const target = index + delta;
            if (index === -1 || target < 0 || target >= lessonState.items.length) return;

            try {
                await WGA.patch('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(id), { order: target + 1 });

        window.uploadLessonVideo = async function uploadLessonVideo() {
            const editing = lessonState.editing;
            const file = document.getElementById('lessonVideoFile')?.files?.[0];

            if (!editing || editing.isNew || !editing.id) {
                showToast('Save the lesson first, then upload its video.', 'error');
                return;
            }
            if (!file) { showToast('Choose a video file first.', 'error'); return; }

            const button = document.getElementById('lessonUploadBtn');
            const bar = document.getElementById('lessonUploadBar');
            const note = document.getElementById('lessonUploadNote');

            WGAUI.setBusy(button, true, 'Preparing…');

            try {
                const signed = await WGA.post('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(editing.id) + '/video/presign', {
                    filename: file.name,
                    contentType: file.type,
                    sizeBytes: file.size
                });

                if (bar) { bar.style.display = 'block'; bar.firstElementChild.style.width = '0%'; }
                WGAUI.setBusy(button, true, 'Uploading…');

                await WGA.uploadToSignedUrl(signed.uploadUrl, file, {
                    contentType: signed.contentType,
                    onProgress: (percent) => {
                        if (bar) bar.firstElementChild.style.width = percent + '%';
                        WGAUI.setBusy(button, true, percent + '%');
                    }
                });

                if (note) note.textContent = 'Uploaded. Confirming with the server…';

                await WGA.post('/courses/' + encodeURIComponent(lessonState.courseId) + '/lessons/' + encodeURIComponent(editing.id) + '/video/complete', {
                    key: signed.key,
                    mime: file.type,
                    originalName: file.name
                });

                await refreshLessons();
                lessonState.editing.isUploaded = true;
                refreshLessonModal();
                showToast('Video uploaded.', 'success');
            } catch (error) {
                WGAUI.setBusy(button, false);
                if (note) note.textContent = '';
                showToast(error.message || 'The upload did not finish.', 'error');
            }
        };

            const button = document.querySelector('#main-content .btn-primary:not(.btn-outline)');
            const title = document.getElementById('courseTitle')?.value.trim();
            const summary = document.getElementById('courseDesc')?.value.trim();
            const price = Number(document.getElementById('coursePrice')?.value || 0);
            const category = document.getElementById('courseCat')?.value;
            const credential = document.getElementById('courseCredential')?.value || 'certificate';
            const level = (document.getElementById('courseLevel')?.value || 'beginner').toLowerCase();

            if (!title || title.length < 4) {
                showToast('Give the course a title of at least 4 characters.', 'error');
                return;
            }

            // The list comes from the API. If it did not load, the select holds no
            // value — refuse rather than filing the course under the model default.
            if (!category) {
                showToast('The category list did not load. Reload the page and try again.', 'error');
                return;
            }

            WGAUI.setBusy(button, true, 'Creating…');

            try {
                const created = await WGA.post('/courses', {
                    title,
                    summary: summary || undefined,
                    priceCents: Math.max(0, Math.round(price * 100)),
                    certificateFeeCents: Number(document.getElementById('courseCertificateFee')?.value || 0),
                    category: category || undefined,
                    credential,
                    level,
                });

                const courseId = created.course.id;

                // The cover is uploaded after the course exists, because the endpoint is
                // addressed to a course id. If it fails, the course is still saved rather
                // than everything the instructor just typed being thrown away.
                const pendingCover = document.getElementById('courseThumbPreview')?.dataset.prepared;
                if (pendingCover) await sendCourseCover(courseId, pendingCover);

                if (submitForReview) {
                    // Publishing with no lessons is refused by the API, which is
                    // the correct answer — surface it rather than losing the course.
                    try {
                        await WGA.post(`/courses/${encodeURIComponent(courseId)}/publish`);

                        showToast(
                            `Course saved as a draft. ${publishError.message || 'Add a lesson before submitting.'}`,
                            'info'

                } else {
                    showToast('Course saved as a draft.', 'success');
                }

                await loadInstructorData();
                loadPage('courses');
            } catch (error) {
                WGAUI.setBusy(button, false);

                if (error.details && error.details.length) {
                    showToast(error.details[0].message, 'error');
                    return;
                }
                showToast(error.message || 'We could not create that course.', 'error');
            }
        };

        /**
         * A CV is read in the browser and sent as a data URL, which is how every
         * other upload on this deployment travels: there is no multipart parser.
         * The server checks the bytes; these checks exist to fail fast with a
         * useful message rather than after half a megabyte has gone up.
         */
        window.uploadCv = function uploadCv(button) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/pdf,.pdf';

            input.addEventListener('change', async () => {
                const file = input.files && input.files[0];
                if (!file) return;

                if (file.type && file.type !== 'application/pdf') {
                    showToast('Choose a PDF file. Other formats are not accepted.', 'error');
                    return;
                }

                if (file.size > 500 * 1024) {
                    showToast('That file is too large. Keep the CV under 500 KB.', 'error');
                    return;
                }

                if (button) WGAUI.setBusy(button, true, 'Uploading...');

                try {
                    const dataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(String(reader.result || ''));
                        reader.onerror = () => reject(new Error('That file could not be read.'));
                        reader.readAsDataURL(file);
                    });

                    const result = await WGA.put('/auth/me/cv', { image: dataUrl, filename: file.name });
                    instructorData.user = Object.assign({}, instructorData.user, result.user);
                    WGA.setSession({ user: instructorData.user });

                    showToast('CV sent for review.', 'success');
                    loadPage('profile');
                } catch (error) {
                    const details = Array.isArray(error.details) ? error.details : [];
                    showToast(
                        (details[0] && details[0].message) || error.message || 'We could not upload that CV.',
                        'error'
                    );
                    if (button) WGAUI.setBusy(button, false);
                }
            });

            input.click();
        };

        /** The owner's copy of their own CV. */
        window.downloadMyCv = async function downloadMyCv(button) {
            if (button) WGAUI.setBusy(button, true, '...');

            try {
                const response = await fetch(WGA.API_BASE + '/auth/me/cv', {
                    headers: { Authorization: 'Bearer ' + WGA.getAccessToken() },
                });

                if (!response.ok) {
                    let message = 'We could not fetch your CV.';
                    try {
                        const payload = await response.json();
                        if (payload && payload.message) message = payload.message;
                    } catch (error) {
                        /* not json */
                    }
                    throw new Error(message);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');

                link.href = url;
                link.download = 'my-cv.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } catch (error) {
                showToast(error.message || 'We could not fetch your CV.', 'error');
            } finally {
                if (button) WGAUI.setBusy(button, false);
            }
        };

        window.checkIntroUrl = function checkIntroUrl() {
            const input = document.getElementById('pVideoIntro');
            const note = document.getElementById('pVideoIntroNote');
            if (!input || !note) return;

            const value = (input.value || '').trim();
            const defaultText = 'A YouTube or Vimeo link where you introduce yourself. Shown on your course pages.';

            if (!value) {
                note.textContent = defaultText;
                note.classList.remove('lesson-hint-warn');
                return;
            }

            let looksRight = false;
            try {
                const url = new URL(value);
                const host = url.hostname.toLowerCase();
                looksRight = /^https?:$/.test(url.protocol) && (host.includes('youtube') || host.includes('youtu.be') || host.includes('vimeo'));
            } catch (error) {
                looksRight = false;
            }

            note.textContent = looksRight
                ? 'That looks like a video link. It is checked again when you save.'
                : 'Use a YouTube or Vimeo link. Other addresses cannot be embedded.';
            note.classList.toggle('lesson-hint-warn', !looksRight);
        };

        window.openChangePassword = function openChangePassword() {
            openModal('🔑 Change Password', `
                <div class="form-group"><label>Current password</label><input type="password" id="cpCurrent" /></div>
                <div class="form-group"><label>New password</label><input type="password" id="cpNew" /></div>
                <div class="form-group"><label>Confirm new password</label><input type="password" id="cpConfirm" /></div>
                <p style="font-size:12.5px;color:var(--text-light);margin-bottom:14px;">At least 8 characters, including a letter and a number. You will be signed out of every other device.</p>
                <button class="btn-primary" id="cpSubmit" onclick="submitChangePassword()">Update password</button>
            `);
        };

        window.submitChangePassword = async function submitChangePassword() {
            const button = document.getElementById('cpSubmit');
            const currentPassword = document.getElementById('cpCurrent')?.value || '';
            const newPassword = document.getElementById('cpNew')?.value || '';
            const confirmPassword = document.getElementById('cpConfirm')?.value || '';

            if (!currentPassword || !newPassword) {
                showToast('Fill in both password fields.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('The two new passwords do not match.', 'error');
                return;
            }

            WGAUI.setBusy(button, true, 'Saving…');

            try {
                const data = await WGA.post('/auth/change-password', { currentPassword, newPassword });

                // The API revokes every other session and issues a fresh pair for
                // this device, so keep the instructor signed in here.
                WGA.setSession(data);
                closeModal();
                showToast('Your password has been changed. Other devices were signed out.', 'success');
            } catch (error) {
                WGAUI.setBusy(button, false);
                showToast(error.message || 'We could not change your password.', 'error');
            }
        };

        /** Download the loaded student list as CSV, generated in the browser. */
        window.exportStudentsCsv = function exportStudentsCsv() {
            const rows = [['Name', 'Email', 'Course', 'Progress', 'Enrolled', 'Last active']];

            instructorData.students.forEach((s) => {
                rows.push([
                    s.name,
                    s.email,
                    s.courseTitle,
                    `${s.progress}%`,
                    s.enrolledAt ? new Date(s.enrolledAt).toISOString().slice(0, 10) : '',
                    s.lastActive ? new Date(s.lastActive).toISOString().slice(0, 10) : 'Never',
                ]);
            });

            const escapeCell = (value) => `"${String(value === null || value === undefined ? '' : value).replace(/"/g, '""')}"`;
            const csv = rows.map((row) => row.map(escapeCell).join(',')).join('\r\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = `students-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`Exported ${instructorData.students.length} rows.`, 'success');
        };

        // A client-side filter over the rows already loaded. The API says the same
        // thing, so the page can be honest about the scope of the search.
        window.filterStudents = function filterStudents() {
            const search = (document.getElementById('searchStudent')?.value || '').toLowerCase();

            document.querySelectorAll('.student-row').forEach((row) => {
                const haystack = (row.getAttribute('data-name') || '') + ' ' + (row.getAttribute('data-email') || '');
                row.style.display = haystack.includes(search) ? '' : 'none';
            });
        };

        // ============================================================
        //  NOTIFICATIONS
        // ============================================================
        function loadNotifications() {
            const container = document.getElementById('notifList');
            if (!container) return;

            // Real notifications. This list used to be three hardcoded entries —
            // "John Doe enrolled in your course", "5 new submissions for ML Quiz",
            // "Your course has been approved" — shown to every instructor
            // regardless of what had actually happened.
            if (instructorData.notifications.length === 0) {
                container.innerHTML =
                    '<div style="padding:26px;text-align:center;color:var(--text-light);font-size:14px;">' +
                    'No notifications yet.</div>';
                return;
            }

            container.innerHTML = instructorData.notifications
                .map((n) => `
                    <div class="notification-item ${n.read ? '' : 'unread'}"${n.link ? ` style="cursor:pointer;" onclick="window.location.href='${n.link}'"` : ''}>
                        <strong>${WGAUI.escapeHtml(n.title)}</strong>
                        <p>${WGAUI.escapeHtml(n.message)}</p>
                        <span style="font-size:12px;color:var(--text-light);">${WGAUI.formatRelative(n.createdAt)}</span>
                    </div>
                `)
                .join('');
        }

        // ============================================================
        //  PAGE NAVIGATION
        // ============================================================
        async function loadPage(page) {
            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div></div>';
            state.currentPage = page;

            setTimeout(() => {
                let html = '';
                switch (page) {
                    case 'overview':
                        html = renderOverview();
                        break;
                    case 'courses':
                        html = renderCourses();
                        break;
                    case 'create-course':
                        html = renderCreateCourse();
                        break;
                    case 'students':
                        html = renderStudents();
                        break;
                    case 'live-classes':
                        html = renderLiveClasses();
                        break;
                    case 'earnings':
                        html = renderEarnings();
                        break;
                    case 'messages':
                        html = renderMessages();
                        break;
                    case 'profile':
                        html = renderProfile();
                        break;
                    default:
                        html = renderOverview();
                }
                content.innerHTML = html;
                observeCounters();

                // The course list is fetched on demand: the summary payload only
                // carries the twelve most recent courses, which is not the list
                // this page is meant to show.
                if (page === 'courses') loadMyCourses(state.coursePage || 1);

                // Revenue breakdown, drawn from real payment totals per course.
                if (page === 'earnings') {
                    setTimeout(() => {
                        const ctx = document.getElementById('earningsChart')?.getContext('2d');
                        const breakdown = (instructorData.revenue && instructorData.revenue.byCourse) || [];

                        if (!ctx || breakdown.length === 0) return;

                        // A doughnut is a share-of-total chart, and shares only add
                        // up inside one currency. If the courses were sold in more
                        // than one, the table below carries the real figures and we
                        // draw nothing rather than a shape that means nothing.
                        if (breakdown.some((row) => row.mixedCurrency) || new Set(breakdown.map((row) => row.currency)).size > 1) {
                            const card = ctx.canvas.closest('.chart-card');
                            if (card) {
                                card.innerHTML = '<div class="chart-title">Revenue by course</div>' +
                                    '<p style="color:var(--text-light);font-size:13.5px;margin:0;">Your courses sold in more than one currency, so a single breakdown chart would not add up. The figures are listed per course below.</p>';
                            }
                            return;
                        }

                        new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: breakdown.map((row) => row.title),
                                datasets: [{
                                    data: breakdown.map((row) => row.totalCents / 100),
                                    backgroundColor: ['#1a56db', '#d4a547', '#10b981', '#8b5cf6', '#06b6d4', '#ef4444']
                                }]
                            },
                            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                        });
                    }, 150);
                }
            }, 300);

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.toggle('active', link.getAttribute('data-page') === page);
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            if (!checkAuth()) return;

            // Load before the first render so the overview is real. A failure
            // says so, rather than showing zeroes that read as "you have no
            // students" instead of "we could not reach the server".
            const content = document.getElementById('main-content');
            content.innerHTML = '<div style="text-align:center;padding:60px;"><div class="loading-spinner"></div></div>';

            try {
                await loadInstructorData();
            } catch (error) {
                content.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-triangle-exclamation"></i>
                        <h3>We could not load your dashboard</h3>
                        <p>${WGAUI.escapeHtml(error.message || 'Please try again in a moment.')}</p>
                        <button class="btn-primary" onclick="window.location.reload()">Try again</button>
                    </div>`;
                return;
            }

            await loadPage('overview');
            loadNotifications();

            // The header was drawn from the stored user before the profile
            // arrived; redraw it now that the real name and photo are known.
            renderHeaderAvatar();

            // Sign out through the API so the refresh token is revoked on the
            // server. Clearing localStorage alone leaves a live session that
            // anyone holding the token could keep using.
            document.getElementById('logout-btn').addEventListener('click', () => {
                WGA.logout().finally(() => {
                    window.location.href = '/login.html?reason=signout';
                });
            });

            document.getElementById('notifBtn').addEventListener('click', () => {
                document.getElementById('notifPanel').classList.toggle('open');
                loadNotifications();
            });
            document.getElementById('closeNotif').addEventListener('click', () => {
                document.getElementById('notifPanel').classList.remove('open');
            });

            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });

            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = link.getAttribute('data-page');
                    loadPage(page);
                    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
                });
            });

            const themeToggle = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
            });

            document.getElementById('globalSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = e.target.value.trim();
                    if (val) showToast(`Searching for "${val}"...`, 'info');
                }
            });
        }

        init();
    </script>
</body>
</html>
